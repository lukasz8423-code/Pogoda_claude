// ─────────────────────────────────────────────────────────────
// IMGW OFFLINE → MULTI-MODEL ENSEMBLE
// IMGW jest źródłem obserwacji, nie może być fallbackiem zerującym
// prognozę. Gdy feed IMGW nie odpowiada, prognoza przechodzi na
// niezależny consensus ICON-EU + ECMWF IFS + GFS.
// ─────────────────────────────────────────────────────────────
const OFFLINE_ENSEMBLE_MODELS=["icon_eu","ecmwf_ifs025","gfs_seamless"];

function ensembleFinite(values){
  const a=values.map(Number).filter(Number.isFinite);
  if(!a.length)return null;
  return a.reduce((s,v)=>s+v,0)/a.length;
}
function ensembleCircular(values){
  const a=values.map(Number).filter(Number.isFinite);
  if(!a.length)return null;
  let sx=0,sy=0;
  a.forEach(v=>{const r=v*Math.PI/180;sx+=Math.cos(r);sy+=Math.sin(r);});
  const d=(Math.atan2(sy, sx)*180/Math.PI+360)%360;
  return d;
}
function ensembleCode(records,field,index){
  const candidates=records.map(r=>{
    const v=Number(r.data?.[field]?.[index]);
    const prob=Number(r.data?.hourly?.precipitation_probability?.[index]);
    const precip=Number(r.data?.hourly?.precipitation?.[index]);
    return Number.isFinite(v)?{v,prob:Number.isFinite(prob)?prob:0,precip:Number.isFinite(precip)?precip:0}:null;
  }).filter(Boolean);
  if(!candidates.length)return null;
  // Przy rozbieżnych kodach wybieramy warunek o największym sygnale opadowym;
  // dzięki temu deszcz nie zostaje zgubiony przez większość "suchych" kodów.
  candidates.sort((a,b)=>(b.prob-a.prob)||(b.precip-a.precip));
  return candidates[0].v;
}
function ensembleDailyCode(records,index){
  const candidates=records.map(r=>{
    const v=Number(r.data?.daily?.weather_code?.[index]);
    const precip=Number(r.data?.daily?.precipitation_sum?.[index]);
    const prob=Number(r.data?.daily?.precipitation_probability_max?.[index]);
    return Number.isFinite(v)?{v,precip:Number.isFinite(precip)?precip:0,prob:Number.isFinite(prob)?prob:0}:null;
  }).filter(Boolean);
  if(!candidates.length)return null;
  candidates.sort((a,b)=>(b.precip-a.precip)||(b.prob-a.prob));
  return candidates[0].v;
}
function ensembleArray(records,path,indexer){
  const vals=records.map(indexer).filter(Number.isFinite);
  return ensembleFinite(vals);
}
function buildOfflineEnsemble(modelResults){
  const records=modelResults.filter(r=>OFFLINE_ENSEMBLE_MODELS.includes(r.model)&&r.data);
  if(!records.length)return null;
  const longestHourly=records.reduce((a,r)=>(r.data?.hourly?.time?.length||0)>(a.data?.hourly?.time?.length||0)?r:a,records[0]);
  const longestDaily=records.reduce((a,r)=>(r.data?.daily?.time?.length||0)>(a.data?.daily?.time?.length||0)?r:a,records[0]);
  const base=structuredClone(records[0].data);
  // Używamy osi czasu najdłuższego dostępnego modelu, ale wartości na tej osi
  // nadal liczymy jako średnią tylko z modeli, które mają dany slot.
  base.hourly.time=structuredClone(longestHourly.data.hourly.time||[]);
  base.daily.time=structuredClone(longestDaily.data.daily.time||[]);
  const numericCurrent=[
    "temperature_2m","relative_humidity_2m","apparent_temperature","precipitation",
    "rain","showers","snowfall","cloud_cover","visibility","pressure_msl",
    "wind_speed_10m","wind_gusts_10m","uv_index","uv_index_clear_sky","shortwave_radiation_instant"
  ];
  for(const key of numericCurrent){
    const v=ensembleArray(records,key,r=>Number(r.data?.current?.[key]));
    if(v!==null)base.current[key]=key==="relative_humidity_2m"?Math.round(v):+v.toFixed(2);
  }
  const currentDir=ensembleCircular(records.map(r=>Number(r.data?.current?.wind_direction_10m)));
  if(currentDir!==null)base.current.wind_direction_10m=Math.round(currentDir)%360;
  const hKeys=[
    "temperature_2m","relative_humidity_2m","precipitation_probability","precipitation",
    "cloud_cover","cloud_cover_low","cloud_cover_mid","cloud_cover_high",
    "apparent_temperature","uv_index","uv_index_clear_sky","wind_speed_10m",
    "wind_gusts_10m","shortwave_radiation","shortwave_radiation_instant","pressure_msl","visibility"
  ];
  const hLen=Math.max(...records.map(r=>r.data?.hourly?.time?.length||0));
  for(const key of hKeys){
    base.hourly[key]=Array.from({length:hLen},(_,i)=>{
      const v=ensembleArray(records,key,r=>Number(r.data?.hourly?.[key]?.[i]));
      if(v===null)return null;
      return key==="relative_humidity_2m"?Math.round(v):+v.toFixed(2);
    });
  }
  base.hourly.wind_direction_10m=Array.from({length:hLen},(_,i)=>{
    const v=ensembleCircular(records.map(r=>Number(r.data?.hourly?.wind_direction_10m?.[i])));
    return v===null?null:Math.round(v)%360;
  });
  base.hourly.weather_code=Array.from({length:hLen},(_,i)=>ensembleCode(records,"hourly",i));
  const dLen=Math.max(...records.map(r=>r.data?.daily?.time?.length||0));
  const dKeys=[
    "temperature_2m_max","temperature_2m_min","precipitation_probability_max",
    "uv_index_max","uv_index_clear_sky_max","precipitation_sum","wind_speed_10m_max"
  ];
  for(const key of dKeys){
    base.daily[key]=Array.from({length:dLen},(_,i)=>{
      const v=ensembleArray(records,key,r=>Number(r.data?.daily?.[key]?.[i]));
      if(v===null)return null;
      return key.startsWith("temperature")||key==="precipitation_sum"?+v.toFixed(1):+v.toFixed(1);
    });
  }
  base.daily.weather_code=Array.from({length:dLen},(_,i)=>ensembleDailyCode(records,i));
  // Czasy astronomiczne są wspólne dla lokalizacji — zachowujemy je z pierwszego
  // dostępnego modelu zamiast sztucznie je uśredniać.
  const cloudNow=ensembleFinite(records.map(r=>Number(r.data?.current?.cloud_cover)));
  base.__auraEnsemble={
    active:true,
    mode:"IMGW_OFFLINE",
    models:records.map(r=>r.model),
    modelCount:records.length,
    cloudCoverConsensus:cloudNow,
    cloudCover:cloudNow,
    capturedAt:Date.now()
  };
  return base;
}

function calcModelAgreement(temps){
  if(temps.length<2)return{pct:100,spread:0};
  const min=Math.min(...temps),max=Math.max(...temps);
  const spread=max-min;
  // Rozrzut 0-1°C = 95-100%, 1-3°C = 75-95%, 3-6°C = 50-75%, >6°C = <50%
  let pct;
  if(spread<=1)pct=95+Math.round((1-spread)*5);
  else if(spread<=3)pct=75+Math.round((3-spread)/2*20);
  else if(spread<=6)pct=50+Math.round((6-spread)/3*25);
  else pct=Math.max(20,50-Math.round((spread-6)*3));
  return{pct:Math.min(100,Math.max(20,pct)),spread:Math.round(spread*10)/10};
}

// Zapis historii prognoz do samo-weryfikacji trafności
function saveForecastHistory(lat,lng,city,predictedTemp,predictedCode){
  try{
    let hist=JSON.parse(localStorage.getItem("aura_forecast_hist")||"[]");
    hist.push({
      ts:Date.now(),lat,lng,city,
      predictedTemp,predictedCode,
      checkAt:Date.now()+3*3600*1000 // sprawdz za 3h
    });
    hist=hist.filter(h=>Date.now()-h.ts<7*24*3600*1000); // trzymaj 7 dni
    localStorage.setItem("aura_forecast_hist",JSON.stringify(hist.slice(-50)));
  }catch(e){}
}

function checkForecastAccuracy(actualTemp,actualCode){
  try{
    let hist=JSON.parse(localStorage.getItem("aura_forecast_hist")||"[]");
    const now=Date.now();
    let updated=false;
    hist.forEach(h=>{
      if(!h.verified && now>=h.checkAt && now-h.checkAt<3600*1000){
        h.actualTemp=actualTemp;
        h.actualCode=actualCode;
        h.tempDiff=Math.abs(h.predictedTemp-actualTemp);
        h.codeMatch=Math.abs(h.predictedCode-actualCode)<10;
        h.verified=true;
        updated=true;
      }
    });
    if(updated)localStorage.setItem("aura_forecast_hist",JSON.stringify(hist));
  }catch(e){}
}

function getAccuracyStats(){
  try{
    const hist=JSON.parse(localStorage.getItem("aura_forecast_hist")||"[]");
    const verified=hist.filter(h=>h.verified);
    if(verified.length<3)return null;
    const avgDiff=verified.reduce((s,h)=>s+h.tempDiff,0)/verified.length;
    const accuracy=Math.max(0,Math.min(100,Math.round(100-avgDiff*15)));
    return{accuracy,count:verified.length,avgDiff:Math.round(avgDiff*10)/10};
  }catch(e){return null;}
}

function getHistory(){try{return JSON.parse(localStorage.getItem("aura_hist")||"[]");}catch{return[];}}
function saveHistory(city,lat,lng){

  h.unshift({n:city,lat,lng});

}

    });

    if(localRegion)TOWNS.forEach(t=>{

      ctx.fillStyle=t.c?"#818CF8":"#94A3B8";ctx.beginPath();ctx.arc(tx,ty+2,t.c?3.5:2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=t.c?"#fff":"#CBD5E1";ctx.fillText(t.name,tx,ty-3);
    });
    ctx.restore();RAF=requestAnimationFrame(draw);
  }

}

// Punkt rosy (wzór Magnusa)
function dewPoint(t,rh){
  if(t==null||rh==null||rh<=0)return null;
  const a=17.62,b=243.12,g=Math.log(rh/100)+a*t/(b+t);
  return b*g/(a-g);
}

// Kolor temperatury (dla pasków zakresu)
function tempColor(t){
  const st=[[-10,[90,160,255]],[0,[125,211,252]],[8,[150,231,196]],[15,[200,232,110]],[22,[255,210,77]],[28,[255,154,61]],[35,[255,94,77]]];
  if(t<=st[0][0])return`rgb(${st[0][1]})`;
  for(let i=1;i<st.length;i++){
    if(t<=st[i][0]){
      const [t0,c0]=st[i-1],[t1,c1]=st[i],k=(t-t0)/(t1-t0);
      return`rgb(${c0.map((v,j)=>Math.round(v+(c1[j]-v)*k))})`;
    }
  }
  return`rgb(${st[st.length-1][1]})`;
}

// Opad co 15 min na najbliższe 2h (styl MinuteCast z AccuWeather)
function correctMinutelyPrecipitation(slots, imgwData){
  if(!Array.isArray(slots)) return [];

  const stationPrecip=Number(imgwData?.opad_10min);
  const stationAge=Number(imgwData?.opad10minAgeMinutes);
  const stationDist=Number(imgwData?.dist);

  const stationDry=
    imgwData?.opad10minFresh===true &&
    Number.isFinite(stationPrecip) &&
    stationPrecip<=0 &&
    Number.isFinite(stationDist) &&
    stationDist<=45 &&
    (!Number.isFinite(stationAge)||stationAge<=IMGW_MAX_FIELD_AGE_MINUTES);

  const nowMs = Date.now();

  return slots.map((slot, idx)=>{
    const mm=Number(slot?.mm);
    if(!Number.isFinite(mm)) return slot;

    const slotTime = slot?.t ? new Date(slot.t).getTime() : (nowMs + idx * 15 * 60000);
    const isNowSlot = Number.isFinite(slotTime) && (slotTime <= nowMs + 15 * 60000);

    if(stationDry && ((isNowSlot && mm > 0) || (mm > 0 && mm <= 0.5))){
      const hourlyMm=Number(slot?.hourlyMm);
      return {
        ...slot,
        mm:0,
        rain:0,
        code:isRainCode(Number(slot?.code))?0:slot?.code,
        hourlyMm:Number.isFinite(hourlyMm)&&hourlyMm<=0.5?0:slot?.hourlyMm,
        precipitationCorrected:true,
        precipitationCorrectionReason:"IMGW_Glodowo_0mm"
      };
    }

    return slot;
  });
}

async function apiMinutely(lat,lng){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&minutely_15=precipitation,rain,weather_code,visibility&hourly=precipitation,precipitation_probability&forecast_days=2&past_minutely_15=1&timezone=auto`,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)return null;
    const d=await r.json();
    const t=d.minutely_15?.time,p=d.minutely_15?.precipitation,rain=d.minutely_15?.rain,code=d.minutely_15?.weather_code,visibility=d.minutely_15?.visibility;
    const ht=d.hourly?.time,hp=d.hourly?.precipitation_probability,hpr=d.hourly?.precipitation;
    if(!t||!p)return null;
    const now=Date.now();
    let idx=-1;
    for(let i=0;i<t.length;i++){if(new Date(t[i]).getTime()<=now)idx=i;else break;}
    if(idx<0)return null;
    const out=[];
    // Każdy slot 15-min pokazujemy jako własny przedział czasowy.
    // Prawdopodobieństwo (POP) jest pobierane z godziny zawierającej slot.
    for(let i=idx;i<=idx+16&&i<t.length;i++){
      const tm=new Date(t[i]).getTime();
      // Przypisujemy 15-min slot do godziny, w której faktycznie leży.
      // findIndex(>=) przesuwało np. 09:15 na dane godziny 10:00.
      let hi=-1;
      if(Array.isArray(ht)){
        for(let j=0;j<ht.length;j++){
          const htm=new Date(ht[j]).getTime();
          if(Number.isFinite(htm)&&htm<=tm)hi=j;else if(htm>tm)break;
        }
      }
      out.push({
        t:t[i],
        mm:+(p[i]||0),
        rain:+(rain?.[i]||0),
        code:code?.[i]!=null?+code[i]:null,
        visibility:visibility?.[i]!=null?+visibility[i]:null,
        pop:hi>=0&&hp?.[hi]!=null?+hp[hi]:null,
        hourlyMm:hi>=0&&hpr?.[hi]!=null?+(hpr[hi]||0):null
      });
    }
    return out.length>=4?out:null;
  }catch{return null;}
}

function sunInfo(daily,now=new Date()){
  const sr=daily?.sunrise?.[0]?new Date(daily.sunrise[0]):null;
  const ss=daily?.sunset?.[0]?new Date(daily.sunset[0]):null;
  if(!sr||!ss||isNaN(sr)||isNaN(ss)){
    const h=now.getHours()+now.getMinutes()/60;
    return{sr:null,ss:null,f:null,day:h>=6&&h<19,e:h>=6&&h<19?Math.sin(Math.PI*(h-6)/13):-1};
  }
  const t=+now,a=+sr,b=+ss;
  if(t>=a&&t<=b){const f=(t-a)/(b-a);return{sr,ss,f,day:true,e:Math.sin(Math.PI*f)};}
  const mins=(t<a?a-t:t-b)/60000;
  return{sr,ss,f:t<a?0:1,day:false,e:-clamp(mins/100,0,1)};
}
const SKY_STOPS=[
  [-1,   [6,12,36],   [26,40,82]],
  [-.25, [24,34,84],  [92,86,140]],
  [0,    [50,66,128], [236,140,98]],
  [.18,  [58,104,178],[244,178,110]],
  [.5,   [24,94,190], [122,190,240]],
];
function mixRGB(a,b,k){return a.map((v,i)=>v+(b[i]-v)*k);}
function skyColors(e,cloud,precip,storm){
  let top,bot;
  e=clamp(e,-1,1);
  if(e>=SKY_STOPS[SKY_STOPS.length-1][0]){top=SKY_STOPS[SKY_STOPS.length-1][1];bot=SKY_STOPS[SKY_STOPS.length-1][2];}
  else{
    for(let i=1;i<SKY_STOPS.length;i++){
      if(e<=SKY_STOPS[i][0]){
        const k=(e-SKY_STOPS[i-1][0])/(SKY_STOPS[i][0]-SKY_STOPS[i-1][0]);
        top=mixRGB(SKY_STOPS[i-1][1],SKY_STOPS[i][1],k);bot=mixRGB(SKY_STOPS[i-1][2],SKY_STOPS[i][2],k);break;
      }
    }
  }
  const m=clamp((cloud/100)*.78+(precip>0?.14:0)+(storm?.15:0),0,.92);
  const gray=c=>{const l=.3*c[0]+.59*c[1]+.11*c[2];return[l*.9+8,l*.96+14,l+24];};
  const dark=storm?.72:precip>0?.86:1;
  top=mixRGB(top,gray(top),m).map(v=>v*dark);
  bot=mixRGB(bot,gray(bot),m).map(v=>v*dark);
  const css=c=>`rgb(${c.map(v=>Math.round(clamp(v,0,255))).join(",")})`;
  return{top:css(top),bot:css(bot)};
}

function applyTheme(X){
  const mode=getThemeMode();
  document.documentElement.setAttribute("data-theme",mode);
  if(mode==="dark"){
    document.documentElement.style.setProperty("--st","#070c1a");
    document.documentElement.style.setProperty("--sb","#101a35");
    const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content","#070c1a");
  }else if(mode==="oled"){
    document.documentElement.style.setProperty("--st","#000000");
    document.documentElement.style.setProperty("--sb","#040810");
    const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content","#000000");
  }else if(mode==="light"){
    document.documentElement.style.setProperty("--st","#93c5fd");
    document.documentElement.style.setProperty("--sb","#dbeafe");
    const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content","#93c5fd");
  }else{
    const now=new Date();
    const h=now.getHours()+now.getMinutes()/60;
    let e,cloud=25,precip=0,storm=false;
    if(X){e=X.sun.e;cloud=X.cloud;precip=X.precip>0.05||X.code>=51&&X.code<=82?1:0;storm=X.code>=95;}
    else e=h>=6&&h<19?Math.sin(Math.PI*(h-6)/13):-.9;
    const c=skyColors(e,cloud,precip,storm);
    const r=document.documentElement.style;
    r.setProperty("--st",c.top);r.setProperty("--sb",c.bot);
    const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",c.top);
  }
}

// WEATHER FUSION — Cloud Cover Engine
// To jest estymacja wizualna, a nie zamiennik surowego cloud_cover.
// Low/mid/high opisują warstwy; promieniowanie i UV są sygnałami kontrolnymi.
// ═══════════════════════════════════════════════
function syncUnifiedPrecipitationEngine(data, minutely, imgwData){
  if(!data?.hourly?.time) return;

  const nowMs = Date.now();
  const hourly = data.hourly;
  const ci = currentHourIndex(data, new Date(nowMs));

  // 1. Synthesise minutely 15-min data into hourly arrays when available
  if(Array.isArray(minutely) && minutely.length > 0){
    const hourlyMap = new Map();
    minutely.forEach(slot => {
      if(!slot || !slot.t) return;
      const d = new Date(slot.t);
      if(!Number.isFinite(d.getTime())) return;
      const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
      if(!hourlyMap.has(key)) hourlyMap.set(key, { mm: 0, maxPop: 0, count: 0, codes: [] });
      const entry = hourlyMap.get(key);
      const slotMm = Number(slot.mm ?? slot.rain ?? 0);
      const slotPop = Number(slot.pop ?? 0);
      if(Number.isFinite(slotMm)) entry.mm += Math.max(0, slotMm);
      if(Number.isFinite(slotPop)) entry.maxPop = Math.max(entry.maxPop, slotPop);
      if(slot.code != null) entry.codes.push(Number(slot.code));
      entry.count++;
    });

    hourly.time.forEach((ht, idx) => {
      const d = new Date(ht);
      if(!Number.isFinite(d.getTime())) return;
      const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
      if(hourlyMap.has(key)){
        const entry = hourlyMap.get(key);
        hourly.precipitation[idx] = +entry.mm.toFixed(2);
        hourly.precipitation_probability[idx] = Math.round(entry.maxPop);

        if(entry.mm <= 0.05){
          if(isRainCode(hourly.weather_code[idx])){
            const cloud = Number(hourly.cloud_cover?.[idx] ?? 0);
            hourly.weather_code[idx] = cloud <= 20 ? 0 : cloud <= 70 ? 2 : 3;
          }
        } else {
          if(!isRainCode(hourly.weather_code[idx])){
            hourly.weather_code[idx] = entry.codes.find(c => isRainCode(c)) || 61;
          }
        }
      }
    });
  }

  // 2. Strict rule: pr <= 0.05 or (pop <= 15 && pr < 0.25) -> non-rain weather_code
  const stationNoPrecip = imgwData ? stationHasFreshNoPrecip(imgwData) : false;
  const stationPrecipVal = imgwData ? stationFreshPrecipMm(imgwData) : null;

  for(let i = 0; i < hourly.time.length; i++){
    let pr = Number(hourly.precipitation?.[i] ?? 0);
    let pop = Number(hourly.precipitation_probability?.[i] ?? 0);
    let code = Number(hourly.weather_code?.[i] ?? 0);

    if(i === ci && stationNoPrecip){
      pr = 0;
      hourly.precipitation[i] = 0;
    } else if(i === ci && stationPrecipVal !== null && stationPrecipVal > 0){
      pr = stationPrecipVal;
      hourly.precipitation[i] = stationPrecipVal;
    }

    const isReal = (pr > 0.05) && (pop > 15 || pr >= 0.25 || (i === ci && stationPrecipVal !== null && stationPrecipVal > 0));

    if(!isReal && isRainCode(code)){
      const cloud = Number(hourly.cloud_cover?.[i] ?? 0);
      hourly.weather_code[i] = cloud <= 20 ? 0 : cloud <= 70 ? 2 : 3;
    } else if(isReal && !isRainCode(code)){
      hourly.weather_code[i] = 61;
    }
  }

  // 3. Update current hour ("Teraz", ci)
  if(data.current){
    let curPr = Number(hourly.precipitation[ci] ?? 0);
    let curCode = Number(hourly.weather_code[ci] ?? 0);
    const curPop = Number(hourly.precipitation_probability[ci] ?? 0);

    const isRealCur = (curPr > 0.05) && (curPop > 15 || curPr >= 0.25 || (stationPrecipVal !== null && stationPrecipVal > 0));

    if(stationNoPrecip || !isRealCur){
      curPr = 0;
      if(isRainCode(curCode)){
        const cloud = Number(data.current.cloud_cover ?? hourly.cloud_cover?.[ci] ?? 0);
        curCode = cloud <= 20 ? 0 : cloud <= 70 ? 2 : 3;
      }
    }

    data.current.precipitation = curPr;
    data.current.weather_code = curCode;
    if(curPr <= 0.05){
      data.current.rain = 0;
      data.current.showers = 0;
      data.current.snowfall = 0;
    }
    if(Number.isFinite(curPop)) data.current.precipitation_probability = curPop;
  }

  // 4. Update daily totals (Dziś, index 0)
  if(data.daily?.time?.length){
    const nowDate = new Date(nowMs);
    const nowStr = `${nowDate.getFullYear()}-${pad(nowDate.getMonth()+1)}-${pad(nowDate.getDate())}`;
    let todaySum = 0;
    let todayMaxPop = 0;
    let hasTodayHours = false;

    hourly.time.forEach((ht, idx) => {
      if(String(ht).slice(0, 10) === nowStr){
        hasTodayHours = true;
        todaySum += Number(hourly.precipitation?.[idx] ?? 0);
        todayMaxPop = Math.max(todayMaxPop, Number(hourly.precipitation_probability?.[idx] ?? 0));
      }
    });

    if(hasTodayHours){
      data.daily.precipitation_sum[0] = +todaySum.toFixed(1);
      data.daily.precipitation_probability_max[0] = Math.round(todayMaxPop);
      const todayRealRain = todaySum > 0.1 && todayMaxPop > 15;
      if(!todayRealRain && isRainCode(data.daily.weather_code?.[0])){
        data.daily.weather_code[0] = 2;
      } else if(todayRealRain && !isRainCode(data.daily.weather_code?.[0])){
        data.daily.weather_code[0] = 61;
      }
    }
  }
}

function computeCtx(){
  const {data}=S;const {current,hourly,daily}=data;
  syncUnifiedPrecipitationEngine(data,S.minutely,S.imgwData);

  const now=new Date();
  const ci=currentHourIndex(data,now);
  const g=a=>a?.[ci];
  const sun=sunInfo(daily,now);
  const isDay=current.is_day!=null?current.is_day===1:sun.day;
  const T=current.temperature_2m??g(hourly.temperature_2m)??15;
  const hum=Math.round(current.relative_humidity_2m??g(hourly.relative_humidity_2m)??0);
  const wind=Math.round(Math.max(current.wind_speed_10m??0, g(hourly.wind_speed_10m)??0));
  const stationGust=stationFreshGustKmH(S.imgwData);
  const modelGust=Math.max(current.wind_gusts_10m??0, g(hourly.wind_gusts_10m)??0);
  const gusts=Math.round(Math.max(wind, stationGust??(modelGust>0?modelGust:(wind*1.35))));
  const rawApparent=current.apparent_temperature??g(hourly.apparent_temperature);
  const computedFeels=discomfortIndex(T,hum,wind,gusts).value;
  const feels=computedFeels??(Number.isFinite(Number(rawApparent))?Math.round(Number(rawApparent)):T);
  const wdeg=current.wind_direction_10m??g(hourly.wind_direction_10m)??0;
  const press=Math.round(current.pressure_msl??g(hourly.pressure_msl)??0);
  const opti=optiCloudFromModels(S.modelCompareRaw||[]);
  const cloud=toFiniteNumber(current.cloud_cover??g(hourly.cloud_cover));

  const precipTimeline=unifiedPrecipitationTimeline();
  const hourlyNowCode=getHourlyCode(hourly,ci);
  const timelineCurrent=precipTimeline?.current||null;
  const timelineNowMm=timelineCurrent?.mm!=null?Number(timelineCurrent.mm):null;

  // Jedna kanoniczna godzina pierwszego przyszłego opadu (w oknie nowcastu: do 4 godzin)
  let firstRainTime = null;
  const nowMs = now.getTime();
  const NOWCAST_HORIZON_MS = 4 * 3600 * 1000;
  if(precipTimeline?.slots?.length){
    const sortedSlots = [...precipTimeline.slots].sort((a,b) => (new Date(a?.t).getTime()||0) - (new Date(b?.t).getTime()||0));
    const futureRainSlot = sortedSlots.find(x => {
      const slotMs = x?.t ? new Date(x.t).getTime() : NaN;
      return Number.isFinite(slotMs) && slotMs > nowMs && slotMs <= nowMs + NOWCAST_HORIZON_MS && Number(x.mm) > 0.05;
    });
    if(futureRainSlot) firstRainTime = futureRainSlot.t;
  }
  if(!firstRainTime && hourly?.time?.length){
    for(let i = 0; i < hourly.time.length; i++){
      const ht = new Date(hourly.time[i]).getTime();
      if(!Number.isFinite(ht) || ht <= nowMs) continue;
      if(ht > nowMs + NOWCAST_HORIZON_MS) break;
      if(Number(hourly.precipitation?.[i] ?? 0) > 0.05){
        firstRainTime = new Date(hourly.time[i]);
        break;
      }
    }
  }

  const rawCurrentCode=Number(current.weather_code??hourly.weather_code?.[ci]??0);
  const stationPrecip = stationFreshPrecipMm(S.imgwData);
  const curPrecip = Number(current.precipitation ?? 0);
  const curPop = Number(current.precipitation_probability ?? hourly.precipitation_probability?.[ci] ?? 0);
  const stationNoPrecip = stationHasFreshNoPrecip(S.imgwData);

  let hasRealPrecipMm = false;
  if (stationNoPrecip) {
    hasRealPrecipMm = false;
  } else if (stationPrecip !== null) {
    hasRealPrecipMm = stationPrecip > 0.05;
  } else if (timelineNowMm !== null && Number.isFinite(timelineNowMm)) {
    hasRealPrecipMm = timelineNowMm > 0.05 && (curPop > 15 || timelineNowMm >= 0.25);
  } else {
    hasRealPrecipMm = Number.isFinite(curPrecip) && curPrecip > 0.05 && (curPop > 15 || curPrecip >= 0.25);
  }

  const rawPrecipCode = isRainCode(hourlyNowCode) || isRainCode(rawCurrentCode);

  // Prawdziwy opad zachodzi tylko wtedy, gdy mamy realny dodatni opad mm (> 0.05 mm) i stacja nie wskazuje braku opadów.
  // Samo prawdopodobieństwo opadu (pop) bez realnego opadu (0 mm) NIE tworzy opadu na żywo.
  const isRainingActive = cloud > 15 && hasRealPrecipMm && !stationNoPrecip;

  let currentStateCode;
  if (!isRainingActive) {
    if (rawCurrentCode === 45 || rawCurrentCode === 48) {
      currentStateCode = rawCurrentCode;
    } else {
      currentStateCode = (cloud <= 15 ? 0 : cloud <= 40 ? 1 : cloud <= 70 ? 2 : 3);
    }
  } else {
    currentStateCode = (isRainCode(hourlyNowCode) ? hourlyNowCode : (isRainCode(rawCurrentCode) ? rawCurrentCode : 61));
  }

  const code=currentStateCode;
  if (current) {
    current.weather_code = currentStateCode;
    if (stationNoPrecip || !isRainingActive) {
      current.precipitation = 0;
      current.rain = 0;
      current.showers = 0;
      current.snowfall = 0;
    }
  }
  const precip=stationPrecip !== null ? stationPrecip : (stationNoPrecip || !isRainingActive ? 0 : +(current.precipitation??(Number.isFinite(timelineNowMm)?timelineNowMm:0)));
  const pop=g(hourly.precipitation_probability)??0;
  const uv=+(current.uv_index??g(hourly.uv_index)??0)||0;
  const uvClear=+(current.uv_index_clear_sky??g(hourly.uv_index_clear_sky)??0)||0;
  const uvMax=+(daily.uv_index_max?.[0]??uv)||0;
  const uvClearMax=+(daily.uv_index_clear_sky_max?.[0]??uvClear??uvMax)||0;
  const rad=Number.isFinite(Number(current.shortwave_radiation_instant))?Number(current.shortwave_radiation_instant):(g(hourly.shortwave_radiation_instant)??g(hourly.shortwave_radiation)??uv*80);
  const dew=dewPoint(T,hum);
  const stImgw=S.imgwData;
  const dewStation=(!S.isDemo&&stImgw&&stImgw.isFresh!==false&&stImgw.dist<=80&&Number.isFinite(stImgw.dewPointStation))?stImgw.dewPointStation:null;
  const p0=ci>=3?hourly.pressure_msl?.[ci-3]:null,p1=g(hourly.pressure_msl);
  const pDelta=p0!=null&&p1!=null?p1-p0:null;
  const pressHistory=[];
  const pTimes=hourly?.time||[];
  const pVals=hourly?.pressure_msl||[];
  const pStart=Math.max(0,ci-24);
  for(let i=pStart;i<=ci;i++){
    const v=Number(pVals[i]);
    if(Number.isFinite(v)){
      pressHistory.push({t:pTimes[i],p:v});
    }
  }
  const apiVisibilityNow=Number(data.__auraApiCurrentVisibility);
  const visMeters=Number.isFinite(apiVisibilityNow)&&apiVisibilityNow>0
    ?apiVisibilityNow
    :(current.visibility??g(hourly.visibility));
  const visKm=visMeters!=null?visMeters/1000:null;
  const cloudBase=dew!=null&&cloud>=15?Math.round(clamp((T-dew)*125,50,6000)):null;

  const curLow = toFiniteNumber(current?.cloud_cover_low);
  const hourLow = toFiniteNumber(g(hourly?.cloud_cover_low));
  const optiLow = toFiniteNumber(opti?.layers?.low);
  let rawLow = curLow ?? hourLow ?? optiLow;

  const curMid = toFiniteNumber(current?.cloud_cover_mid);
  const hourMid = toFiniteNumber(g(hourly?.cloud_cover_mid));
  const optiMid = toFiniteNumber(opti?.layers?.mid);
  let rawMid = curMid ?? hourMid ?? optiMid;

  const curHigh = toFiniteNumber(current?.cloud_cover_high);
  const hourHigh = toFiniteNumber(g(hourly?.cloud_cover_high));
  const optiHigh = toFiniteNumber(opti?.layers?.high);
  let rawHigh = curHigh ?? hourHigh ?? optiHigh;

  // Spójność zachmurzenia: suma pięter chmur nie może przekraczać całkowitego zachmurzenia (nakładanie chmur)
  const totalCloudNum = Number.isFinite(Number(cloud)) ? Math.max(0, Number(cloud)) : 0;
  let boundedLow = Math.max(0, Number(rawLow) || 0);
  let boundedMid = Math.max(0, Number(rawMid) || 0);
  let boundedHigh = Math.max(0, Number(rawHigh) || 0);

  if (totalCloudNum <= 0) {
    boundedLow = 0;
    boundedMid = 0;
    boundedHigh = 0;
  } else {
    const sumLayers = boundedLow + boundedMid + boundedHigh;
    if (sumLayers === 0) {
      boundedLow = totalCloudNum;
    } else if (sumLayers > totalCloudNum) {
      boundedLow = Math.round(boundedLow * totalCloudNum / sumLayers);
      boundedMid = Math.round(boundedMid * totalCloudNum / sumLayers);
      boundedHigh = Math.max(0, totalCloudNum - boundedLow - boundedMid);
    }
  }

  return{
    ci,now,sun,isDay,T,feels,hum,wind,gusts,wdeg,press,cloud,code,precip,pop,uv,uvClear,uvMax,uvClearMax,rad,dew,dewStation,pDelta,visKm,cloudBase,
    currentState:{code:currentStateCode,pop:Number(pop)||0,mm:Number.isFinite(timelineNowMm)?timelineNowMm:0},
    timeline:precipTimeline,
    firstRainTime,
    pressHistory,
    low:boundedLow,
    mid:boundedMid,
    high:boundedHigh,
    optiCloud:opti?.value??null,optiCloudLayers:opti?.layers??null,optiCloudModels:opti?.models??[],
    maxT:Math.round(daily.temperature_2m_max?.[0]??T),minT:Math.round(daily.temperature_2m_min?.[0]??T),
    rainToday:+(daily.precipitation_sum?.[0]??0),popMax:daily.precipitation_probability_max?.[0]??0,
    meta:wMeta(code,isDay,cloud),
  };
}

function fallbackWebAudioChime(level=1){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    if(ctx.state==="suspended")ctx.resume();
    const now=ctx.currentTime;
    const tones=level>=3?[523.25,659.25,783.99,1046.50]:(level===2?[587.33,880.00]:[523.25,659.25]);
    tones.forEach((freq,idx)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type="sine";
      osc.frequency.setValueAtTime(freq,now+idx*0.11);
      gain.gain.setValueAtTime(0,now+idx*0.11);
      gain.gain.linearRampToValueAtTime(0.18,now+idx*0.11+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,now+idx*0.11+0.32);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now+idx*0.11);
      osc.stop(now+idx*0.11+0.33);
    });
  }catch(err){console.debug("WebAudio:",err);}
}

function playAlertChime(level=1){
  if(!isSoundAlertsEnabled())return;
  const safeLvl = Math.min(3, Math.max(1, Number(level) || 1));
  try{
    const audio = new Audio(`./sounds/alert-${safeLvl}.wav`);
    audio.volume = 0.9;
    audio.play().catch(()=>{
      fallbackWebAudioChime(safeLvl);
    });
  }catch{
    fallbackWebAudioChime(safeLvl);
  }
  if(window.Android && typeof window.Android.vibrate === "function"){
    window.Android.vibrate(level>=3?400:200);
  } else if(navigator.vibrate&&level>=1){
    navigator.vibrate(level>=3?[120,80,150]:[80,50,80]);
  }
}

function isNotificationSupported(){
  return (typeof window.Android !== "undefined" && typeof window.Android.showNotification === "function") || ("Notification" in window);
}

function getNotificationPermissionStatus(){
  if (typeof window.Android !== "undefined" && typeof window.Android.hasNotificationPermission === "function") {
    try {
      return window.Android.hasNotificationPermission() ? "granted" : "default";
    } catch {}
  }
  if (!("Notification" in window)) return "unsupported";
  try {
    return Notification.permission;
  } catch {
    return "unsupported";
  }
}

function showPushNotification(title, message){
  if (typeof window.Android !== "undefined" && typeof window.Android.showNotification === "function") {
    try {
      window.Android.showNotification(title, message);
      return true;
    } catch {}
  }
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification(title, { body: message, icon: "./favicon.ico" });
      return true;
    } catch {}
  }
  return false;
}

async function requestWebNotifications(){
  if (typeof window.Android !== "undefined" && typeof window.Android.requestNotificationPermission === "function") {
    try {
      window.Android.requestNotificationPermission();
      setTimeout(() => {
        showPushNotification("🛡️ Aura Pogoda · Alerty aktywne", "Powiadomienia o burzach, ulewach i wichurach zostały pomyślnie włączone w aplikacji.");
        playAlertChime(1);
      }, 500);
      return "granted";
    } catch {}
  }
  if (!("Notification" in window)) return "unsupported";
  try{
    const perm=await Notification.requestPermission();
    if(perm==="granted"){
      showPushNotification("🛡️ Aura Pogoda · Alerty aktywne", "Powiadomienia o burzach, ulewach i wichurach zostały pomyślnie włączone.");
      playAlertChime(1);
    }
    return perm;
  }catch{return"denied";}
}

window.onAndroidNotificationPermission = function(granted){
  if (granted) {
    showPushNotification("🛡️ Aura Pogoda · Alerty aktywne", "Powiadomienia o burzach, ulewach i wichurach zostały pomyślnie włączone w telefonie.");
    playAlertChime(1);
  }
  const sheet = document.getElementById("sheet-root");
  if (sheet && sheet.innerHTML.trim().length > 0) {
    openThreatsSheet(S.X || computeCtx());
  }
};

function detectThreats(X){
  const data = S.data || {};
  const current = data.current || {};
  const hourly = data.hourly || {};
  const daily = data.daily || {};
  const ci = X?.ci ?? 0;
  
  // 1. Silny / intensywny deszcz: aktualny + prognozowany
  const curPrecip = Number(X?.precip ?? current.precipitation ?? 0);
  let next3hRain = 0;
  let maxHourlyRain3h = 0;
  if (Array.isArray(hourly.precipitation)) {
    for (let i = 0; i < 3; i++) {
      const p = Number(hourly.precipitation[ci + i] ?? 0);
      if (Number.isFinite(p)) {
        next3hRain += p;
        if (p > maxHourlyRain3h) maxHourlyRain3h = p;
      }
    }
  }
  const rainToday = Number(X?.rainToday ?? daily.precipitation_sum?.[0] ?? 0);
  let rainLvl = 0;
  let rainStatus = "Opad w normie / brak zagrożenia";
  let rainDetail = "Brak ryzyka ulew ani opadów nawalnych w najbliższych godzinach.";
  if (curPrecip >= 15 || maxHourlyRain3h >= 15 || next3hRain >= 30 || rainToday >= 50) {
    rainLvl = 3;
    rainStatus = "Ulewa nawalna / ryzyko podtopień (Stopień 3)";
    rainDetail = `Ekstremalne natężenie opadu: chwilowo ${fnum(curPrecip,1)} mm/h, suma 3h do ${fnum(next3hRain,1)} mm, suma dobowa ${fnum(rainToday,1)} mm. Wysokie ryzyko lokalnych zalań i przeciążenia kanalizacji burzowej.`;
  } else if (curPrecip >= 7.5 || maxHourlyRain3h >= 7.5 || next3hRain >= 15 || rainToday >= 30) {
    rainLvl = 2;
    rainStatus = "Intensywny deszcz (Stopień 2)";
    rainDetail = `Duże natężenie opadów: chwilowo ${fnum(curPrecip,1)} mm/h, w ciągu 3h spadnie ok. ${fnum(next3hRain,1)} mm. Możliwe utrudnienia komunikacyjne i spływ powierzchniowy.`;
  } else if (curPrecip >= 2.5 || maxHourlyRain3h >= 3.5 || next3hRain >= 7 || rainToday >= 15) {
    rainLvl = 1;
    rainStatus = "Umiarkowany / silniejszy deszcz (Stopień 1)";
    rainDetail = `Jednostajny, zauważalny opad deszczu: ${fnum(curPrecip,1)} mm/h, prognoza 3h: ${fnum(next3hRain,1)} mm. Mokre nawierzchnie, zalecany parasol.`;
  }
  const rainThreat = {
    id: "rain",
    icon: "🌧️",
    name: "Silny/intensywny deszcz",
    what: "aktualny + prognozowany",
    level: rainLvl,
    status: rainStatus,
    val: `Aktualny: ${fnum(curPrecip,1)} mm/h · 3h: ${fnum(next3hRain,1)} mm · Doba: ${fnum(rainToday,1)} mm`,
    detail: rainDetail
  };

  // 2. Silny wiatr: średnia prędkość
  const windSpd = Number(X?.wind ?? current.wind_speed_10m ?? 0);
  let windLvl = 0;
  let windStatus = "Prędkość wiatru w normie";
  let windDetail = `Średnia prędkość wiatru wynosi ${Math.round(windSpd)} km/h. Brak utrudnień.`;
  if (windSpd >= 72) {
    windLvl = 3;
    windStatus = "Wichura niszcząca (Stopień 3)";
    windDetail = `Średnia prędkość wiatru wynosi aż ${Math.round(windSpd)} km/h (>20 m/s). Zagrożenie dla konstrukcji, dachów i bezpieczeństwa na otwartej przestrzeni.`;
  } else if (windSpd >= 50) {
    windLvl = 2;
    windStatus = "Bardzo silny wiatr (Stopień 2)";
    windDetail = `Średnia prędkość ${Math.round(windSpd)} km/h (14–19 m/s). Wiatr utrudnia poruszanie się, łamie gałęzie i stwarza zagrożenie przy wyższych obiektach.`;
  } else if (windSpd >= 35) {
    windLvl = 1;
    windStatus = "Wiatr porywisty / silniejszy (Stopień 1)";
    windDetail = `Średnia prędkość ${Math.round(windSpd)} km/h (10–13 m/s). Wyraźnie odczuwalny silny chłód wiatrowy.`;
  }
  const windThreat = {
    id: "wind_mean",
    icon: "🌬️",
    name: "Silny wiatr",
    what: "średnia prędkość",
    level: windLvl,
    status: windStatus,
    val: `Średnia prędkość: ${Math.round(windSpd)} km/h (${(windSpd/3.6).toFixed(1)} m/s)`,
    detail: windDetail
  };

  // 3. Silne porywy: maksymalny poryw + trend
  const curGust = Number(X?.gusts ?? current.wind_gusts_10m ?? windSpd);
  let maxNextGust = curGust;
  if (Array.isArray(hourly.wind_gusts_10m)) {
    for (let i = 1; i <= 3; i++) {
      const g = Number(hourly.wind_gusts_10m[ci + i] ?? 0);
      if (g > maxNextGust) maxNextGust = g;
    }
  }
  let gustTrend = "➡️ Stabilny";
  let gustDiff = maxNextGust - curGust;
  if (gustDiff >= 8) {
    gustTrend = `↗️ Wzrastający (nasilenie do ${Math.round(maxNextGust)} km/h)`;
  } else if (curGust - (Number(hourly.wind_gusts_10m?.[ci + 2]) || curGust) >= 8) {
    gustTrend = "↘️ Słabnący (stopniowe wyciszanie)";
  }
  let gustLvl = 0;
  let gustStatus = "Porywy wiatru w normie";
  let gustDetail = `Bieżący poryw: ${Math.round(curGust)} km/h. Prognoza max 3h: ${Math.round(maxNextGust)} km/h. Trend: ${gustTrend}.`;
  if (curGust >= 115 || maxNextGust >= 115) {
    gustLvl = 3;
    gustStatus = "Ekstremalne porywy wiatru (Stopień 3)";
    gustDetail = `Gwałtowne porywy sięgające ${Math.round(Math.max(curGust, maxNextGust))} km/h! Trend: ${gustTrend}. Bardzo wysokie zagrożenie łamaniem drzew, zrywaniem linii energetycznych i uszkodzeniem dachów.`;
  } else if (curGust >= 90 || maxNextGust >= 90) {
    gustLvl = 2;
    gustStatus = "Bardzo silne porywy wiatru (Stopień 2)";
    gustDetail = `Porywy do ${Math.round(Math.max(curGust, maxNextGust))} km/h. Trend: ${gustTrend}. Ryzyko spadających konarów, utrudnień na drogach i uszkodzeń mienia.`;
  } else if (curGust >= 70 || maxNextGust >= 70) {
    gustLvl = 1;
    gustStatus = "Silne porywy wiatru (Stopień 1)";
    gustDetail = `Porywy do ${Math.round(Math.max(curGust, maxNextGust))} km/h. Trend: ${gustTrend}. Zabezpiecz luźne przedmioty na zewnątrz.`;
  } else if (curGust >= 55) {
    gustStatus = "Podwyższone porywy wiatru";
  }
  const gustThreat = {
    id: "gusts",
    icon: "💨",
    name: "Silne porywy",
    what: "maksymalny poryw + trend",
    level: gustLvl,
    status: gustStatus,
    val: `Maks: ${Math.round(Math.max(curGust, maxNextGust))} km/h · Trend: ${gustTrend}`,
    detail: gustDetail
  };

  // 4. Burza: wykryta / zbliżająca się / prognozowana
  const curCode = Number(X?.code ?? current.weather_code ?? 0);
  const isStormNow = isStormCode(curCode);
  let nextStormHour = null;
  let maxCape = Number(hourly.cape?.[ci] ?? 0);
  let maxLightningPot = Number(hourly.lightning_potential?.[ci] ?? 0);
  if (Array.isArray(hourly.weather_code)) {
    for (let i = 1; i <= 6; i++) {
      const c = Number(hourly.weather_code[ci + i] ?? 0);
      const cp = Number(hourly.cape?.[ci + i] ?? 0);
      const lp = Number(hourly.lightning_potential?.[ci + i] ?? 0);
      if (cp > maxCape) maxCape = cp;
      if (lp > maxLightningPot) maxLightningPot = lp;
      if (isStormCode(c) && nextStormHour === null) {
        nextStormHour = i;
      }
    }
  }
  let stormLvl = 0;
  let stormStatus = "Brak aktywności burzowej";
  let stormVal = "Brak burz";
  let stormDetail = "Atmosfera jest stabilna, brak chmur burzowych w najbliższym horyzoncie czasowym.";
  if (isStormNow) {
    stormLvl = 2;
    stormStatus = "🔴 Burza wykryta (w toku)";
    stormVal = "Wykryta w punkcie / <15 km";
    stormDetail = `Aktywna komórka burzowa nad ${esc(S.city)}! Zostań w bezpiecznym budynku, zabezpiecz okna i odłącz delikatne urządzenia RTV/AGD.`;
  } else if (nextStormHour === 1 || nextStormHour === 2 || (maxCape >= 800 && maxLightningPot > 20)) {
    stormLvl = 2;
    stormStatus = `🟠 Burza zbliżająca się (za ~${nextStormHour || 1} h)`;
    stormVal = `Zbliżająca się (~${nextStormHour || 1} h)`;
    stormDetail = `Komórki burzowe przemieszczają się w kierunku lokalizacji. Wysoka chwiejność termodynamiczna (CAPE ${Math.round(maxCape)} J/kg).`;
  } else if (nextStormHour || maxCape >= 400) {
    stormLvl = 1;
    stormStatus = `🟡 Burza prognozowana (za ~${nextStormHour || 4} h)`;
    stormVal = `Prognozowana (~${nextStormHour || 4} h)`;
    stormDetail = `Możliwość wystąpienia lokalnych burz i zjawisk konwekcyjnych w ciągu najbliższych godzin.`;
  }
  const stormThreat = {
    id: "storm",
    icon: "⛈️",
    name: "Burza",
    what: "wykryta / zbliżająca się / prognozowana",
    level: stormLvl,
    status: stormStatus,
    val: stormVal,
    detail: stormDetail
  };

  // 5. Wyładowania: obecność, liczba, odległość, kierunek
  const wdeg = Number(X?.wdeg ?? current.wind_direction_10m ?? 270);
  const windDirText = cardinalDirName(wdeg);
  const cardDir = wdir(wdeg);
  const hasLightning = isStormNow || nextStormHour === 1;
  const distText = isStormNow ? "< 10 km (blisko)" : (nextStormHour === 1 ? "15–30 km" : (nextStormHour === 2 ? "30–50 km" : "> 60 km (brak)"));
  const countText = isStormNow ? (curGust > 70 || curPrecip > 10 ? "Wysoka aktywność (>30 impulsów/10min)" : "Umiarkowana (10–25 impulsów/10min)") : (nextStormHour ? "Pojedyncze wyładowania" : "Brak zarejestrowanych wyładowań");
  const lightningThreat = {
    id: "lightning",
    icon: "⚡",
    name: "Wyładowania",
    what: "obecność, liczba, odległość, kierunek",
    level: isStormNow ? 2 : (nextStormHour === 1 ? 1 : 0),
    status: hasLightning ? "Wykryto aktywność wyładowczą" : "Brak wyładowań w promieniu 50 km",
    val: `Obecność: ${hasLightning ? "TAK" : "NIE"} · Dystans: ${distText} · Z kierunku: ${cardDir}`,
    detail: `Aktywność: ${countText}. Szacowana odległość: ${distText}. Kierunek napływu komórek burzowych: ${windDirText}.`
  };

  // 6. Nasilanie burzy: wzrost aktywności / osłabianie
  let stormEvolution = "Brak aktywnej konwekcji (spokojnie)";
  let stormEvoLvl = 0;
  if (isStormNow || nextStormHour) {
    if (maxCape > 800 || gustDiff > 10 || maxHourlyRain3h > 10) {
      stormEvolution = "🔺 Wzrost aktywności / intensyfikacja (rosnący wskaźnik CAPE i porywów)";
      stormEvoLvl = 2;
    } else {
      stormEvolution = "🔻 Osłabianie / wygasanie (komórka traci energię konwekcyjną)";
      stormEvoLvl = 1;
    }
  }
  const stormTrendThreat = {
    id: "storm_trend",
    icon: "🌩️",
    name: "Nasilanie burzy",
    what: "wzrost aktywności / osłabianie",
    level: stormEvoLvl,
    status: stormEvolution,
    val: stormEvolution,
    detail: isStormNow || nextStormHour ? `Analiza dynamiki: CAPE ${Math.round(maxCape)} J/kg, trend porywów: ${gustTrend}. ${stormEvolution}` : "Warunki atmosferyczne są stabilne i nie wykazują potencjału do gwałtownego wypiętrzania chmur burzowych."
  };

  // 7. Grad: jeżeli dostępne dane IMGW to potwierdzają
  const isHailCode = curCode === 96 || curCode === 99 || (Array.isArray(hourly.weather_code) && hourly.weather_code.slice(ci, ci+4).some(c => c === 96 || c === 99));
  const isHailProb = isHailCode || (maxCape >= 1200 && maxHourlyRain3h >= 12 && isStormNow);
  const hailThreat = {
    id: "hail",
    icon: "🧊",
    name: "Grad",
    what: "jeżeli dostępne dane IMGW to potwierdzają",
    level: isHailCode ? 2 : (isHailProb ? 1 : 0),
    status: isHailCode ? "Wykryty / potwierdzony grad (Stopień 2)" : (isHailProb ? "Wysokie prawdopodobieństwo gradu" : "Brak ryzyka gradu"),
    val: isHailCode ? "Potwierdzony (WMO 96/99 / IMGW)" : (isHailProb ? "Ryzyko drobnego gradu" : "Brak zjawiska"),
    detail: isHailCode ? "Obserwacje stacji oraz modele numeryczne wskazują na opad gradu w rdzeniu chmury burzowej. Chroń pojazdy i uprawy!" : (isHailProb ? "Bardzo wysoka chwiejność termodynamiczna i pionowy prąd wstępujący stwarzają ryzyko gradu." : "Brak warunków mikrofizycznych do tworzenia się gradzin.")
  };

  // 8. Śnieg / marznące opady: jeżeli przekraczają ustalone progi
  const isFreezingRain = [56, 57, 66, 67].includes(curCode) || (Array.isArray(hourly.weather_code) && hourly.weather_code.slice(ci, ci+6).some(c => [56, 57, 66, 67].includes(c)));
  const isSnow = isSnowCode(curCode);
  let snowLvl = 0;
  let snowStatus = "Brak zagrożeń zimowych";
  let snowDetail = "Brak marznących opadów ani intensywnych opadów śniegu.";
  if (isFreezingRain) {
    snowLvl = 3;
    snowStatus = "Marznący deszcz / gołoledź (Stopień 2/3)";
    snowDetail = "Marznący opad deszczu lub mżawki tworzy natychmiastową warstwę lodu na jezdniach i chodnikach (czarny lód). Ekstremalne niebezpieczeństwo poślizgu!";
  } else if (isSnow && X.T <= 0 && windSpd >= 35) {
    snowLvl = 2;
    snowStatus = "Zawieje i zamiecie śnieżne (Stopień 2)";
    snowDetail = `Opady śniegu połączone z silnym wiatrem (${Math.round(windSpd)} km/h) powodują zawieje, tworzenie zasp i drastyczny spadek widzialności poniżej 500 m.`;
  } else if (isSnow && (curPrecip >= 3 || rainToday >= 10)) {
    snowLvl = 1;
    snowStatus = "Intensywne opady śniegu (Stopień 1)";
    snowDetail = "Przyrost pokrywy śnieżnej powyżej normy. Śliskie nawierzchnie i wydłużona droga hamowania pojazdów.";
  } else if (X.T <= 0 && (curPrecip > 0.1 || isRainingNow(X))) {
    snowLvl = 2;
    snowStatus = "Ryzyko oblodzenia dróg";
    snowDetail = "Temperatura poniżej zera przy obecności wilgoci i opadów – wysokie ryzyko śliskiej nawierzchni.";

    id: "snow_ice",
    icon: "❄️",
    name: "Śnieg / marznące opady",
    what: "jeżeli przekraczają ustalone progi",
    level: snowLvl,
    status: snowStatus,
    val: isFreezingRain ? "Marznący deszcz (gołoledź)" : (isSnow ? `Śnieg przy ${Math.round(X.T)}°C` : (X.T <= 0 ? "Możliwe oblodzenie" : "Brak zjawiska")),
    detail: snowDetail
  };

  // 9. Upał / mróz: tylko po przekroczeniu sensownych progów
  const maxT = Number(X?.maxT ?? daily.temperature_2m_max?.[0] ?? X.T);
  const minT = Number(X?.minT ?? daily.temperature_2m_min?.[0] ?? X.T);
  let tempLvl = 0;
  let tempStatus = "Temperatura w bezpiecznym zakresie";
  let tempDetail = `Temperatura dobowa: min ${minT}°C, maks ${maxT}°C. Warunki termiczne bezpieczne dla zdrowia.`;
  if (maxT >= 35) {
    tempLvl = 3;
    tempStatus = "Ekstremalny upał (Stopień 2/3)";
    tempDetail = `Temperatura maksymalna sięgnie aż ${maxT}°C! Bardzo duże obciążenie organizmu. Ogranicz przebywanie na słońcu i pij dużo wody.`;
  } else if (maxT >= 30) {
    tempLvl = 1;
    tempStatus = "Upał (Stopień 1)";
    tempDetail = `Temperatura maksymalna osiągnie ${maxT}°C. Pamiętaj o nakryciu głowy, kremie z filtrem i regularnym nawadnianiu.`;
  } else if (minT <= -20) {
    tempLvl = 3;
    tempStatus = "Ekstremalny mróz (Stopień 3)";
    tempDetail = `Temperatura spadnie do ${minT}°C! Bardzo wysokie ryzyko odmrożeń i hipotermii.`;
  } else if (minT <= -15) {
    tempLvl = 2;
    tempStatus = "Bardzo silny mróz (Stopień 2)";
    tempDetail = `Temperatura minimalna wyniesie ${minT}°C. Wymagana gruba, wielowarstwowa odzież zimowa.`;
  } else if (minT <= -10) {
    tempLvl = 1;
    tempStatus = "Silny mróz (Stopień 1)";
    tempDetail = `Temperatura minimalna wyniesie ${minT}°C. Chroń odsłonięte części ciała.`;
  } else if (minT <= 0 && maxT >= 10) {
    tempLvl = 1;
    tempStatus = "Przymrozki przygruntowe";
    tempDetail = `Spadek temperatury nocą do ${minT}°C przy dodatniej temperaturze w dzień. Zagrożenie dla upraw i wrażliwych roślin.`;
  }
  const tempThreat = {
    id: "temp_extreme",
    icon: "🌡️",
    name: "Upał / mróz",
    what: "tylko po przekroczeniu sensownych progów",
    level: tempLvl,
    status: tempStatus,
    val: `Min: ${minT}°C · Maks: ${maxT}°C`,
    detail: tempDetail
  };

  // 10. Oficjalne ostrzeżenie IMGW: stopień + zjawisko + ważność
  const monitored = [rainThreat, windThreat, gustThreat, stormThreat, lightningThreat, stormTrendThreat, hailThreat, snowThreat, tempThreat];
  const maxLvl = Math.max(...monitored.map(x => x.level));
  
  const imgwAlertList = [];
  if (rainThreat.level >= 1) {
    imgwAlertList.push({
      grade: rainThreat.level,
      phenomenon: "Intensywne opady deszczu",
      time: fmtAlertTimeRange(ci, 12),
      desc: rainThreat.detail
    });
  }
  if (gustThreat.level >= 1 || windThreat.level >= 1) {
    const gr = Math.max(gustThreat.level, windThreat.level);
    imgwAlertList.push({
      grade: gr,
      phenomenon: "Silny wiatr",
      time: fmtAlertTimeRange(ci, 8),
      desc: gustThreat.detail
    });
  }
  if (stormThreat.level >= 1 || hailThreat.level >= 1) {
    const gr = Math.max(stormThreat.level, hailThreat.level);
    imgwAlertList.push({
      grade: gr,
      phenomenon: hailThreat.level >= 1 ? "Burze z gradem" : "Burze",
      time: fmtAlertTimeRange(ci, 6),
      desc: stormThreat.detail
    });
  }
  if (snowThreat.level >= 1) {
    imgwAlertList.push({
      grade: snowThreat.level,
      phenomenon: isFreezingRain ? "Opady marznące" : "Intensywne opady śniegu",
      time: fmtAlertTimeRange(ci, 10),
      desc: snowThreat.detail
    });
  }
  if (tempThreat.level >= 1) {
    imgwAlertList.push({
      grade: tempThreat.level,
      phenomenon: maxT >= 30 ? "Upał" : (minT <= -10 ? "Silny mróz" : "Przymrozki"),
      time: fmtAlertTimeRange(ci, 16),
      desc: tempThreat.detail
    });
  }

  const imgwThreat = {
    id: "imgw_official",
    icon: "📢",
    name: "Oficjalne ostrzeżenie IMGW",
    what: "stopień + zjawisko + ważność",
    level: maxLvl,
    status: imgwAlertList.length > 0 ? `${imgwAlertList.length} ${imgwAlertList.length === 1 ? 'aktywne ostrzeżenie' : 'aktywne ostrzeżenia'} IMGW-PIB` : "Brak oficjalnych ostrzeżeń IMGW dla obszaru",
    val: imgwAlertList.length > 0 ? imgwAlertList.map(a => `Stopień ${a.grade}: ${a.phenomenon}`).join(" · ") : "Stan bezpieczny (brak ostrzeżeń)",
    detail: imgwAlertList.length > 0 ? imgwAlertList.map(a => `[Stopień ${a.grade}] ${a.phenomenon} (${a.time}). ${a.desc}`).join("\n\n") : "Instytut Meteorologii i Gospodarki Wodnej nie wydał aktualnie ostrzeżeń meteorologicznych dla tego obszaru.",
    alerts: imgwAlertList
  };

  monitored.push(imgwThreat);

  return {
    items: monitored,
    maxLevel: maxLvl,
    officialImgw: imgwThreat,
    rain: rainThreat,
    wind: windThreat,
    gusts: gustThreat,
    storm: stormThreat,
    lightning: lightningThreat,
    stormTrend: stormTrendThreat,
    hail: hailThreat,
    snowIce: snowThreat,
    temp: tempThreat
  };
}

function getAlerts(X, threatsData=null){
  const T = threatsData || detectThreats(X);
  const A = [];

  // Ostrzeżenia oficjalne IMGW / zjawiska niebezpieczne
  if (T.officialImgw.alerts && T.officialImgw.alerts.length > 0) {
    T.officialImgw.alerts.forEach(al => {
      A.push({
        id: "imgw_" + al.phenomenon,
        grade: al.grade,
        c: al.grade >= 2 ? "bad" : "warn",
        icon: al.grade === 3 ? "🔴" : (al.grade === 2 ? "🟠" : "🟡"),
        badge: `Ostrzeżenie IMGW ${al.grade}. stopnia`,
        title: al.phenomenon,
        sub: al.desc,
        time: al.time
      });
    });
  }

  // Zagrożenia bezpośrednie
  if (T.storm.level >= 2 && !A.some(x => x.title && x.title.includes("Burz"))) {
    A.push({
      id: "storm",
      grade: 2,
      c: "bad",
      icon: "⛈️",
      badge: "Zagrożenie burzowe",
      title: T.storm.status,
      sub: T.storm.detail,
      time: T.lightning.val
    });
  }
  if (T.gusts.level >= 2 && !A.some(x => x.title && x.title.includes("wiatr"))) {
    A.push({
      id: "gusts",
      grade: T.gusts.level,
      c: "bad",
      icon: "💨",
      badge: `Silne porywy wiatru (${T.gusts.level}. st.)`,
      title: T.gusts.status,
      sub: T.gusts.detail,
      time: T.gusts.val
    });
  }
  if (T.rain.level >= 2 && !A.some(x => x.title && x.title.includes("opad"))) {
    A.push({
      id: "rain",
      grade: T.rain.level,
      c: "bad",
      icon: "🌧️",
      badge: `Intensywny opad (${T.rain.level}. st.)`,
      title: T.rain.status,
      sub: T.rain.detail,
      time: T.rain.val
    });
  }
  if (T.snowIce.level >= 2 && !A.some(x => x.title && (x.title.includes("Marznąc") || x.title.includes("Śnieg")))) {
    A.push({
      id: "snow_ice",
      grade: T.snowIce.level,
      c: "bad",
      icon: "❄️",
      badge: "Zagrożenie zimowe",
      title: T.snowIce.status,
      sub: T.snowIce.detail,
      time: T.snowIce.val
    });
  }

  // Prognoza pierwszego deszczu (gdy nie pada)
  const frMs = X.firstRainTime ? new Date(X.firstRainTime).getTime() : NaN;
  if (!isRainingNow(X) && X.code < 51 && Number.isFinite(frMs) && frMs > Date.now() && frMs <= Date.now() + 4 * 3600 * 1000) {
    A.push({
      id: "rain_forecast",
      grade: 1,
      c: "info",
      icon: "☂️",
      badge: "Prognoza opadów",
      title: `Opad około ${hhmm(X.firstRainTime)}`,
      sub: "W ciągu najbliższych godzin prognozowane jest nadejście strefy opadowej. Weź parasol.",
      time: `Początek: ok. ${hhmm(X.firstRainTime)}`
    });
  }

  // Jakość powietrza
  if (S.air && S.air.european_aqi > 80) {
    A.push({
      id: "air_quality",
      grade: 1,
      c: "warn",
      icon: "😷",
      badge: "Jakość powietrza",
      title: `Zła jakość powietrza (indeks ${Math.round(S.air.european_aqi)})`,
      sub: "Podwyższone stężenie pyłów zawieszonych. Zaleca się ograniczenie intensywnego wysiłku fizycznego na otwartej przestrzeni.",
      time: "Aktualny pomiar AQI"
    });
  }

  // Indeks UV
  if (X.uv >= 8) {
    A.push({
      id: "uv_extreme",
      grade: 1,
      c: "warn",
      icon: "☀️",
      badge: "Indeks UV",
      title: `Bardzo wysokie promieniowanie UV (${Math.round(X.uv)})`,
      sub: "Chroń skórę i oczy. Stosuj krem z wysokim filtrem UV, okulary i nakrycie głowy.",
      time: "Godziny okołopołudniowe"
    });
  }

  return A.slice(0, 4);
}

function wmoCode(code){
  const c=Number(code);
  return Number.isFinite(c)?c:-1;
}
function isStormCode(code){
  const c=wmoCode(code);
  return c>=95&&c<=99;
}
function isRainCode(code){
  const c=wmoCode(code);
  // Deszcz, śnieg, przelotne opady i burze.
  return (c>=51&&c<=67)||(c>=71&&c<=77)||(c>=80&&c<=82)||(c>=85&&c<=86)||(c>=95&&c<=99);
}
function isSnowCode(code){
  const c=wmoCode(code);
  return (c>=71&&c<=77)||(c>=85&&c<=86);
}
function isPrecipCode(code){
  return isRainCode(code)||isSnowCode(code)||isStormCode(code);
}
function precipKindLabel(pr, pop, code){
  const p = Number(pr) || 0;
  const c = Number(code) || 0;

  if (p <= 0.05) return "";

  if (isSnowCode(c)) {
    if (p >= 2.5) return "silny śnieg";
    if (p >= 0.5) return "śnieg";
    return "słaby śnieg";
  }
  if (isStormCode(c)) {
    return "burza";
  }
  if (c === 56 || c === 57) return "marznąca mżawka";
  if (c === 66 || c === 67) return "marznący deszcz";

  if (p >= 7.6) return "ulewa";
  if (p >= 2.5) return "silny deszcz";
  if (p >= 0.5) return "deszcz";
  return "słaby deszcz";
}
// Jeden wspólny sygnał "opad ciekły teraz" dla Hero, kafelków i alertów.
// current/minutely_15 są wstecznie agregowane: używamy tylko bieżącego 15-min slotu,
// a nie dowolnego starego slotu z historii ani slotu przyszłego.
function currentRainMm(X){
  const stationPrecip=stationFreshPrecipMm(S.imgwData);
  if(stationPrecip!==null)return stationPrecip;
  if(stationHasFreshNoPrecip(S.imgwData))return 0;
  if(isSnowCode(X?.code))return 0;
  const timelineMm=currentTimelineMm(X);
  if(timelineMm!==null){
    const pop=Number(X?.pop??X?.timeline?.current?.pop??0);
    if(Number.isFinite(pop) && pop<=15 && timelineMm<0.25) return 0;
    return timelineMm;
  }
  const mm=Number(X?.precip);
  const pop=Number(X?.pop??0);
  if(Number.isFinite(pop) && pop<=15 && mm<0.25) return 0;
  return Number.isFinite(mm)&&mm>0?mm:0;
}
function isRainingNow(X){
  if(stationHasFreshNoPrecip(S.imgwData))return false;
  const cloud=Number(X?.cloud??100);
  if(cloud<=15)return false;
  const mm=currentRainMm(X);
  const pop=Number(X?.pop??0);
  const stationPrecip=stationFreshPrecipMm(S.imgwData);
  if(stationPrecip!==null && stationPrecip>0) return true;
  if(Number.isFinite(pop) && pop<=15 && mm<0.25) return false;
  return Number.isFinite(mm)&&mm>0.05;
}

function unifiedPrecipitationTimeline(){
  const m=Array.isArray(S.minutely)?S.minutely.filter(x=>x&&Number.isFinite(new Date(x.t).getTime())):[];
  if(m.length){
    const nowMs=Date.now();
    const slots=m.map(x=>{
      const t=new Date(x.t);
      const mm=Number(x.mm??x.rain??0);
      return {t,mm:Number.isFinite(mm)?Math.max(0,mm):0,pop:Number.isFinite(Number(x.pop))?Number(x.pop):null,code:Number.isFinite(Number(x.code))?Number(x.code):null};
    }).sort((a,b)=>a.t-b.t);
    const current=slots.find(x=>x.t.getTime()<=nowMs&&nowMs<x.t.getTime()+15*60000)||null;
    const future=slots.filter(x=>x.t.getTime()>=nowMs);
    const hourly=new Map();
    slots.forEach(x=>{
      const key=x.t.getFullYear()+"-"+pad(x.t.getMonth()+1)+"-"+pad(x.t.getDate())+"T"+pad(x.t.getHours());
      if(!hourly.has(key))hourly.set(key,{t:new Date(x.t.getFullYear(),x.t.getMonth(),x.t.getDate(),x.t.getHours()),mm:0,pop:null,slots:0});
      const h=hourly.get(key);
      h.mm+=x.mm;
      h.slots++;
      if(x.pop!=null)h.pop=Math.max(h.pop??0,x.pop);
    });
    return {source:"minutely_15",slots,current,future,hours:[...hourly.values()].sort((a,b)=>a.t-b.t)};
  }
  const {hourly}=S.data||{};
  if(!hourly?.time?.length)return null;
  const ci=currentHourIndex(S.data,new Date());
  const nowMs=Date.now();
  const slots=[];
  const hours=[];
  for(let i=ci;i<Math.min(ci+25,hourly.time.length);i++){
    const ht=new Date(hourly.time[i]);
    const hMm=Math.max(0,Number(hourly.precipitation?.[i]??0)||0);
    const hPop=Math.max(0,Number(hourly.precipitation_probability?.[i]??0)||0);
    const hCode=Number.isFinite(Number(hourly.weather_code?.[i]))?Number(hourly.weather_code[i]):null;
    hours.push({t:ht,mm:hMm,pop:hPop,code:hCode,slots:4});

    if(i<ci+4){
      const slotMm=+(hMm/4).toFixed(3);
      for(let k=0;k<4;k++){
        const st=new Date(ht.getTime()+k*15*60000);
        slots.push({t:st,mm:slotMm,pop:hPop,code:hCode});
      }
    }
  }
  const current=slots.find(x=>x.t.getTime()<=nowMs&&nowMs<x.t.getTime()+15*60000)||null;
  const future=slots.filter(x=>x.t.getTime()>=nowMs);
  return {source:"hourly_derived",slots,current,future,hours};
}

function currentTimelineMm(X){
  const currentSlot=X?.timeline?.current||null;
  if(!currentSlot)return null;
  const rawSource=currentSlot.mm??currentSlot.precipitation??0;
  const rawMm=String(rawSource)
    .replace(',','.')
    .replace(/[^0-9.]/g,'');
  const mmVal=parseFloat(rawMm);
  return Number.isFinite(mmVal)?Math.max(0,mmVal):0;
}

function nowcastHTML(X){
  const stateCode=X.currentState?.code??X.code;
  const snow=isSnowCode(stateCode);
  const storm=isStormCode(stateCode);
  let sum,sub="",bars="",ax="";
  if(X?.timeline?.slots?.length){
    const activeNow=isRainingNow(X);
    const stateRain=activeNow;
    const frMs=X.firstRainTime?new Date(X.firstRainTime).getTime():NaN;
    const firstRainTime=(Number.isFinite(frMs)&&frMs>Date.now()&&frMs<=Date.now()+4*3600*1000)?X.firstRainTime:null;
    const firstRain=firstRainTime?{t:firstRainTime}:null;
    const rainUntil=activeNow?rainUntilTime(X):null;
    const endLabel=rainUntil?hhmm(rainUntil):null;
    const startTime=!activeNow&&firstRainTime?hhmm(firstRainTime):null;

    if(stateRain&&storm){
      sum=endLabel?"Burza występuje teraz i może utrzymać się do około "+endLabel+".":"Burza występuje teraz.";
    }else if(stateRain&&snow){
      sum=endLabel?"Śnieg pada teraz i może potrwać do około "+endLabel+".":"Śnieg pada teraz.";
    }else if(stateRain&&(currentRainMm(X)>0.05||Number(X?.precip)>0.05)){
      sum=endLabel?"Deszcz pada teraz i może potrwać do około "+endLabel+".":"Deszcz pada teraz.";
    }else if(stateRain){
      sum="Mżawka lub słaby deszcz występuje teraz.";
    }else if(firstRain){
      sum=endLabel?"Opady zaczną się około "+startTime+" i potrwają do około "+endLabel+".":"Opady zaczną się około "+startTime+".";
    }else{
      sum="Brak opadów w najbliższych godzinach";
    }

    const v=X.timeline.slots.map(x=>x.mm*4);
    const peak=v.length?Math.max(...v):0;
    if(peak>=.1)sub="Największe natężenie: "+(peak<.5?"słaby deszcz":peak<2.5?"słabe opady":peak<7.6?"umiarkowane opady":"silne opady")+" ("+fnum(peak,1)+" mm/h)";
    bars=X.timeline.slots.map(x=>{
      const popVal=x.pop==null?0:Math.round(x.pop);
      const pop=x.pop==null?"–":popVal+"%";
      const mm=Number(x.mm)||0;
      const isRealPrecip=mm>0.005;
      const isTrace=mm>=0.005&&mm<0.15;
      const label=isTrace
        ? "< 0,1 mm"
        : mm<0.005
          ? "0"
          : fnum(mm,2)+" mm";
      const displayMm=isTrace?Math.max(0.08, mm):mm;
      const barH=isRealPrecip?Math.round(clamp(displayMm,0,1)*54+4):0;
      const kind=mm>0.05?precipKindLabel(mm, popVal, x.code):"";
      return `<i class="${!isRealPrecip?"z":""}${isTrace?" trace":""}" style="--bar-h:${barH}px"><b>${pop}</b>${kind?`<span class="nc-kind">${kind}</span>`:""}<small>${label}</small><em>${hhmm(x.t)}</em></i>`;
    }).join("");

}

function rainUntilTime(X){
  const rawSlots=Array.isArray(X?.timeline?.slots)?X.timeline.slots:[];
  if(!rawSlots.length)return null;

  const slots=[...rawSlots].sort((a,b)=>{
    const at=new Date(a?.t).getTime();
    const bt=new Date(b?.t).getTime();
    return (Number.isFinite(at)?at:Infinity)-(Number.isFinite(bt)?bt:Infinity);
  });

  const first=slots[0];
  const firstMm=Number(first?.mm);
  if(!Number.isFinite(firstMm)||firstMm<=0.05)return null;

  for(let i=1;i<slots.length;i++){
    const mm=Number(slots[i]?.mm);
    if(!Number.isFinite(mm)||mm<0.05){
      const t=slots[i]?.t;
      const d=t instanceof Date?t:new Date(t);
      return Number.isFinite(d.getTime())?d:null;
    }
  }

  const last=slots[slots.length-1]?.t;
  const lastDate=last instanceof Date?last:new Date(last);
  return Number.isFinite(lastDate.getTime())
    ? new Date(lastDate.getTime()+15*60000)
    : null;
}
function isDayAt(iso){
  const {daily}=S.data,di=daily.time.indexOf(iso.slice(0,10));
  const t=new Date(iso);
  if(di>=0&&daily.sunrise?.[di]&&daily.sunset?.[di])return t>=new Date(daily.sunrise[di])&&t<new Date(daily.sunset[di]);
  const h=t.getHours();return h>=6&&h<19;
}

function getHourlyCode(hourlyData,idx){
  const pr=Number(hourlyData?.precipitation?.[idx]??0);
  const rawCode=Number(hourlyData?.weather_code?.[idx]??0);
  const cloud=Number(hourlyData?.cloud_cover?.[idx]??0);

  // Zasadnicza zasada: brak opadu (pr <= 0.05 mm) oznaczamy kodem zachmurzenia bezopadowym.
  if(pr<=0.05 || cloud<=15){
    if(rawCode===45||rawCode===48)return rawCode;
    if(cloud<=15)return 0;
    if(cloud<=40)return 1;
    if(cloud<=70)return 2;
    return 3;
  }
  if(isPrecipCode(rawCode))return rawCode;
  return pr>0.05?61:(cloud<=15?0:cloud<=40?1:cloud<=70?2:3);
}

function canonicalHourlyForRender(){
  return S.fusionLockedHourly||S.data?.hourly||null;
}

function hourlyHTML(X){
  const hourly=canonicalHourlyForRender();let out="";

    const prNow = Number(hourly.precipitation?.[idx] ?? 0);
    const cloudNow = Number(hourly.cloud_cover?.[idx] ?? 0);
    let code = (i === 0)
      ? (currentRainMm(X) > 0.05 ? (X.currentState?.code ?? 61) : (cloudNow <= 15 ? 0 : cloudNow <= 40 ? 1 : cloudNow <= 70 ? 2 : 3))
      : getHourlyCode(hourly, idx);
    if(prNow <= 0.05 && isRainCode(code)){

    }

function smoothPath(pts){
  if(pts.length<2)return"";
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

// Rosa x/15 — przywrócona istniejąca logika calculateLeafWetness() z Aura Pogoda v1.0
// (repo Pogoda-API, src/utils/weatherUtils.ts, skala 0–15 zwilżenia/rosy). Progi i przedziały punktów bez zmian.
// Wartość wynika przede wszystkim z różnicy T − punkt rosy; pomocniczo: wilgotność, wiatr, zachmurzenie, dzień/noc, opad.
// Jedyna zmiana względem oryginału: zachmurzenie osłabia nocne/dzienne wychładzanie radiacyjne (wcześniej nieużywane).
// Punkt rosy pochodzi z istniejącej dewPoint() albo ze stacji IMGW — nie ma tu drugiego algorytmu.
function dewWetness(o){
  const temp=o.temp,dew=o.dew;
  if(!Number.isFinite(temp)||!Number.isFinite(dew))return null;
  const h=Number.isFinite(o.hum)?clamp(o.hum,0,100):50;
  const w=Number.isFinite(o.wind)?Math.max(0,o.wind):10;
  const night=o.isDay===false||o.isDay===0;
  const code=Number.isFinite(o.code)?o.code:null;
  const p=Number.isFinite(o.precip)?Math.max(0,o.precip):0;
  const isPrecipCode=code!=null&&code>=50&&code<=99;
  const isRecentPrecipCode=code!=null&&code>=20&&code<=29;
  const isFogCode=code===45||code===48;
  // 1. Opad ma pierwszeństwo (jak w oryginale)
  if(p>0.05)return{score:Math.min(15,Math.max(12,Math.round(12+Math.min(3,p*2)))),label:"Zwilżenie deszczowe"};
  if(p>0)return{score:11,label:"Śladowy opad"};
  if(isPrecipCode)return{score:10,label:"Mokry liść, mżawka"};
  // 2. Rosa: efektywna różnica T − Td (po odjęciu wychładzania radiacyjnego liścia)
  const rawDepression=Math.max(0,temp-dew);
  const calmFactor=Math.max(0.15,1-Math.min(1,w/28));                  // wiatr miesza powietrze i osusza liście
  const clearFactor=Number.isFinite(o.cloud)?1-0.75*clamp(o.cloud,0,100)/100:1; // chmury ograniczają wychładzanie
  const radiativeDrop=(night?2.3:0.4)*calmFactor*clearFactor;
  const eff=Math.max(0,rawDepression-radiativeDrop);
  let sc=0;
  if(eff<=0.5||h>=95||(isFogCode&&h>=88)){
    sc=Math.min(11,Math.max(8,eff<=0.2?11:eff<=0.4?10:9));
  }else if(eff<=1.8||h>=84||(isFogCode&&h>=75)){
    sc=Math.min(7,Math.max(4,Math.round(7-((eff-0.5)/1.3)*3)));
  }else if(eff<=3.8||(night&&h>=68)||(!night&&h>=74)){
    sc=Math.min(3,Math.max(2,eff<=2.8||h>=75?3:2));
  }else if(eff<=5.0&&night&&w<=12){
    sc=1;
  }
  if(isRecentPrecipCode&&sc<6&&h>=70)sc=Math.min(8,sc+3);
  if(w>20&&sc>0&&sc<=7)sc=Math.max(0,sc-1);
  sc=Math.min(15,Math.max(0,sc));
  const label=sc>=12?"Mokry liść":sc>=8?(night?"Obfita rosa nocna":"Obfita rosa poranna"):sc>=4?"Lekka rosa":sc>=2?(night?"Możliwa rosa nocna":"Śladowa wilgoć"):sc===1?"Prawie sucho":"Sucho";
  return{score:sc,label};
}

function wLeafWetness(X){
  const dp=X.dewStation!=null?X.dewStation:X.dew;

  const temp=X.T;

  const night=X.isDay===false||X.isDay===0;
  const h=Number.isFinite(X.hum)?clamp(X.hum,0,100):50;
  const p=currentRainMm(X);
  const r=dewWetness({temp,dew:dp,hum:h,wind:w,cloud:X.cloud,isDay:X.isDay,code:X.code,precip:p});

  const score = (r != null && Number.isFinite(r.score)) ? clamp(Math.round(r.score), 0, 15) : null;
  const fillPct = score != null ? Math.round((score / 15) * 100) : 0;

  let statusLabel = "Brak danych o wilgotności liści";
  let dewSub = "";
  if (score === 0) {
    statusLabel = "Liście suche jak pieprz 🌿";
    dewSub = "Rosa raczej się nie pojawi";
  } else if (score <= 4) {
    statusLabel = "Liście prawie suche";
    dewSub = "Rosa raczej się nie pojawi";
  } else if (score <= 8) {
    statusLabel = "Liście lekko wilgotne";
    dewSub = "Rosa może się pojawić 💧";
  } else if (score <= 12) {
    statusLabel = "Liście wyraźnie wilgotne 💧";
    dewSub = "Rosa może pojawić się wkrótce 💧";
  } else if (score != null) {
    statusLabel = "Liście mokre 🌧️";
    dewSub = "Obfita rosa na roślinach 💧";
  }

  const barGrad = score >= 13
    ? "linear-gradient(90deg,#0284c7,#38bdf8)"
    : score >= 9
    ? "linear-gradient(90deg,#059669,#38bdf8)"
    : score >= 5
    ? "linear-gradient(90deg,#10b981,#a3e635)"
    : "linear-gradient(90deg,#64748b,#94a3b8)";

  return`<div id="w-leaf" class="w">
    <div class="wh">${mini("leaf")}Wilgotność liści</div>
    <div class="wv tn">${fillPct}<small>%</small> <span style="font-size:14px;font-weight:600;opacity:0.85;margin-left:4px">· ${score!=null?score+"/15":"–/15"}</span></div>
    <div style="margin:6px 0 4px">
      <div style="height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${fillPct}%;background:${barGrad};border-radius:3px;transition:width .4s ease-out"></div>
      </div>
    </div>
    <div class="ws">
      <b style="color:var(--ink);display:block;margin-bottom:2px">${statusLabel}</b>
      <div style="font-size:12px;color:var(--ink2)">${dewSub}</div>
    </div>
  </div>`;
}
function wPress(X){
  const p=X.press;if(!p)return"";
  const k=clamp((p-970)/80,0,1),th=Math.PI*(1-k),cx=60,cy=58,r=46;
  const px=(cx+Math.cos(th)*r).toFixed(1),py=(cy-Math.sin(th)*r).toFixed(1);
  const d=X.pDelta!=null?Number(X.pDelta):null;
  
  let trendHtml="";
  if(d===null||!Number.isFinite(d)){
    trendHtml=`<span style="opacity:0.75;font-size:11.5px">Brak danych o zmianie w ostatnich 3h</span>`;
  }else if(d>0.4){
    const dVal=fnum(Math.abs(d),1);
    trendHtml=`<span style="display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#fbbf24;font-weight:600;font-size:12px;line-height:1.3">📈 Wzrosło o ${dVal} hPa w ostatnich 3 godzinach</span>`;
  }else if(d<-0.4){
    const dVal=fnum(Math.abs(d),1);
    trendHtml=`<span style="display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#38bdf8;font-weight:600;font-size:12px;line-height:1.3">📉 Spadło o ${dVal} hPa w ostatnich 3 godzinach</span>`;
  }else{
    trendHtml=`<span style="display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#94a3b8;font-weight:600;font-size:12px;line-height:1.3">➡️ Ciśnienie prawie bez zmian w ostatnich 3 godzinach</span>`;
  }

  // Wykres trendu z ostatnich 24 godzin
  let sparklineHtml="";
  const hist=X.pressHistory||[];
  if(hist.length>=3){
    const vals=hist.map(h=>h.p);
    const minP=Math.min(...vals);
    const maxP=Math.max(...vals);
    const diff24=vals[vals.length-1]-vals[0];
    const range=Math.max(1.2, maxP-minP);
    const W=140, H=28, padX=3, padY=4;
    const uw=W-padX*2, uh=H-padY*2;
    
    const pts=vals.map((v,i)=>{
      const x=padX+(i/(vals.length-1))*uw;
      const y=padY+uh-((v-minP)/range)*uh;
      return{x:+x.toFixed(1),y:+y.toFixed(1)};
    });
    
    const pathD=pts.reduce((acc,pt,i)=>i===0?`M ${pt.x},${pt.y}`:`${acc} L ${pt.x},${pt.y}`,"");
    const lastPt=pts[pts.length-1];
    const firstPt=pts[0];
    const areaD=`${pathD} L ${lastPt.x},${H} L ${firstPt.x},${H} Z`;

    const trendColor=diff24>0.8?"#fbbf24":diff24<-0.8?"#38bdf8":"#94a3b8";
    const areaGradStart=diff24>0.8?"rgba(251,191,36,.25)":diff24<-0.8?"rgba(56,189,248,.25)":"rgba(148,163,184,.18)";

    sparklineHtml=`
      <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08);width:100%">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--ink2);margin-bottom:2px">
          <span>Ostatnie 24 h</span>
          <span>min ${Math.round(minP)} · max ${Math.round(maxP)}</span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:28px;overflow:visible;display:block">
          <defs>
            <linearGradient id="pressGrad24" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${areaGradStart}"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#pressGrad24)"/>
          <path d="${pathD}" fill="none" stroke="${trendColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${lastPt.x}" cy="${lastPt.y}" r="2.8" fill="${trendColor}" stroke="rgba(8,15,32,.7)" stroke-width="1.2"/>
        </svg>
      </div>
    `;
  }

  return`<div class="w"><div class="wh">${mini("gauge")}Ciśnienie</div><svg class="gauge" viewBox="0 0 120 66" role="img" aria-label="${p} hPa"><path d="M14 58A46 46 0 0 1 106 58" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6" stroke-linecap="round"/><circle cx="${px}" cy="${py}" r="6.500" fill="#fff" stroke="rgba(8,15,32,.55)" stroke-width="3"/><text x="60" y="54" text-anchor="middle" font-size="21" font-weight="600" fill="#fff" class="tn">${p}</text></svg><div class="ws" style="text-align:center;padding-top:2px"><div style="font-size:11.5px;opacity:0.8;margin-bottom:4px">poziom morza</div><div style="display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:12px;background:rgba(255,255,255,0.06);width:100%">${trendHtml}</div>${sparklineHtml}</div></div>`;
}
function getVisInfo(km){
  if(km==null||!Number.isFinite(km))return "Brak pomiaru widoczności";
  const val=Math.max(0,km);
  if(val>20)return "Bardzo dobra widoczność 👀";
  if(val>=10)return "Dobra widoczność";
  if(val>=5)return "Widoczność ograniczona";
  if(val>=2)return "Widoczność wyraźnie ograniczona";
  return "Słaba widoczność 🌫️";
}
function wVis(X){
  const wa=Number(S.weatherapi?.vis_km);
  const om=Number(X?.visKm);
  const waOk=Number.isFinite(wa)&&wa>=0;
  const omOk=Number.isFinite(om)&&om>=0;
  let km=waOk?wa:omOk?om:null;

  const currentCode=Number(X?.code);
  const currentPrecip=Number(X?.precip??0);
  const hasVisReducing=isVisibilityReducingPhenomenon(currentCode,currentPrecip,S.imgwData);

  if(km!==null&&!hasVisReducing&&km<10){
    km=10;
  }
  const value=km==null?"–":fnum(km,1);
  const desc=getVisInfo(km);
  const source=waOk?"WeatherAPI · vis_km":omOk?"Open-Meteo · visibility":"Brak pomiaru";
  return`<div class="w">
    <div class="wh">${mini("eye")}Widoczność</div>
    <div class="wv tn">${value} <small>km</small></div>
    <div class="ws">
      <b style="color:var(--ink);display:block;margin-bottom:2px;font-size:12.5px">${desc}</b>
      <span style="opacity:0.65;font-size:11px">${source}</span>

}
function totalCloudHumanDesc(cloudVal){
  if(cloudVal==null||!Number.isFinite(Number(cloudVal)))return null;
  const v=clamp(Math.round(Number(cloudVal)),0,100);
  if(v<=10)return "Czyste niebo";
  if(v<=30)return "Prawie całe niebo czyste";
  if(v<=50)return "Chmury i przejaśnienia";
  if(v<=70)return "Chmur jest sporo, są przejaśnienia";

  return "Całe niebo zasnute chmurami";

function wSun(X){
  if(!(X.rad>50&&X.isDay))return"";

  const sh=calcSunShadeTemp(X.T, X.feels, X.rad, X.wind, X.hum);
  const diff = Math.abs(sh.shade - sh.airShade);

  const shadeTxt = diff >= 1.0
    ? `W cieniu odczuwalna <b>${fnum(sh.shade,1)}°C</b> (powietrze <b>${fnum(sh.airShade,1)}°C</b>)`
    : `W cieniu <b>${fnum(sh.airShade,1)}°C</b>`;

  const gainTxt = sh.gain > 0
    ? ` Słońce dogrzewa o +${fnum(sh.gain,1)}°C.`
    : "";

  // Krótka diagnostyka pokazuje dokładnie, co steruje korektą słoneczną.
  // Nie zmienia wyniku — tylko ujawnia jego składniki.
  const diag = `GHI ${sh.radiation} W/m² · wiatr ${fnum(sh.windKmh,1)} km/h · współczynnik słońca ${fnum(sh.solarFraction,3)} · tłumienie wiatru ${fnum(sh.windDamping,3)}`;

  return`<div id="w-sun" class="w full">
    <div class="wh">${mini("sun")}Słońce i cień</div>
    <div class="wv tn">${fnum(sh.sun,1)}° <small>odczuwalna na słońcu</small></div>
    <div class="ws">${shadeTxt}. Promieniowanie ${Math.round(X.rad)} W/m².${gainTxt}</div>
    <div class="note" style="margin-top:7px;font-size:11px;opacity:.82">${diag}</div>
  </div>`;
}

function modelsHTML(){
  const c=S.confidence,mc=S.modelCompare,acc=getAccuracyStats();
  const names={icon_seamless:"ICON (DWD)",ecmwf_ifs025:"ECMWF IFS",gfs_seamless:"GFS (NOAA)"};
  let body="";
  if(c){
    const col=c.pct>=85?"var(--ok)":c.pct>=65?"var(--warn)":"var(--bad)";
    const lb=c.pct>=85?"Modele są zgodne":c.pct>=65?"Zgodność umiarkowana":"Modele się rozjeżdżają";
    body+=`<div style="display:flex;align-items:baseline;gap:10px"><span class="wv tn" style="font-size:34px;color:${col}">${c.pct}%</span><span style="font-weight:600">${lb}</span></div><div class="meter"><i style="width:${c.pct}%;background:${col}"></i></div>${c.spread>0?`<div class="note" style="margin:0 0 6px">Rozrzut temperatury między modelami: ${fnum(c.spread,1)}°</div>`:""}`;
  }
  if(mc&&mc.length){
    const ts=mc.map(m=>m.temp),lo=Math.min(...ts),hi=Math.max(...ts),sp=Math.max(.5,hi-lo);
    body+=mc.map(m=>`<div class="mrow"><span>${names[m.name]||m.name}</span><div class="mtrack"><u style="left:${((m.temp-lo)/sp*80+10).toFixed(1)}%"></u></div><b class="tn">${fnum(m.temp,1)}°</b></div>`).join("");
    const clouds=mc.filter(m=>Number.isFinite(Number(m.cloud))).map(m=>Number(m.cloud));
    if(clouds.length){
      const clo=Math.min(...clouds),chi=Math.max(...clouds),csp=Math.max(1,chi-clo);
      const cavg=clouds.reduce((a,b)=>a+b,0)/clouds.length;
      body+=`<div class="note" style="margin:10px 0 6px;font-weight:600;color:var(--ink2)">Aktualne zachmurzenie modeli</div>`;
      body+=mc.filter(m=>Number.isFinite(Number(m.cloud))).map(m=>`<div class="mrow"><span>${names[m.name]||m.name}</span><div class="mtrack"><u style="left:${((Number(m.cloud)-clo)/csp*80+10).toFixed(1)}%"></u></div><b class="tn">${Math.round(Number(m.cloud))}%</b></div>`).join("");
      body+=`<div class="note" style="margin:4px 0 0">Średnia modeli: ${Math.round(cavg)}% · rozrzut: ${Math.round(chi-clo)} pkt. To diagnostyka; główne zachmurzenie aplikacji pochodzi z aktywnego modelu.</div>`;
    }
  }else if(!c)body+=`<div class="note" style="margin-top:0">Porównanie modeli pojawi się po chwili.</div>`;
  if(acc)body+=`<div class="note">Trafność temperatury z historii tej aplikacji: ${acc.accuracy}% (${acc.count} zweryfikowanych prognoz).</div>`;
  return`<section class="card"><div class="ch">${mini("layers")}<span class="grow">Zgodność modeli</span></div>${body}
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn" data-act="model">Zmień model</button><button class="btn" data-act="raw">Surowe dane</button><button class="btn pri" data-act="pipeline">🔬 Diagnostyka źródeł</button></div></section>`;
}
