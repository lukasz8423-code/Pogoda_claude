async function startRadar(){
  if(RV.state==="loading"||RV.state==="ready")return;
  RV.state="loading";
  const slot=$("#radar-slot");if(slot)slot.innerHTML=`<div class="radar-ph"><div>Ładowanie radaru…</div></div>`;
  try{
    await loadLeaflet();
    const r=await fetch("https://api.rainviewer.com/public/weather-maps.json",{signal:AbortSignal.timeout(9000)});
    if(!r.ok)throw new Error("rainviewer "+r.status);
    const j=await r.json();
    RV.host=j.host||"https://tilecache.rainviewer.com";
    RV.frames=(j.radar?.past||[]).slice(-10);
    if(!RV.frames.length)throw new Error("brak klatek");
    const node=document.createElement("div");node.id="radar-slot";
    node.innerHTML=`<div class="rmap" id="rmap"></div><div class="rctl"><button class="ib" data-act="rplay" aria-label="Odtwórz animację">${mini("play")}</button><input type="range" id="rslider" min="0" max="${RV.frames.length-1}" value="${RV.frames.length-1}" aria-label="Klatka radaru"/></div><div class="note">Radar: RainViewer. Mapa: OpenStreetMap, CARTO. Klatki co 10 minut.</div>`;
    const cur=$("#radar-slot");cur.replaceWith(node);RV.node=node;
    const map=L.map($("#rmap"),{zoomControl:false,minZoom:5,maxZoom:9,attributionControl:false}).setView([S.lat,S.lng],7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:9}).addTo(map);
    RV.layers=RV.frames.map(f=>L.tileLayer(`${RV.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:9,zIndex:5}).addTo(map));
    L.circleMarker([S.lat,S.lng],{radius:6,color:"#fff",weight:2,fillColor:"#FFC857",fillOpacity:1}).addTo(map);
    RV.map=map;RV.pos=RV.frames.length-1;RV.state="ready";radarShow(RV.pos);
  }catch(e){
    console.warn("Radar:",e.message);
    RV.state="fail";
    const cur=$("#radar-slot");
    const node=document.createElement("div");node.id="radar-slot";
    const p=document.createElement("div");p.className="note";p.style.cssText="margin:0 0 10px";p.textContent="Nie udało się pobrać prawdziwego radaru. Poniżej symulacja na podstawie opadu z modelu, nie pomiar.";
    node.appendChild(p);node.appendChild(buildSimRadar(S.X.code,S.X.precip));
    if(cur)cur.replaceWith(node);RV.node=node;
  }
}

function runLiveDataQualityGuard(){
  const d=S.pipelineDiag;
  if(!d){S.liveHealth=null;return null;}
  const rows=d.rows||[],alerts=[];
  const add=(code,severity,message,step=null)=>alerts.push({code,severity,message,step});
  const now=new Date(),expected=new Date(now);expected.setMinutes(0,0,0);
  const expectedHour=expected.getHours();
  if(d.uiCurrentHour!==d.fusionCurrentHour||rows[0]&&new Date(rows[0].time).getHours()!==expectedHour)
    add("CRITICAL_TIME_DESYNC","critical","Bieżący slot UI/Fusion nie odpowiada lokalnej pełnej godzinie.",0);
  if(Math.abs(Number(d.fusionBias?.temperature||0))>2){
    const a=rows.slice(1,3).find(r=>Number.isFinite(Number(r.auraFinal))&&Number.isFinite(Number(r.openMeteo))&&Math.abs(r.auraFinal-r.openMeteo)>2);
    if(a)add("ERROR_BIAS_EXPLOSION","error","Bias temperatury > ±2°C powoduje >2°C odchylenia Aura Final od modelu.",a.step);
  }
  for(let i=1;i<rows.length;i++){
    const p=rows[i-1],r=rows[i],drop=Number(p.openMeteo)-Number(r.openMeteo),precip=Number(r.precipitation),lag=Number(r.auraFinal)-Number(r.openMeteo);
    if(drop>=4&&precip>=1.5&&Number.isFinite(lag)&&Math.abs(lag)>1.5)
      add("ERROR_FRONT_LAG","error","Front: spadek >=4°C/h + opad >=1.5 mm, ale Aura Final pozostaje >1.5°C od modelu.",r.step);
  }
  if(d.imgwForecastAvailable===false)
    add("WARN_MISSING_IMGW_FORECAST","warn","Brak godzinowego feedu IMGW Hybrid; prognoza używa modelu i obserwacji stacji.",null);
  if(d.ghostPrecipitation)
    add("WARN_GHOST_PRECIPITATION","warn","Wykryto brak opadu w realnym pomiarze stacyjnym - zmniejsz wagę opadu z modelu dla bieżącej godziny.",0);
  if(d.ghostVisibilityDrop)
    add("WARN_GHOST_VISIBILITY_DROP","warn","Zaniżenie widoczności na podstawie modelu opadu przy braku rzeczywistego opadu na stacji.",0);
  for(const key of ["tempWeight","humidityWeight","windWeight"]){
    for(let i=1;i<rows.length;i++){
      if(!rows[i].dynamicFront&&Number(rows[i-1][key])>0.25&&Number(rows[i][key])===0){
        add("WARN_ZERO_WEIGHT_DROP","warn",key+" spada do 0 dla T+"+i+" zamiast wygaszać korektę.",i);break;
      }
    }
  }
  if(d.nullFlags?.length)add("WARN_NULL_SOURCE","warn","Brakujące wartości: "+d.nullFlags.join(", "),null);
  const map=new Map();
  for(const a of alerts){const k=a.step==null?"global":a.step;if(!map.has(k))map.set(k,[]);map.get(k).push(a);}
  rows.forEach(r=>r.alerts=map.get(r.step)||[]);
  S.liveHealth={capturedAt:Date.now(),status:alerts.some(a=>a.severity==="critical"||a.severity==="error")?"ERROR":alerts.length?"WARN":"OK",alerts};
  return S.liveHealth;
}

// ═══════════════════════════════════════════════
// AURA FUSION ENGINE — obserwacja IMGW ↔ model
// Nie zmienia kodów pogody, chmur ani opadu: fusion dotyczy tylko
// parametrów, dla których obserwacja stacyjna ma sens.
// ═══════════════════════════════════════════════
function smoothstep01(x){
  const t=clamp(Number(x),0,1);
  return t*t*(3-2*t);
}
function fusionFreshnessWeight(ageMinutes){
  const a=Number(ageMinutes);
  if(!Number.isFinite(a)||a<0)return 0;
  if(a<=30)return 1;
  if(a<=75)return 1-0.35*smoothstep01((a-30)/45);
  if(a<=120)return 0.65*(1-smoothstep01((a-75)/45));
  return 0;
}
function fusionDistanceWeight(distKm){
  const d=Number(distKm);
  if(!Number.isFinite(d)||d<0)return 0;
  if(d<=10)return 1;
  if(d<=45)return 1-smoothstep01((d-10)/35);
  return 0;
}
function fusionParameterWeight(ageMinutes,distKm,valid){
  if(!valid)return 0;
  return clamp(fusionFreshnessWeight(ageMinutes)*fusionDistanceWeight(distKm),0,1);
}
function circularBlendDegrees(model,observed,weight){
  const m=Number(model),o=Number(observed),w=clamp(Number(weight),0,1);
  if(!Number.isFinite(o))return Number.isFinite(m)?m:null;
  if(!Number.isFinite(m))return o;
  const delta=((o-m+540)%360)-180;
  return (m+delta*w+360)%360;
}
function currentHourIndex(data,now=new Date()){
  const times=data?.hourly?.time||[];
  if(!times.length)return 0;

  // Jeden kanoniczny slot dla UI, fuzji i historii: bieżąca lokalna godzina
  // zaokrąglona w dół do pełnej godziny. Nie przełączamy się na następny
  // slot po :30 tylko dlatego, że current.time modelu ma inny znacznik.
  const target=new Date(now);
  target.setMinutes(0,0,0);
  const targetTs=target.getTime();

  let best=0,bestDiff=Infinity;
  for(let i=0;i<times.length;i++){
    const ts=Date.parse(String(times[i]));
    if(!Number.isFinite(ts))continue;
    const diff=Math.abs(ts-targetTs);
    if(diff<bestDiff){bestDiff=diff;best=i;}
  }
  return best;
}
function bridgeAlpha(hoursAhead,weight){
  // Decaying Bias: T+1 100%, T+2 50%, T+3 25%, T+4+ 0%.
  const h=clamp(Number(hoursAhead),0,6);
  const profile=[1,1,0.5,0.25,0,0,0];
  return clamp((Number(weight)||0)*profile[Math.round(h)],0,1);
}
function hasFiniteValue(val){
  return val!==null&&val!==undefined&&val!==""&&Number.isFinite(Number(val));
}
function toFiniteNumber(val){
  return hasFiniteValue(val)?Number(val):null;
}
function fuseObservedValue(modelValue,observedValue,weight){
  const m=toFiniteNumber(modelValue),o=toFiniteNumber(observedValue),w=clamp(toFiniteNumber(weight)??0,0,1);
  if(o===null)return m;
  if(m===null||w>=0.999)return o;
  return m+(o-m)*w;
}
function applyObservationFusion(data,imgwData){
  if(!data?.current||!imgwData)return {weight:0,bias:{},weights:{},completeness:{},used:false};
  const cur=data.current;
  const dist=toFiniteNumber(imgwData.dist);
  const ages={
    temperature:toFiniteNumber(imgwData.tempAgeMinutes??imgwData.ageMinutes),
    humidity:toFiniteNumber(imgwData.humidityAgeMinutes??imgwData.ageMinutes),
    wind:toFiniteNumber(imgwData.windAgeMinutes??imgwData.ageMinutes),
    windDirection:toFiniteNumber(imgwData.windDirAgeMinutes??imgwData.ageMinutes)
  };
  const obs={
    temperature:toFiniteNumber(imgwData.temperatura),
    humidity:toFiniteNumber(imgwData.wilgotnosc_wzgledna),
    wind:toFiniteNumber(imgwData.predkosc_wiatru),
    windDirection:toFiniteNumber(imgwData.kierunek_wiatru)
  };
  if(obs.wind!==null)obs.wind*=3.6;
  const model={
    temperature:toFiniteNumber(cur.temperature_2m),
    humidity:toFiniteNumber(cur.relative_humidity_2m),
    wind:toFiniteNumber(cur.wind_speed_10m),
    windDirection:toFiniteNumber(cur.wind_direction_10m)
  };
  const valid={
    temperature:Number.isFinite(obs.temperature)&&Number.isFinite(model.temperature)&&Math.abs(obs.temperature-model.temperature)<=12,
    humidity:Number.isFinite(obs.humidity)&&Number.isFinite(model.humidity),
    wind:Number.isFinite(obs.wind)&&Number.isFinite(model.wind),
    windDirection:Number.isFinite(obs.windDirection)&&Number.isFinite(model.windDirection)
  };
  const weights={
    temperature:fusionParameterWeight(ages.temperature,dist,valid.temperature),
    humidity:fusionParameterWeight(ages.humidity,dist,valid.humidity),
    wind:fusionParameterWeight(ages.wind,dist,valid.wind),
    windDirection:fusionParameterWeight(ages.windDirection,dist,valid.windDirection)
  };
  if(!Object.values(weights).some(v=>v>0))return {weight:0,bias:{},weights,completeness:{},used:false};
  if(weights.temperature>0)cur.temperature_2m=+fuseObservedValue(model.temperature,obs.temperature,weights.temperature).toFixed(1);
  if(weights.humidity>0)cur.relative_humidity_2m=+fuseObservedValue(model.humidity,obs.humidity,weights.humidity).toFixed(0);
  if(weights.wind>0)cur.wind_speed_10m=+fuseObservedValue(model.wind,obs.wind,weights.wind).toFixed(1);
  if(weights.windDirection>0)cur.wind_direction_10m=Math.round(circularBlendDegrees(model.windDirection,obs.windDirection,weights.windDirection))%360;
  const completeness={
    temperature:valid.temperature?1:0,
    humidity:valid.humidity?1:0,
    wind:valid.wind?1:0,
    windDirection:valid.windDirection?1:0
  };
  const bias={
    temperature:valid.temperature?clamp(obs.temperature-model.temperature,-1.5,1.5):0,
    humidity:valid.humidity?obs.humidity-model.humidity:0,
    wind:valid.wind?obs.wind-model.wind:0
  };
  return {weight:Math.max(...Object.values(weights)),weights,bias,completeness,before:model,used:true};
}
function findHourIndexByTime(times,time){
  if(!Array.isArray(times)||!times.length||!time)return -1;
  const target=Date.parse(String(time));
  if(!Number.isFinite(target))return -1;
  let best=-1,bestDiff=Infinity;
  for(let i=0;i<times.length;i++){
    const ts=Date.parse(String(times[i]));
    if(!Number.isFinite(ts))continue;
    const diff=Math.abs(ts-target);
    if(diff<bestDiff){best=i;bestDiff=diff;}
  }
  return best;
}

// T0 = obserwacja. T+1..T+6 = model krótkoterminowy + wygaszany bias
// stacji. Wszystkie moduły korzystają z tego samego kanonicznego ci.
// Dodatkowo profil temperatury jest kotwiczony do trendu IMGW/SYNOP, jeśli
// aplikacja ma już serię świeżych obserwacji tej samej stacji.
function applyForecastBridge(data,fusion,modelData){
  if(!data?.hourly?.time||!fusion?.used)return;
  const target=data.hourly;
  const source=modelData?.hourly?.time?modelData:data;
  const sourceH=source.hourly||target;
  const ci=currentHourIndex(data);
  const b=fusion.bias||{};
  const weights=fusion.weights||{};
  const stationTrendCph=Number.isFinite(Number(fusion.stationTrendCph))
    ?Number(fusion.stationTrendCph):0;

  // Temperatura: IMGW koryguje T0, ale historyczny bias stacji nie może
  // być przenoszony 1:1 na kolejne godziny. Przyszłość ma być zakotwiczona
  // w aktualnej różnicy IMGW-vs-model i szybko wracać do przebiegu modelu.
  const currentModelIdx=findHourIndexByTime(sourceH.time,target.time[ci]);
  const currentModelT=currentModelIdx>=0?Number(sourceH.temperature_2m?.[currentModelIdx]):NaN;
  const currentObservedT=Number(data.current?.temperature_2m);
  const observedModelOffset=Number.isFinite(currentObservedT)&&Number.isFinite(currentModelT)
    ?clamp(currentObservedT-currentModelT,-1.5,1.5):0;
  // Decaying Bias: T+1 100%, T+2 50%, T+3 25%, T+4+ 0%.
  const tempFade=[1,1,0.5,0.25,0,0,0];

  for(let step=0;step<=6;step++){
    const targetIdx=ci+step;
    if(targetIdx>=target.time.length)break;

    const sourceIdx=findHourIndexByTime(sourceH.time,target.time[targetIdx]);
    const si=sourceIdx>=0?sourceIdx:Math.min(targetIdx,sourceH.time.length-1);

    const modelT=Number(sourceH.temperature_2m?.[si]);
    const modelH=Number(sourceH.relative_humidity_2m?.[si]);
    const modelW=Number(sourceH.wind_speed_10m?.[si]);

    // Front/opad dynamiczny: gdy model pokazuje >1.5 mm/h albo nagły
    // spadek temperatury, nie rozciągamy korekty stacji na kolejne godziny.
    const modelPrecip=Number(sourceH.precipitation?.[si]);
    const prevSourceIdx=step>0
      ?findHourIndexByTime(sourceH.time,target.time[targetIdx-1])
      :-1;
    const prevT=prevSourceIdx>=0?Number(sourceH.temperature_2m?.[prevSourceIdx]):NaN;
    const tempDrop=Number.isFinite(prevT)&&Number.isFinite(modelT)?prevT-modelT:0;
    // Front Dynamic Bypass: gwałtowny spadek >=4°C/h + sygnał opadu.
    const dynamicFront=Number.isFinite(modelPrecip)&&modelPrecip>0&&tempDrop>=4;
    const alphaT=dynamicFront&&step>0?0:clamp(tempFade[step]||0,0,1);
    const alphaH=bridgeAlpha(Math.min(step,3),weights.humidity);
    const alphaW=bridgeAlpha(Math.min(step,3),weights.wind);

    if(Number.isFinite(modelT)){
      const trendCorrection=dynamicFront&&step>0?0:stationTrendCph*step;
      const corrected=modelT+observedModelOffset*alphaT+trendCorrection*alphaT;
      target.temperature_2m[targetIdx]=+(step===0&&Number.isFinite(data.current.temperature_2m)
        ?data.current.temperature_2m:corrected).toFixed(1);
    }
    if(Number.isFinite(modelH)){
      const corrected=Number.isFinite(b.humidity)
        ?clamp(modelH+b.humidity*alphaH,0,100)
        :modelH;
      target.relative_humidity_2m[targetIdx]=Math.round(step===0&&Number.isFinite(data.current.relative_humidity_2m)
        ?data.current.relative_humidity_2m:corrected);
    }
    if(Number.isFinite(modelW)){
      const corrected=Math.max(0,modelW+(Number.isFinite(b.wind)?b.wind*alphaW:0));
      target.wind_speed_10m[targetIdx]=+(step===0&&Number.isFinite(data.current.wind_speed_10m)
        ?data.current.wind_speed_10m:corrected).toFixed(1);
    }
  }
}

// Bieżący dzień nie może mieć Tmax/Tmin niższego/wyższego niż faktycznie
// zaobserwowana temperatura lub wartości z jego prognozy godzinowej.
function syncDailyExtremes(data){
  if(!data?.daily?.time||!data?.hourly?.time)return;
  const now=new Date();
  const today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const di=data.daily.time.findIndex(d=>String(d).slice(0,10)===today);
  if(di<0)return;

  const vals=[];
  const curT=Number(data.current?.temperature_2m);
  if(Number.isFinite(curT))vals.push(curT);

  for(let i=0;i<data.hourly.time.length;i++){
    if(String(data.hourly.time[i]).slice(0,10)!==today)continue;
    const t=Number(data.hourly.temperature_2m?.[i]);
    if(Number.isFinite(t))vals.push(t);
  }
  if(!vals.length)return;

  const observedMax=Math.max(...vals);
  const observedMin=Math.min(...vals);
  const oldMax=Number(data.daily.temperature_2m_max?.[di]);
  const oldMin=Number(data.daily.temperature_2m_min?.[di]);

  if(Number.isFinite(observedMax)){
    data.daily.temperature_2m_max[di]=Number.isFinite(oldMax)
      ?Math.max(oldMax,observedMax):observedMax;
  }
  if(Number.isFinite(observedMin)){
    data.daily.temperature_2m_min[di]=Number.isFinite(oldMin)
      ?Math.min(oldMin,observedMin):observedMin;
  }

  // Zachowujemy dziesiętne, ale nie wprowadzamy sztucznego zaokrąglenia do 0.5°C.
  data.daily.temperature_2m_max[di]=+Number(data.daily.temperature_2m_max[di]).toFixed(1);
  data.daily.temperature_2m_min[di]=+Number(data.daily.temperature_2m_min[di]).toFixed(1);
}

// Widoczność z modelu jest sanityzowana godzinowo. Niska wartość może być
// prawdziwa przy mgle/mżawce/intensywnym opadzie; w pozostałych warunkach
// nie pozwalamy modelowi zaniżyć jej poniżej 10 km.
function isFogVisibilityCode(code){
  const c=Number(code);
  return c===45||c===48;
}
function isDrizzleVisibilityCode(code){
  const c=Number(code);
  return c>=51&&c<=57;
}
function stationFreshPrecipMm(imgwData){
  if(!imgwData||Number(imgwData.dist)>5||imgwData.opad10minFresh!==true)return null;
  const mm=Number(imgwData.opad_10min);
  return Number.isFinite(mm)&&mm>=0?mm:null;
}
function stationHasFreshNoPrecip(imgwData){
  const mm=stationFreshPrecipMm(imgwData);
  return mm!==null&&mm<=0;
}
function stationFreshGustKmH(imgwData){
  if(!imgwData||Number(imgwData.dist)>5||imgwData.porywWiatruFresh!==true)return null;
  const ms=Number(imgwData.poryw_wiatru);
  return Number.isFinite(ms)&&ms>=0?ms*3.6:null;
}
function stationFogObserved(imgwData){
  if(!imgwData)return false;
  // Używamy wyłącznie jawnego pola depeszy stacyjnej, jeśli feed je dostarcza.
  // Brak pola nie oznacza mgły.
  const v=imgwData.visibility??imgwData.widocznosc??imgwData.visibility_m;
  if(Number.isFinite(Number(v))&&Number(v)<10000)return true;
  const code=imgwData.weather_code??imgwData.wmo_code??imgwData.zjawisko;
  return isFogVisibilityCode(code);
}
function sanitizeVisibility(data,imgwData){
  if(!data)return;
  const clean=v=>{
    const n=toFiniteNumber(v);
    return n!==null&&n>=0?n:null;
  };

  // WIDOCZNOŚĆ = wyłącznie surowa wartość z API.
  // Żadnych estymacji z RH/chmur/opadu i żadnego nadpisywania wartością IMGW.
  if(data.current){
    const apiCurrent=Number(data.__auraApiCurrentVisibility);
    const directCurrent=Number(data.current.visibility);
    const directRoot=Number(data.visibility);
    const apiValue=Number.isFinite(apiCurrent)&&apiCurrent>0
      ?apiCurrent
      :Number.isFinite(directCurrent)&&directCurrent>0
        ?directCurrent
        :Number.isFinite(directRoot)&&directRoot>0
          ?directRoot
          :null;
    if(apiValue!==null)data.current.visibility=apiValue;
  }

  if(Array.isArray(data.hourly?.visibility)){
    for(let i=0;i<data.hourly.visibility.length;i++){
      data.hourly.visibility[i]=clean(data.hourly.visibility[i]);
    }
  }

  data.__stationVisibilityGuard={
    stationNoPrecip:stationHasFreshNoPrecip(imgwData),
    stationFog:stationFogObserved(imgwData),
    forcedCurrentVisibility:false,
    stationVisibilityAvailable:false
  };
}

      wind_gusts_10m:times.map(()=>18),relative_humidity_2m:times.map(()=>65),pressure_msl:times.map(()=>1016),visibility:times.map(()=>24000),
      shortwave_radiation:times.map(t=>Math.max(0,Math.round(arc(t,500,0))))},
    daily:{time:dts,weather_code:[2,1,3,2,1,2,3,2,1,2],temperature_2m_max:[22,24,19,21,23,25,20,22,23,21],temperature_2m_min:[12,13,11,12,13,14,11,12,13,11],
      precipitation_probability_max:[15,10,30,20,10,5,25,15,10,20],precipitation_sum:[0,0,.5,0,0,0,.3,0,0,.1],uv_index_max:[3,4,2,3,4,5,2,3,4,3],
      sunrise:dts.map(d=>d+"T05:55"),sunset:dts.map(d=>d+"T19:40"),wind_speed_10m_max:[18,15,22,16,14,12,20,15,14,16]}
  };
}

async function handleGPS(){
  gpsErr="";
  netErr=false;

  if(!window.isSecureContext){
    gpsErr="Lokalizacja GPS wymaga bezpiecznego połączenia HTTPS.";
    render();
    return;
  }

  if(!navigator.geolocation){
    gpsErr="Ta przeglądarka nie udostępnia lokalizacji GPS.";
    render();
    return;
  }

  S.loading=true;
  render();

  const getPosition=(options)=>new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve,reject,options);
  });

  try{
    let position;
    try{
      position=await getPosition({
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      });
    }catch(firstErr){
      if(firstErr?.code===1)throw firstErr;
      position=await getPosition({
        enableHighAccuracy:false,
        timeout:10000,
        maximumAge:30000
      });
    }

    const lat=Number(position.coords.latitude);
    const lng=Number(position.coords.longitude);
    const accuracy=Number(position.coords.accuracy);

    if(!Number.isFinite(lat)||!Number.isFinite(lng)){
      throw new Error("Nieprawidłowe współrzędne lokalizacji.");
    }

    S.gpsDiag={lat,lng,accuracy,model:activeModel.id,cloud:null,code:null};
    console.log("GPS:",S.gpsDiag);
    await loadW(lat,lng,null,false);
  }catch(err){
    S.loading=false;

    if(err?.code===1){
      gpsErr="Dostęp do lokalizacji został zablokowany. Zezwól przeglądarce na dostęp do lokalizacji dla tej strony i spróbuj ponownie.";
    }else if(err?.code===2){
      gpsErr="Nie udało się ustalić lokalizacji urządzenia. Sprawdź, czy lokalizacja jest włączona.";
    }else if(err?.code===3){
      gpsErr="Ustalanie lokalizacji trwało zbyt długo. Spróbuj ponownie.";
    }else{
      gpsErr=err?.message||"Nie udało się pobrać lokalizacji.";
    }

    render();
  }
}

let LOAD_SEQ=0;
async function loadW(lat,lng,name,isRef){
  const token=++LOAD_SEQ;
  try{await loadWCore(lat,lng,name,isRef);}catch(e){
    console.error("[AURA loadW]",e);
    if(token!==LOAD_SEQ)return;
    S.loading=false;S.refreshing=false;WEATHER_FORCE_REFRESH=false;
    if(isRef&&S.data)S.phase="weather";
    else Object.assign(S,{phase:"error",loadError:{lat,lng,name:name||S.city||null,msg:String(e?.message||e||"Nieznany błąd")}});
    render();
  }
}
async function loadWCore(lat,lng,name,isRef){
  S.fusion=null;
  S.cloudEngine=null;
  S.pipelineDiag=null;
  S.liveHealth=null;
  S.sourceMode=null;
  S.imgwStatus=null;
  S.ensemble=null;
  S.satelliteCloud=null;
  const sameGps=!!(S.gpsDiag&&Math.abs(S.gpsDiag.lat-lat)<0.000001&&Math.abs(S.gpsDiag.lng-lng)<0.000001);
  if(!sameGps)S.gpsDiag=null;
  if(isRef){
    S.refreshing=true;
    WEATHER_FORCE_REFRESH=true;
    WEATHER_CACHE.clear();
    render();
  }
  else{resetRadar();Object.assign(S,{phase:"loading",loading:true});render();}

  let city=name;
  if(!city)city=await apiCity(lat,lng)||`${(+lat).toFixed(3)}, ${(+lng).toFixed(3)}`;
  document.title="Aura – "+city;

  let data=null,isDemo=false,stationInfo=null,imgwData=null,cloudCompare=[],modelCompareNow=null,confidenceNow=null;
  try{
    const isGpsLocation=!!(S.gpsDiag&&Math.abs(S.gpsDiag.lat-lat)<0.000001&&Math.abs(S.gpsDiag.lng-lng)<0.000001);
    const [weatherResult,imgwResult,cloudResult,satelliteResult]=await Promise.allSettled([
      apiWeather(lat,lng,isRef),
      findNearestIMGW(lat,lng),
      fetchAllModelsCompare(lat,lng,isRef),
      apiSatelliteCloudMask(lat,lng)
    ]);
    if(cloudResult.status==="fulfilled")cloudCompare=cloudResult.value||[];
    if(satelliteResult.status==="fulfilled")S.satelliteCloud=satelliteResult.value||null;
    // Awaria IMGW NIE oznacza awarii Internetu. Open-Meteo jest niezależnym
    // źródłem i musi nadal dostarczyć dane live.
    if(weatherResult.status==="fulfilled"){
      data=weatherResult.value;
    }else{
      // IMGW jest całkowicie niezależne od danych Open-Meteo.
      // W przypadku błędu aktywnego modelu pobieramy surowe LIVE dane
      // bezpośrednio z Open-Meteo, bez ensemble i bez Demo.
      const preferred=["icon_eu","ecmwf_ifs025","gfs_seamless"];
      const fallbackRecord=preferred
        .map(id=>cloudCompare.find(r=>r.model===id&&r.data))
        .find(Boolean);
      if(fallbackRecord){
        data=structuredClone(fallbackRecord.data);
        console.warn("[AURA WEATHER FALLBACK] activeModel fetch failed → using live Open-Meteo",fallbackRecord.model);
      }else{
        // Dopiero gdy nie mamy ŻADNYCH danych z Open-Meteo, spróbuj bezpośrednio
        // modeli live. Demo wolno uruchomić dopiero po wyczerpaniu tych prób.
        let lastWeatherError=weatherResult.reason;
        for(const modelId of preferred){
          try{
            data=await apiWeatherModel(lat,lng,modelId,10,isRef||WEATHER_FORCE_REFRESH);
            console.warn("[AURA WEATHER FALLBACK] direct Open-Meteo success:",modelId);
            break;
          }catch(err){
            lastWeatherError=err;
          }
        }
        if(!data)throw lastWeatherError||new Error("Open-Meteo niedostępne");
      }
    }

    // Twarda blokada bieżącej widoczności z głównego API.
    // Jeśli API zwróciło poprawne visibility > 0, UI ma używać dokładnie tej wartości.
    const apiVisibilityNow=Number(data?.current?.visibility);
    if(Number.isFinite(apiVisibilityNow)&&apiVisibilityNow>0){
      data.__auraApiCurrentVisibility=apiVisibilityNow;
    }
    S.cloudSource=null;

    // IMGW Offline jest stanem źródła, nie powodem do zerowania prognozy.
    // Najpierw budujemy ensemble z realnie dostępnych modeli, a dopiero potem
    // wykonujemy pozostałe sanityzery/render.
    // IMGW status musi opierać się na faktycznej dostępności źródła,
    // a nie tylko na tym, czy Promise zwrócił obiekt. findNearestIMGW może
    // zwrócić stary/pośredni rekord stacji nawet przy niedostępnym feedzie.
    const imgwFeedOffline=
      imgwResult.status!=="fulfilled" ||
      !imgwResult.value ||
      S.imgwDiag?.status==="niedostępne" ||
      S.imgwDiag?.status==="nieprawidłowa odpowiedź";
    const imgwOffline=imgwFeedOffline;
    S.imgwStatus=imgwOffline?"OFFLINE":"ONLINE";
    // Offline: dla zachmurzenia nie używamy ensemble ani średniej.
    // Bierzemy surowe cloud_cover bezpośrednio z pierwszego dostępnego modelu:
    // ICON-EU, a jeśli go nie ma — ECMWF IFS.
    const rawCloudSource=imgwOffline
      ?(cloudCompare.find(r=>r.model==="icon_eu"&&Number.isFinite(Number(r.data?.current?.cloud_cover)))
        ||cloudCompare.find(r=>r.model==="ecmwf_ifs025"&&Number.isFinite(Number(r.data?.current?.cloud_cover))))
      :null;
    const rawCloudCover=rawCloudSource?Number(rawCloudSource.data.current.cloud_cover):null;
    const offlineEnsemble=imgwOffline?buildOfflineEnsemble(cloudCompare):null;
    if(imgwOffline&&offlineEnsemble){
      data=offlineEnsemble;
      // Przywracamy wyłącznie surowe cloud_cover wybranego modelu.
      if(Number.isFinite(rawCloudCover)){
        data.current=data.current||{};
        data.current.cloud_cover=rawCloudCover;
      }
      S.sourceMode="IMGW_OFFLINE_ENSEMBLE";
      S.ensemble=offlineEnsemble.__auraEnsemble;
    }else{
      S.sourceMode=imgwOffline?"IMGW_OFFLINE_NO_ENSEMBLE":"IMGW_ONLINE";
      S.ensemble=null;
    }
    if(isGpsLocation){
      S.gpsDiag.model=activeModel.id;
      S.gpsDiag.cloud=data?.current?.cloud_cover??null;
      S.gpsDiag.code=data?.current?.weather_code??null;
    }
    // Główne zachmurzenie pozostaje wartością total cloud_cover z aktywnego modelu.
    // Porównanie ICON/ECMWF/GFS jest wyłącznie diagnostyczne i nie nadpisuje głównego kafelka.
    const modelClouds=cloudCompare.map(r=>Number(r.data?.current?.cloud_cover))
      .filter(Number.isFinite).filter(v=>v>=0&&v<=100);
    const raw=Number(data?.current?.cloud_cover);
    if(Number.isFinite(raw)){
      const consensus=consensusCloudCover(cloudCompare);
      const mainCloud=Number.isFinite(consensus)?consensus:raw;
      data.current.cloud_cover=mainCloud;
      S.cloudSource={
        type:Number.isFinite(consensus)?"model-consensus":"open-meteo-current",
        value:mainCloud,
        opticalValue:optiCloudFromModels(cloudCompare)?.value??null,
        opticalLayers:optiCloudFromModels(cloudCompare)?.layers??null,
        opticalModels:optiCloudFromModels(cloudCompare)?.models??[],
        models:modelClouds,
        consensus:Number.isFinite(consensus)?consensus:null,
        layers:{
          low:cloudCompare.map(r=>Number(r.data?.current?.cloud_cover_low)).filter(Number.isFinite),
          mid:cloudCompare.map(r=>Number(r.data?.current?.cloud_cover_mid)).filter(Number.isFinite),
          high:cloudCompare.map(r=>Number(r.data?.current?.cloud_cover_high)).filter(Number.isFinite)
        }
      };
    }
    if(imgwResult.status==="fulfilled"&&imgwResult.value){
      imgwData=imgwResult.value.best||imgwResult.value;
      stationInfo=`${imgwData.stacja||imgwData.name}, ${imgwData.dist} km`;
      // Fuzja stacyjna działa tylko w zasięgu 45 km; świeżość i waga każdego
      // parametru są liczone niezależnie przez Weather Fusion Engine.
      if(data&&data.current&&imgwData.isFresh!==false&&imgwData.dist<=45){
        const imgwTemp=parseFloat(imgwData.temperatura);
        const imgwHum=parseFloat(imgwData.wilgotnosc_wzgledna);
        const imgwWind=parseFloat(imgwData.predkosc_wiatru)*3.6;
        const imgwWindDir=parseFloat(imgwData.kierunek_wiatru);
        const imgwPress=parseFloat(imgwData.cisnienie);
        const modelTemp=data.current.temperature_2m;
        const tempFresh=imgwData.tempFresh===true && Number.isFinite(imgwTemp);
        const humidityFresh=imgwData.humidityFresh===true && Number.isFinite(imgwHum);
        const windFresh=imgwData.windFresh===true && Number.isFinite(imgwWind);
        const windDirFresh=imgwData.windDirFresh===true && Number.isFinite(imgwWindDir);
        const plausible=!tempFresh||!Number.isFinite(modelTemp)||Math.abs(imgwTemp-modelTemp)<=12;

        // Fuzja obserwacji zamiast twardego nadpisania modelu.
        // Waga zależy od świeżości i odległości stacji, a każdy parametr jest niezależny.
        const fusion=applyObservationFusion(data,{
          ...imgwData,
          ageMinutes:imgwData.latestAgeMinutes??imgwData.ageMinutes,
          isFresh:imgwData.isFresh,
          dist:imgwData.dist,
          temperatura:tempFresh?imgwTemp:null,
          wilgotnosc_wzgledna:humidityFresh?imgwHum:null,
          predkosc_wiatru:windFresh?imgwWind/3.6:null,
          kierunek_wiatru:windDirFresh?imgwWindDir:null
        });
        if(tempFresh&&!plausible){
          fusion.weight=0;
          fusion.used=false;
          console.warn("IMGW temp odrzucona:",imgwTemp,"vs model",modelTemp);
        }else if(fusion.used){
          fusion.stationTrendCph=0;
          try{
            const key="aura_imgw_temp_trend_"+(+lat).toFixed(2)+"_"+(+lng).toFixed(2);
            const nowTs=Date.now();
            const arr=JSON.parse(localStorage.getItem(key)||"[]")
              .filter(x=>x&&Number.isFinite(Number(x.ts))&&nowTs-Number(x.ts)<=6*3600000);
            if(Number.isFinite(imgwTemp)){
              const ts=Number(imgwData.observedAt)||nowTs;
              arr.push({ts,temp:imgwTemp});
            }
            const clean=arr.filter(x=>Number.isFinite(Number(x.temp))).sort((a,b)=>a.ts-b.ts).slice(-12);
            localStorage.setItem(key,JSON.stringify(clean));
            if(clean.length>=2){
              const first=clean[0],last=clean[clean.length-1];
              const dt=(Number(last.ts)-Number(first.ts))/3600000;
              if(dt>0){
                // Trend obserwacyjny ma ograniczenie, żeby pojedynczy błędny
                // odczyt nie wywrócił profilu 6-godzinnego.
                fusion.stationTrendCph=clamp((Number(last.temp)-Number(first.temp))/dt,-1.5,1.5);
              }
            }
          }catch{}
          const bridgeSource=cloudCompare.find(r=>r.model==="icon_eu")?.data
            ||cloudCompare.find(r=>r.model==="icon_eu")?.data
            ||cloudCompare.find(r=>r.model==="ecmwf_ifs025")?.data
            ||data;
          applyForecastBridge(data,fusion,bridgeSource);

          // DATA PIPELINE INSPECTOR
          const diagCi=currentHourIndex(data,new Date());
          const diagCurrentPrecip=Number(data.hourly?.precipitation?.[diagCi]);
          const diagCurrentCode=Number(data.hourly?.weather_code?.[diagCi]);
          const stationPrecip10=Number(imgwData.opad_10min);
          const stationPrecipAge=Number(imgwData.opad10minAgeMinutes);
          const stationPrecipFresh=imgwData.opad10minFresh===true;
          const ghostPrecipitation=
            Number(imgwData.dist)<=5 &&
            stationPrecipFresh &&
            Number.isFinite(stationPrecip10) &&
            stationPrecip10<=0 &&
            ((Number.isFinite(diagCurrentPrecip)&&diagCurrentPrecip>0) || isRainCode(diagCurrentCode));
          const precipitationModelWeight=ghostPrecipitation?0.25:1;
          const diagRows=[];
          for(let step=0;step<=3;step++){
            const idx=diagCi+step;
            if(idx>=data.hourly.time.length)break;
            const iso=data.hourly.time[idx];
            const si=findHourIndexByTime(bridgeSource?.hourly?.time||[],iso);
            const srcIdx=si>=0?si:Math.min(idx,(bridgeSource?.hourly?.time?.length||1)-1);
            const modelT=toFiniteNumber(bridgeSource?.hourly?.temperature_2m?.[srcIdx]);
            const prevIdx=step>0?findHourIndexByTime(bridgeSource?.hourly?.time||[],data.hourly.time[idx-1]):-1;
            const prevT=prevIdx>=0?toFiniteNumber(bridgeSource?.hourly?.temperature_2m?.[prevIdx]):null;
            const precip=Number(bridgeSource?.hourly?.precipitation?.[srcIdx]);
            diagRows.push({
              step,time:iso,
              imgwStation:step===0&&Number.isFinite(imgwTemp)?imgwTemp:null,
              imgwModel:null,
              rawModel:modelT,
              auraFinal:toFiniteNumber(data.hourly.temperature_2m?.[idx]),
              tempWeight:step===0?fusion.weights?.temperature??0:bridgeAlpha(step,fusion.weights?.temperature??0),
              humidityWeight:step===0?fusion.weights?.humidity??0:bridgeAlpha(Math.min(step,3),fusion.weights?.humidity??0),
              windWeight:step===0?fusion.weights?.wind??0:bridgeAlpha(Math.min(step,3),fusion.weights?.wind??0),
              precipitation:Number.isFinite(precip)?precip:null,
              precipitationModelWeight:step===0?precipitationModelWeight:1,
              modelTempDrop:step>0&&prevT!==null&&modelT!==null?prevT-modelT:null,
              sourceModel:bridgeSource?.model||activeModel.id,
              dynamicFront:step>0&&Number.isFinite(precip)&&precip>1.5&&prevT!==null&&modelT!==null&&prevT-modelT>=3
            });
          }
          const ghostVisibilityDrop=
            stationHasFreshNoPrecip(imgwData) &&
            !stationFogObserved(imgwData) &&
            Number.isFinite(Number(data.current?.visibility)) &&
            Number(data.current.visibility)<=8000;
          const nullFlags=[];
          const nullCheck=(label,value)=>{if(value===null||value===undefined||value==="")nullFlags.push(label);};
          ["temperature_2m","relative_humidity_2m","wind_speed_10m","wind_direction_10m","weather_code"].forEach(k=>{
            nullCheck("current."+k,data.current?.[k]);
            nullCheck("hourly."+k+"[ci]",data.hourly?.[k]?.[diagCi]);
          });
          S.pipelineDiag={
            capturedAt:Date.now(),
            uiCurrentHour:diagCi,
            fusionCurrentHour:currentHourIndex(data,new Date()),
            station:imgwData.stacja||imgwData.name||"IMGW",
            stationAgeMinutes:imgwData.latestAgeMinutes??imgwData.ageMinutes??null,
            stationDistanceKm:imgwData.dist??null,
            imgwForecastAvailable:false,
            imgwForecastNote:"Brak strukturalnego feedu godzinowej prognozy IMGW Hybrid w aktualnym źródle aplikacji; produkt IMGW Hybrid/INCA/MERGE nie jest jeszcze zintegrowany jako API wartości punktowych.",
            rows:diagRows,
            nullFlags,
            weights:fusion.weights||{},
            fusionBias:fusion.bias||{},
            bridgeSource:bridgeSource?.model||activeModel.id,
            bridgeSourceLabel:"RAW model used for forecast bridge; not a multi-model consensus",
            dynamicFrontDetected:diagRows.some(r=>r.dynamicFront),
            stationPrecip10min:Number.isFinite(stationPrecip10)?stationPrecip10:null,
            stationPrecipAgeMinutes:Number.isFinite(stationPrecipAge)?stationPrecipAge:null,
            stationPrecipFresh,
            modelCurrentPrecipitation:Number.isFinite(diagCurrentPrecip)?diagCurrentPrecip:null,
            modelCurrentWeatherCode:Number.isFinite(diagCurrentCode)?diagCurrentCode:null,
            ghostPrecipitation,
            precipitationModelWeight,
            ghostVisibilityDrop,
            stationVisibilityGuard:data.__stationVisibilityGuard||null
          };
          runLiveDataQualityGuard();

          S.fusion={
            source:"IMGW",
            station:imgwData.stacja||imgwData.name||null,
            distanceKm:imgwData.dist??null,
            ageMinutes:imgwData.latestAgeMinutes??imgwData.ageMinutes??null,
            weight:+fusion.weight.toFixed(3),
            bias:fusion.bias,
            mode:"observation-to-forecast bridge"
          };
        }

        // Odczuwalna liczona po fuzji, bez gwałtownego przeskoku.
        if(fusion.used&&Number.isFinite(data.current.temperature_2m)){
          const t=Number(data.current.temperature_2m);
          const rh=Number(data.current.relative_humidity_2m);
          const windMs=Math.max(0,Number(data.current.wind_speed_10m||0)/3.6);
          if(Number.isFinite(rh)){
            const previousWind=S.X?.wind;
            S.X=S.X||{};
            S.X.wind=windMs*3.6;
            const newFeels=discomfortIndex(t,rh).value;
            if(Number.isFinite(previousWind))S.X.wind=previousWind;
            data.current.apparent_temperature=Number.isFinite(newFeels)?Math.round(newFeels*10)/10:t;
          }else{
            data.current.apparent_temperature=t;
          }
          if(Number.isFinite(rh)&&rh>0&&rh<=100){
            const stationDew=dewPoint(t,rh);
            if(stationDew!=null&&Number.isFinite(stationDew))imgwData.dewPointStation=Math.round(stationDew*10)/10;
          }
        }

        // Głodowo nie dostarcza ciśnienia w tym feedzie — pozostawiamy ciśnienie modelowe.
      }
    }else stationInfo=`Open-Meteo, ${(+lat).toFixed(3)}°N, ${(+lng).toFixed(3)}°E`;
  }catch(e){
    // PRODUKCJA: awaria IMGW/Open-Meteo nie może zmienić LIVE sesji w Demo.
    // Mock jest dostępny wyłącznie przez jawny tryb demo, nigdy jako fallback
    // po błędzie sieciowym podczas normalnego pobierania pogody.
    console.error("[AURA LIVE FETCH FAILED]",e?.message||e);
    isDemo=false;
    imgwData=null;
    stationInfo="Brak danych live";
    data=null;
    throw e;
  }finally{
    WEATHER_FORCE_REFRESH=false;
  }

  // IMGW Offline musi pozostawić diagnostykę żywą nawet wtedy, gdy nie ma
  // żadnej obserwacji stacyjnej do fuzji.
  if(S.sourceMode==="IMGW_OFFLINE_ENSEMBLE"){
    const ci=currentHourIndex(data,new Date());
    const rows=[];
    for(let step=0;step<=3;step++){
      const idx=ci+step;
      if(idx>=data.hourly.time.length)break;
      rows.push({
        step,
        time:data.hourly.time[idx],
        imgwStation:null,
        imgwModel:null,
        openMeteo:toFiniteNumber(data.hourly.temperature_2m?.[idx]),
        auraFinal:toFiniteNumber(data.hourly.temperature_2m?.[idx]),
        tempWeight:0,
        humidityWeight:0,
        windWeight:0,
        precipitation:toFiniteNumber(data.hourly.precipitation?.[idx]),
        precipitationModelWeight:1,
        modelTempDrop:step>0?toFiniteNumber(data.hourly.temperature_2m?.[idx-1])-toFiniteNumber(data.hourly.temperature_2m?.[idx]):null,
        sourceModel:"ensemble",
        dynamicFront:false
      });
    }
    const activeEnsembleModels=S.ensemble?.models||[];
    const modelNames=activeEnsembleModels.map(m=>m==="icon_eu"?"ICON-EU":m==="ecmwf_ifs025"?"ECMWF IFS":m==="gfs_seamless"?"GFS":m);
    S.pipelineDiag={
      capturedAt:Date.now(),
      uiCurrentHour:ci,
      fusionCurrentHour:ci,
      station:"IMGW Offline",
      stationAgeMinutes:null,
      stationDistanceKm:null,
      imgwForecastAvailable:false,
      imgwForecastNote:"IMGW Offline → Active Ensemble: "+modelNames.join(" + "),
      status:"IMGW Offline → Active Ensemble",
      sourceMode:"IMGW_OFFLINE_ENSEMBLE",
      imgwStatus:"OFFLINE",
      activeEnsemble:modelNames,
      ensembleCloudConsensus:Number.isFinite(Number(S.ensemble?.cloudCoverConsensus))?S.ensemble.cloudCoverConsensus:null,
      rows,
      nullFlags:[],
      weights:{temperature:0,humidity:0,wind:0,windDirection:0},
      fusionBias:{},
      bridgeSource:"ensemble",
      dynamicFrontDetected:false,
      stationPrecip10min:null,
      stationPrecipAgeMinutes:null,
      stationPrecipFresh:false,
      modelCurrentPrecipitation:toFiniteNumber(data.current?.precipitation),
      modelCurrentWeatherCode:toFiniteNumber(data.current?.weather_code),
      ghostPrecipitation:false,
      precipitationModelWeight:1,
      ghostVisibilityDrop:false,
      stationVisibilityGuard:null
    };
    runLiveDataQualityGuard();
  }

  // ─────────────────────────────────────────────────────────────
  // DATA PIPELINE SANITIZERS — po fuzji, przed cache/render/diagnostyką.
  // Świeża obserwacja Głodowa ma priorytet nad modelem dla T0 opadu.
  const stationPrecipNow=stationFreshPrecipMm(imgwData);
  if(stationPrecipNow!==null&&data.current){
    const cc=Number(data.current.cloud_cover);
    if(stationPrecipNow>0){
      const rainCode=61;
      data.current.weather_code=rainCode;
      data.current.precipitation=stationPrecipNow;
      data.current.rain=stationPrecipNow;
      data.current.showers=0;
      data.current.snowfall=0;
      const ci=currentHourIndex(data,new Date());
      if(data.hourly?.time?.[ci]!=null){
        data.hourly.precipitation[ci]=stationPrecipNow;
        data.hourly.weather_code[ci]=rainCode;
      }
    }else{
      const dryCode=Number.isFinite(cc)
        ?(cc<=10?0:cc<=40?2:3)
        :0;
      data.current.weather_code=dryCode;
      data.current.precipitation=0;
      data.current.rain=0;
      data.current.showers=0;
      data.current.snowfall=0;
    }
  }
  syncDailyExtremes(data);
  sanitizeVisibility(data,imgwData);

  try{localStorage.setItem("aura_v6",JSON.stringify({data,city,lat,lng,ts:Date.now()}));}catch{}
  saveHistory(city,lat,lng);
  if(data&&data.current)checkForecastAccuracy(data.current.temperature_2m,data.current.weather_code);
  if(data&&data.hourly&&!isDemo){
    // Historia prognozy musi odnosić się do AKTUALNEJ godziny, nie do 03:00.
    // Dzięki temu zapisujemy rzeczywiste T+3 i możemy później mierzyć ciągłość bridge'a.
    const ci=currentHourIndex(data);
    const fi=Math.min(ci+3,data.hourly.time.length-1);
    if(data.hourly.temperature_2m?.[fi]!=null){
      saveForecastHistory(lat,lng,city,data.hourly.temperature_2m[fi],data.hourly.weather_code?.[fi]??0);
    }
  }

  if(cloudCompare.length>=2){
    const now=new Date();
    const pfx2=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}`;
    const ok=cloudCompare.map(r=>{
      const idx=r.data?.hourly?.time?.findIndex(t=>t.startsWith(pfx2))??-1;
      const t=idx>=0?r.data.hourly.temperature_2m[idx]:r.data?.current?.temperature_2m;
      return {t,r};
    }).filter(x=>Number.isFinite(x.t));
    if(ok.length>=2){
      confidenceNow=calcModelAgreement(ok.map(x=>x.t));
      modelCompareNow=ok.map(x=>({model:x.r.model,name:x.r.model,temp:Math.round(x.t*10)/10,cloud:x.r.data?.current?.cloud_cover??null,code:x.r.data?.current?.weather_code??null}));
    }
  }

  S.lastUpdate=Date.now();
  Object.assign(S,{phase:"weather",lat,lng,city,data,isDemo,loading:false,refreshing:false,stationInfo,imgwData,modelCompare:modelCompareNow,modelCompareNow:modelCompareNow,modelCompareRaw:cloudCompare,confidence:confidenceNow,fusion:S.fusion||null,minutely:null,air:null,expDay:null,enter:!isRef});
  render();

  if(isDemo)return;
  // Dane dochodzące w tle — aktualizują tylko swoje sekcje
  const same=()=>S.lat===lat&&S.lng===lng;
  apiMinutely(lat,lng).then(m=>{
    if(same()){
      S.minutely=m;
      // Widoczność: preferujemy bieżący 15-min slot modelu wysokiej rozdzielczości
      // dla Europy Środkowej zamiast godzinowej wartości Best Match.
      const nowMs=Date.now();
      const slot=Array.isArray(m)?m.find(x=>{
        const t=new Date(x.t).getTime();
        return Number.isFinite(t)&&t<=nowMs&&nowMs<t+15*60000;
      }):null;
      // Nie nadpisujemy bieżącej widoczności 15-minutowym modelem.
      // Kafelek korzysta z wartości visibility z głównego zapytania Best Match,
      // aby nie mieszać dwóch różnych siatek/modeli w jednym "teraz".
      softUpdate();
    }
  });
  apiAir(lat,lng).then(a=>{if(same()){S.air=a;softUpdate();}});
}

// ═══════════════════════════════════════════════
// v6 — wyszukiwanie (aktualizuje tylko listę, pole nie traci tekstu)
// ═══════════════════════════════════════════════
function updateResults(){
  const d=$("#results");
  if(d)d.innerHTML=searchRes.map((r,i)=>`<button class="ddi" data-act="pick" data-i="${i}">${mini("pin")}<span>${esc(r.n)}</span></button>`).join("");
  const n=$("#neterr");if(n)n.hidden=!netErr;
}
function handleSearch(val){
  clearTimeout(searchTimer);
  if(val.trim().length<2){searchRes=[];updateResults();return;}
  searchTimer=setTimeout(async()=>{
    const r=await apiSearch(val);
    netErr=!r;searchRes=r||[];updateResults();
  },380);
}

// ═══════════════════════════════════════════════
// v6 — render i zdarzenia
// ═══════════════════════════════════════════════
function render(){
  if(RV.node&&RV.node.parentNode)RV.node.remove();
  const app=$("#app"),y=window.scrollY;
  if(S.phase!=="weather"&&RAF){cancelAnimationFrame(RAF);RAF=null;}
  if(S.phase==="intro"){
    app.innerHTML=introHTML();applySky(null);$("#amb").innerHTML="";S.ambKey="";
    if(searchRes.length)updateResults();
  }else if(S.phase==="loading"){
    app.innerHTML=skeletonHTML();
  }else if(S.phase==="error"){
    app.innerHTML=loadErrorHTML();
  }else if(S.phase==="weather"&&S.data){
    try{app.innerHTML=weatherHTML();}
    catch(err){
      console.error("weatherHTML:",err);
      app.innerHTML=`<div class="intro"><div class="err">Nie udało się wyświetlić danych. Wybierz miejsce jeszcze raz.</div><button class="btn pri wide" data-act="back">Wybierz miejsce</button></div>`;
      try{localStorage.removeItem("aura_v6");}catch{}
    }
    S.enter=false;
    const slot=$("#radar-slot");
    if(RV.node&&slot){slot.replaceWith(RV.node);if(RV.map)setTimeout(()=>RV.map.invalidateSize(),60);}
    const t=$("#top");if(t)t.classList.toggle("solid",window.scrollY>150);
  }
  window.scrollTo(0,S.phase==="weather"?y:0);
}

function toggleDay(i){
  S.expDay=S.expDay===i?null:i;
  const d=$("#daily");if(d)d.innerHTML=dailyRows();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(a==="close"){if(e.target===t||t.classList.contains("x")||e.target.closest(".x"))closeSheet();return;}
  switch(a){
    case"gps":handleGPS();break;
    case"pick":{const r=searchRes[+t.dataset.i];if(r){searchRes=[];loadW(r.lat,r.lng,r.n);}break;}
    case"quick":{const p=POPULAR[+t.dataset.i];if(p)loadW(p.lat,p.lng,p.n);break;}
    case"hist":{const h=getHistory()[+t.dataset.i];if(h)loadW(h.lat,h.lng,h.n);break;}
    case"back":searchRes=[];Object.assign(S,{phase:"intro",loading:false});render();break;
    case"retry":{const r=S.loadError;if(r&&r.lat!=null)loadW(r.lat,r.lng,r.name||null,false);break;}
    case"refresh":if(S.lat!=null)loadW(S.lat,S.lng,S.city,true);break;
    case"day":toggleDay(+t.dataset.i);break;
    case"model":openModelSheet();break;
    case"pickmodel":{
      const m=WEATHER_MODELS.find(x=>x.id===t.dataset.id);
      closeSheet();
      if(m&&m.id!==activeModel.id){activeModel=m;if(S.lat!=null)loadW(S.lat,S.lng,S.city,true);}
      break;
    }
    case"raw":openRawSheet();break;
    case"pipeline":openPipelineInspector();break;
    case"pipeline-refresh":if(S.lat!=null){closeSheet();loadW(S.lat,S.lng,S.city,true);}break;
    case"copy-pipeline":{if(navigator.clipboard)navigator.clipboard.writeText(pipelineDiagnosticsText()).catch(()=>{});break;}
    case"copy":{const el=$("#rawtxt");if(el&&navigator.clipboard)navigator.clipboard.writeText(el.textContent).then(()=>{t.lastChild.textContent="Skopiowano";}).catch(()=>{});break;}
    case"radar":startRadar();break;
    case"rplay":toggleRadarPlay();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q")handleSearch(e.target.value);
  else if(e.target.id==="rslider"){if(RV.timer)toggleRadarPlay();radarShow(+e.target.value);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
window.addEventListener("scroll",()=>{const t=$("#top");if(t)t.classList.toggle("solid",window.scrollY>150);},{passive:true});
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&S.phase==="weather"&&S.lastUpdate&&Date.now()-S.lastUpdate>20*60000&&S.lat!=null)loadW(S.lat,S.lng,S.city,true);
});

(function init(){
  try{
    ["aura","aura_v2","aura_v3","aura_v4","aura_v5"].forEach(k=>{try{localStorage.removeItem(k);}catch{}});
    const c=localStorage.getItem("aura_v6");
    if(c){
      const d=JSON.parse(c);
      if(d&&d.data&&d.city&&d.data.current&&d.data.hourly&&d.data.daily&&(Date.now()-d.ts)<7200000){
        Object.assign(S,{phase:"weather",lat:d.lat,lng:d.lng,city:d.city,data:d.data,isDemo:false,lastUpdate:d.ts,stationInfo:null});
      }
    }
  }catch(e){console.warn("Cache err:",e);}
  render();
  // po odtworzeniu z cache od razu odświeżamy w tle
  if(S.phase==="weather"&&S.lat!=null)loadW(S.lat,S.lng,S.city,true);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.onupdatefound = () => {
        const installingWorker = reg.installing;
        if (!installingWorker) return;
        installingWorker.onstatechange = () => {
          if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        };
      };
    }).catch(err => console.error('SW Registration Error:', err));
  }
})();

</script>
</body>
</html>
