<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1430"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Aura Pogoda"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<title>Aura Pogoda</title>
<style>
@property --st{syntax:'<color>';inherits:true;initial-value:#0b1430}
@property --sb{syntax:'<color>';inherits:true;initial-value:#1b2a55}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#F6F9FD;--ink2:rgba(246,249,253,.76);--ink3:rgba(246,249,253,.54);
  --glass:rgba(8,15,32,.36);--glass2:rgba(8,15,32,.55);--line:rgba(255,255,255,.13);
  --sun:#FFC857;--rain:#8ADBFF;--ok:#63E6A4;--warn:#FFB454;--bad:#FF7B7B;
  --st:#0b1430;--sb:#1b2a55;
  transition:--st 1.6s ease,--sb 1.6s ease;
}
html{background:#0b1430}
body{overflow-x:clip;min-height:100dvh;font-family:Figtree,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.35;font-size:15px}
button,input{font:inherit;color:inherit;border:0;outline:0;background:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
svg{display:block}
.tn{font-variant-numeric:tabular-nums}

#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--st) 0%,var(--sb) 100%)}
#amb{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#app{position:relative;z-index:2;width:100%;max-width:520px;margin:0 auto;min-height:100dvh;padding:0 14px calc(40px + env(safe-area-inset-bottom))}

/* ambient */
@keyframes rainDrop{0%{transform:translateY(-60px);opacity:0}15%{opacity:.6}85%{opacity:.6}100%{transform:translateY(110vh);opacity:0}}
@keyframes snowFall{0%{transform:translateY(-10px) translateX(0);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateY(110vh) translateX(35px);opacity:0}}
@keyframes cloudDrift{from{transform:translateX(-280px)}to{transform:translateX(110vw)}}
@keyframes starBlink{0%,100%{opacity:.08}50%{opacity:.85}}
@keyframes lightFlash{0%,87%,100%{opacity:0}89%,95%{opacity:1}91%,97%{opacity:0}}
.rdrop{position:absolute;width:1px;background:linear-gradient(180deg,rgba(190,225,255,.55),transparent);animation:rainDrop linear infinite}
.sflake{position:absolute;background:rgba(255,255,255,.85);border-radius:50%;animation:snowFall ease-in-out infinite}
.cldp{position:absolute;background:radial-gradient(circle,rgba(255,255,255,.10),transparent);border-radius:50%;animation:cloudDrift linear infinite}
.starp{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:starBlink ease-in-out infinite}
.lflash{position:fixed;inset:0;background:rgba(255,255,255,.05);pointer-events:none;z-index:1;animation:lightFlash 10s ease-in-out infinite}

/* the one orchestrated moment: hero settles in when data arrives */
@keyframes settle{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.enter .hero-temp,.enter .hero-ico{animation:settle .9s cubic-bezier(.2,.7,.2,1) both}
.enter .hero-ico{animation-delay:.12s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 2px 10px;margin:0 -2px}
.top::before{content:"";position:absolute;inset:0 -12px;background:linear-gradient(180deg,var(--st),transparent);opacity:0;transition:opacity .25s;pointer-events:none;-webkit-mask:linear-gradient(#000 60%,transparent);mask:linear-gradient(#000 60%,transparent)}
.top.solid::before{opacity:.94}
.top>*{position:relative}
.place{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;flex:none;max-width:52%}
.place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place svg{width:16px;height:16px;flex:none;opacity:.8}
.top-t{display:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink2)}
.top.solid .top-t{display:block}
.grow{flex:1}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.ib svg{width:19px;height:19px}
.ib:active{background:var(--glass2)}
.ib.busy svg{animation:spin .8s linear infinite}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 2px 0}
.hero-temp{font-size:112px;font-weight:300;line-height:.95;letter-spacing:-5px;margin-left:-4px}
.hero-temp sup{font-size:44px;font-weight:300;letter-spacing:0;vertical-align:top;position:relative;top:10px;margin-left:2px;color:var(--ink2)}
.hero-ico{padding-bottom:10px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.28))}
.cond{font-size:22px;font-weight:500;margin:6px 2px 2px}
.subline{color:var(--ink2);font-size:14px;margin:0 2px 2px;display:flex;flex-wrap:wrap;gap:4px 14px}
.subline b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 2px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip svg{width:13px;height:13px}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.link{color:var(--ink)}
button.chip:active{background:var(--glass2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease infinite}
.sunline{margin:14px 2px 18px}
.sunline svg{width:100%;height:auto;overflow:visible}
.sunline .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:2px}

/* cards */
.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:16px 16px 14px;margin:0 0 12px;backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--ink2);font-size:13.5px;font-weight:600}
.ch svg{width:16px;height:16px;flex:none}
.ch .grow{flex:1}
.ch .chip{padding:3px 9px;font-size:12px}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-weight:600;font-size:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sun);color:#1c1400;border-color:transparent}
.btn.wide{width:100%;padding:15px 18px;font-size:15.5px}
.btn svg{width:18px;height:18px}
a.btn{text-decoration:none;color:inherit}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:18px;margin-bottom:8px;background:var(--glass2);border:1px solid var(--line);border-left:4px solid var(--warn);font-size:13.5px;line-height:1.4}
.alert.bad{border-left-color:var(--bad)}.alert.info{border-left-color:var(--rain)}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}

/* nowcast */
.nc-sum{font-size:17px;font-weight:600;margin-bottom:12px;line-height:1.3}
.nc-bars{display:flex;align-items:flex-end;gap:5px;height:56px}
.nc-bars i{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#B7E8FF,#4FB6F0);min-height:3px}
.nc-bars i.z{background:rgba(255,255,255,.16)}
.nc-ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:6px}

/* hourly */
.hstrip{display:flex;overflow-x:auto;gap:0;margin:0 -8px;padding:0 4px 2px;scroll-snap-type:x proximity}
.hi{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:18px;scroll-snap-align:start;font-size:14px}
.hi.now{background:rgba(255,255,255,.12)}
.hi .t{font-size:12.5px;color:var(--ink2);font-weight:500}
.hi .v{font-weight:600;font-size:16px}
.hi .p{font-size:11.5px;color:var(--rain);font-weight:600;height:14px}
.hi.sun .t{color:var(--sun)}

/* meteogram */
.mg{overflow-x:auto;margin:0 -8px;padding:0 4px}
.mg svg{height:auto}
.mg text{fill:var(--ink2);font-family:inherit;font-size:11px}

/* daily */
.drow{width:100%;display:grid;grid-template-columns:62px 40px 34px 1fr 34px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);text-align:left;font-size:15px}
.drow:first-of-type{border-top:0}
.dname{font-weight:600}
.dic{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;height:38px;justify-content:center}
.dic i{font-style:normal;font-size:11px;font-weight:600;color:var(--rain);height:12px;line-height:12px}
.dmin{color:var(--ink2);text-align:right}
.dmax{text-align:right;font-weight:600}
.dbar{position:relative;height:5px;border-radius:5px;background:rgba(255,255,255,.16)}
.dbar b{position:absolute;top:0;bottom:0;border-radius:5px}
.dbar u{position:absolute;top:-2.5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px rgba(8,15,32,.55)}
.dexp{padding:6px 0 12px;animation:settle .35s ease both}
.dexp .kv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dexp .hstrip{margin:0 -6px}

/* widgets */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.w{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px;backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);display:flex;flex-direction:column;min-height:158px}
.w.full{grid-column:1/-1;min-height:0}
.wh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.wh svg{width:15px;height:15px}
.wv{font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.5px}
.wv small{font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:3px}
.ws{font-size:12.5px;color:var(--ink2);margin-top:auto;padding-top:8px;line-height:1.4}
.uvbar{position:relative;height:6px;border-radius:6px;margin:10px 0 2px;background:linear-gradient(90deg,#5BD98C 0%,#F3D64A 32%,#F59B3B 55%,#EE5A4B 78%,#9B5DE5 100%)}
.uvbar u{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(8,15,32,.55)}
.cmp{width:104px;height:104px;margin:0 auto}
.cmp text{fill:var(--ink2);font-family:inherit}
.gauge{width:118px;margin:0 auto -4px}
.layer{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.layer div{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.layer b{display:block;height:100%;background:linear-gradient(90deg,#DCE7F5,#fff);border-radius:6px}
.layer span:last-child{text-align:right}
.aq-bar{display:flex;gap:3px;margin:12px 0 4px}
.aq-bar i{flex:1;height:6px;border-radius:4px;opacity:.28}
.aq-bar i.on{opacity:1}
.kvs{display:flex;flex-wrap:wrap;gap:6px}

/* comparison rows */
.mrow{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-of-type{border-top:0}
.mtrack{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.16)}
.mtrack u{position:absolute;top:-4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px rgba(8,15,32,.55)}
.mrow b{text-align:right;font-weight:600}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;border-radius:8px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stg div{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px}
.stg small{display:block;color:var(--ink3);font-size:12px;margin-bottom:2px}
.stg b{font-size:18px;font-weight:600}

/* assistant */
.say{font-size:16.5px;line-height:1.45;font-weight:500;margin-bottom:12px}
.arow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.arow small{display:block;color:var(--ink3);font-size:12px}

/* radar */
.radar-ph{display:grid;place-items:center;gap:12px;text-align:center;padding:28px 12px;border-radius:20px;background:rgba(0,0,0,.18);color:var(--ink2);font-size:14px}
.rmap{height:290px;border-radius:20px;overflow:hidden;background:#101826}
.rctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.rctl input[type=range]{flex:1;accent-color:var(--sun)}
.rctl .ib{width:38px;height:38px;border-radius:50%}
.leaflet-container{background:#101826;font-family:inherit}
.leaflet-control-attribution{background:rgba(8,15,32,.6)!important;color:var(--ink3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
/* simulated fallback radar */
.rsec{margin:0}
.rwrap{position:relative;border-radius:20px;overflow:hidden;background:#020817;border:1px solid var(--line);aspect-ratio:16/10}
#rc{width:100%;height:100%;display:block}
.rbadge{position:absolute;top:10px;left:10px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:6px}
.rtime{position:absolute;bottom:10px;left:10px;padding:4px 10px;background:rgba(0,0,0,.7);border-radius:8px;font-size:11px;font-weight:600;color:#fff}
.rzoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.rzoom button{width:30px;height:30px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;font-size:15px}
.rleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11.5px;color:var(--ink2)}

/* intro */
.intro{min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(40px + env(safe-area-inset-top)) 2px 8px;gap:0}
.intro h1{font-size:40px;font-weight:300;letter-spacing:-1.5px;line-height:1.02;margin-bottom:8px}
.intro h1 b{font-weight:600}
.intro p.lead{color:var(--ink2);font-size:16px;margin-bottom:26px;max-width:30ch}
.field{position:relative;margin:14px 0 6px}
.field input{width:100%;padding:16px 46px 16px 18px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);font-size:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.field input::placeholder{color:var(--ink3)}
.field svg{position:absolute;right:16px;top:50%;margin-top:-9px;width:18px;height:18px;opacity:.6}
.ddi{display:flex;width:100%;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;text-align:left;color:var(--ink);font-size:15px}
.ddi:active,.ddi:hover{background:rgba(255,255,255,.1)}
.ddi svg{width:16px;height:16px;opacity:.7;flex:none}
#results{display:flex;flex-direction:column;margin:0 -4px}
.sub{margin:22px 2px 8px;color:var(--ink3);font-size:13px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 15px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:500;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill:active{background:var(--glass2)}
.err{padding:12px 14px;border-radius:16px;background:rgba(255,123,123,.16);border:1px solid rgba(255,123,123,.35);font-size:14px;margin-bottom:10px}
.err.warn{background:rgba(255,180,84,.15);border-color:rgba(255,180,84,.35)}

/* skeleton */
.sk{border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.06) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:100;background:rgba(3,7,18,.6);display:flex;align-items:flex-end;justify-content:center;animation:settle .2s ease both}
.sheet{width:100%;max-width:520px;max-height:86dvh;overflow:auto;background:rgba(14,22,42,.96);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));backdrop-filter:blur(24px)}
.sheet h3{font-size:18px;font-weight:600;margin-bottom:4px}
.sheet .sd{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.mi{display:flex;width:100%;align-items:center;gap:12px;padding:12px;border-radius:16px;text-align:left;border:1px solid transparent}
.mi:active{background:rgba(255,255,255,.08)}
.mi.on{background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.4)}
.mi b{display:block;font-weight:600;font-size:15px}
.mi small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.mi .fl{font-size:22px;width:30px;text-align:center}
.raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;background:rgba(0,0,0,.35);border-radius:14px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:46dvh;overflow:auto;color:#cfe0f5}
.foot{text-align:center;color:var(--ink3);font-size:12px;line-height:1.6;padding:14px 8px 0}
.foot a{color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gSun" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFE9A0"/><stop offset="1" stop-color="#FFB627"/></radialGradient>
<linearGradient id="gCloud" x1="0" y1="14" x2="0" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C6D4E6"/></linearGradient>
<linearGradient id="gCloudD" x1="0" y1="14" x2="0" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B4BFCE"/><stop offset="1" stop-color="#7A879B"/></linearGradient>
<linearGradient id="gMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#D5DCF0"/></linearGradient>
<mask id="mMoon" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><circle cx="28" cy="16" r="9.5" fill="#000"/></mask>
</defs></svg>
<div id="sky"></div>
<div id="amb"></div>
<div id="app"></div>
<div id="sheet-root"></div>
<script>
'use strict';

const POPULAR=[
  {n:"Tomaszewo",lat:52.80254,lng:19.20505},
  {n:"Lipno",lat:52.84207,lng:19.18316},
  {n:"Toruń",lat:53.01375,lng:18.59814},
  {n:"Warszawa",lat:52.2297,lng:21.0122},
  {n:"Gdańsk",lat:54.352,lng:18.6466},
  {n:"Kraków",lat:50.0647,lng:19.945},
  {n:"Wrocław",lat:51.1079,lng:17.0385},
];

function wMeta(code,isDay){
  isDay=isDay!==false;
  if(code===0)return{e:isDay?"☀️":"🌙",t:"Bezchmurnie"};
  if(code<=2)return{e:"🌤️",t:"Częściowe zachmurzenie"};
  if(code===3)return{e:"☁️",t:"Zachmurzenie"};
  if(code<=48)return{e:"🌫️",t:"Mgła"};
  if(code<=55)return{e:"🌦️",t:"Mżawka"};

// Temperatura na słońcu i w cieniu
// Na podstawie promieniowania słonecznego, wiatru i wilgotności
function calcSunShadeTemp(tempC, radiation, windKmh, humidity){
  // Temperatura w cieniu = apparent_temperature (juz mamy)
  // Temperatura na słońcu = temp + efekt promieniowania
  // Wzór oparty na WBGT (Wet Bulb Globe Temperature) uproszczony
  
  const windMs = windKmh / 3.6;
  
  // Efekt promieniowania na człowieka (W/m²) -> °C
  // Przy 800 W/m² ciało pochłania ok 6-8°C więcej
  const radiationEffect = radiation > 0 
    ? Math.min(12, (radiation / 1000) * 10 * (1 - humidity/200))
    : 0;
  
  // Korekta wiatru - wiatr chłodzi
  const windCool = windMs > 0.5 ? Math.min(3, windMs * 0.5) : 0;
  
  const sunTemp = Math.round((tempC + radiationEffect - windCool) * 10) / 10;
  const shadeTemp = Math.round(tempC * 10) / 10;
  
  return { sun: sunTemp, shade: shadeTemp };
}


// Nowcast - krotkoterminowa prognoza opadow na najblizsze 3h
// bazujaca na trendzie prawdopodobienstwa opadow z modelu
function buildNowcast(hourly,ci){
  const points=[];
  for(let i=0;i<4;i++){
    const idx=ci+i;
    if(idx>=hourly.time.length)break;
    points.push({
      h:i,
      pop:hourly.precipitation_probability?.[idx]??0,
      precip:+(hourly.precipitation?.[idx]??0),
      code:hourly.weather_code?.[idx]??0
    });
  }
  if(points.length===0)return null;

  const now=points[0];
  const soon=points.slice(1);
  const willRainSoon = soon.some(p=>p.pop>=50||p.precip>0.1);
  const rainingNow = now.pop>=50||now.precip>0.1;
  const trend = soon.length>0 ? (soon[soon.length-1].pop - now.pop) : 0;

  let text, emoji, tone;
  if(rainingNow && trend<-15){
    text="Opady ustępują w ciągu najbliższej godziny";emoji="🌦️";tone="ok";
  } else if(rainingNow){
    text="Opady utrzymają się przez najbliższe godziny";emoji="🌧️";tone="warn";
  } else if(willRainSoon){
    const firstIdx=soon.findIndex(p=>p.pop>=50||p.precip>0.1);
    const inH=firstIdx>=0?firstIdx+1:1;
    text=`Możliwe opady za ok. ${inH}h`;emoji="🌂";tone="warn";
  } else {
    text="Brak opadów w najbliższych godzinach";emoji="🟢";tone="ok";
  }
  return{text,emoji,tone};
}

// POPRAWIONY indeks dyskomfortu
function discomfortIndex(temp,hum){
  let hi;
  if(temp<27){
    // Uproszczona formuła dla niskich temperatur
    hi=temp-(0.55-0.0055*hum)*(temp-14.5);
  } else {
    // Steadman dla wysokich temperatur
    hi=-8.784695+1.61139411*temp+2.3385248*hum
       -0.14611605*temp*hum-0.012308094*temp*temp
       -0.016424828*hum*hum+0.002211732*temp*temp*hum
       +0.00072546*temp*hum*hum-0.000003582*temp*temp*hum*hum;
  }
  hi=Math.round(hi);
  let label,color,emoji;
  if(temp<=0){label="Mrozowo";color="rgba(56,189,248,.12)";emoji="🥶";}
  else if(hi<10){label="Zimno";color="rgba(56,189,248,.12)";emoji="🧊";}
  else if(hi<17){label="Chłodno";color="rgba(99,102,241,.1)";emoji="😐";}
  else if(hi<22){label="Komfortowo";color="rgba(52,211,153,.1)";emoji="😊";}
  else if(hi<27){label="Przyjemnie";color="rgba(52,211,153,.08)";emoji="😌";}
  else if(hi<32){label="Ciepło";color="rgba(251,191,36,.1)";emoji="😅";}
  else if(hi<38){label="Gorąco";color="rgba(249,115,22,.12)";emoji="🥵";}
  else{label="Bardzo gorąco";color="rgba(248,113,113,.12)";emoji="🔥";}
  return{value:hi,label,color,emoji};
}

// Haversine distance w km
function stationDist(lat1,lng1,lat2,lng2){
  const R=6371,d2r=Math.PI/180;
  const dLat=(lat2-lat1)*d2r,dLng=(lng2-lng1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Znajdz najblizsze stacje IMGW i zwroc liste posortowana wg odleglosci
async function findNearestIMGW(lat,lng){
  const all=await fetchIMGWAll();
  if(!all||!Array.isArray(all)||all.length===0)return null;

  const results=[];
  all.forEach(s=>{
    // Dopasuj dane API do wspolrzednych ze slownika
    const known=IMGW_STATIONS.find(k=>{
      const nameMatch=s.stacja&&(
        s.stacja.toLowerCase()===k.name.toLowerCase()||
        s.stacja.toLowerCase().includes(k.name.toLowerCase())||
        k.name.toLowerCase().includes(s.stacja.toLowerCase())
      );
      const idMatch=s.id_stacji&&(s.id_stacji===k.id||s.id_stacji.includes(k.id)||k.id.includes(s.id_stacji));
      return nameMatch||idMatch;
    });
    if(!known)return;
    const dist=stationDist(lat,lng,known.lat,known.lng);
    results.push({
      ...s,
      ...known,
      dist:Math.round(dist*10)/10
    });
  });

  // Sortuj od najblizszej
  results.sort((a,b)=>a.dist-b.dist);

  if(results.length===0)return null;

  const best=results[0];
  console.log(`Najblizsa stacja IMGW: ${best.stacja||best.name} (${best.dist} km)`);
  console.log(`Dane: temp=${best.temperatura}°C, wilg=${best.wilgotnosc_wzgledna}%, wiatr=${best.predkosc_wiatru}m/s, ciśnienie=${best.cisnienie}hPa`);

  // Sprawdz swiezosc danych - IMGW aktualizuje co godzine
  // pole data_pomiaru = "2026-08-07", godzina_pomiaru = "10"
  let ageMinutes = null;
  if(best.data_pomiaru && best.godzina_pomiaru!=null){
    try{
      const obsDate = new Date(`${best.data_pomiaru}T${String(best.godzina_pomiaru).padStart(2,"0")}:00:00`);
      ageMinutes = Math.round((Date.now()-obsDate.getTime())/60000);
    }catch(e){}
  }
  best.ageMinutes = ageMinutes;
  // Jesli dane starsze niz 3h - traktuj jako nieaktualne, nie uzywaj do nadpisywania
  best.isFresh = ageMinutes===null ? true : ageMinutes < 180;

  // Zwroc najblizsa stacje + liste wszystkich w promieniu 100km
  return {
    best,
    nearby:results.filter(r=>r.dist<=100).slice(0,5)
  };
}

function calcConfidence(temps){
  if(temps.length<2)return{pct:100,spread:0};
  const min=Math.min(...temps),max=Math.max(...temps);
  const spread=max-min;
  // Rozrzut 0-1°C = 95-100%, 1-3°C = 75-95%, 3-6°C = 50-75%, >6°C = <50%
  let pct;
  if(spread<=1)pct=95+Math.round((1-spread)*5);
  else if(spread<=3)pct=75+Math.round((3-spread)/2*20);
  else if(spread<=6)pct=50+Math.round((6-spread)/3*25);
  else pct=Math.max(20,50-Math.round((spread-6)*3));
  return{pct:Math.min(100,Math.max(20,pct)),spread:Math.round(spread*10)/10};
}

function checkForecastAccuracy(actualTemp,actualCode){
  try{
    let hist=JSON.parse(localStorage.getItem("aura_forecast_hist")||"[]");
    const now=Date.now();
    let updated=false;
    hist.forEach(h=>{
      if(!h.verified && now>=h.checkAt && now-h.checkAt<3600*1000){
        h.actualTemp=actualTemp;
        h.actualCode=actualCode;
        h.tempDiff=Math.abs(h.predictedTemp-actualTemp);
        h.codeMatch=Math.abs(h.predictedCode-actualCode)<10;
        h.verified=true;
        updated=true;
      }
    });
    if(updated)localStorage.setItem("aura_forecast_hist",JSON.stringify(hist));
  }catch(e){}
}

function getAccuracyStats(){
  try{
    const hist=JSON.parse(localStorage.getItem("aura_forecast_hist")||"[]");
    const verified=hist.filter(h=>h.verified);
    if(verified.length<3)return null;
    const avgDiff=verified.reduce((s,h)=>s+h.tempDiff,0)/verified.length;
    const accuracy=Math.max(0,Math.min(100,Math.round(100-avgDiff*15)));
    return{accuracy,count:verified.length,avgDiff:Math.round(avgDiff*10)/10};
  }catch(e){return null;}
}

function setAmbient(code,isDay){

  function draw(){

    ctx.fillStyle="#020817";ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
    const mR=Math.min(W,H)*.45;
    ctx.strokeStyle="rgba(99,102,241,.12)";ctx.lineWidth=1;
    for(let r=mR/4;r<=mR;r+=mR/4){ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle="rgba(99,102,241,.4)";ctx.font="bold 8px monospace";ctx.textAlign="left";ctx.fillText(Math.round(r/mR*50)+"km",W/2+4,H/2-r+3);}

    const sg=ctx.createRadialGradient(W/2,H/2,5,W/2,H/2,mR);sg.addColorStop(0,"rgba(99,102,241,.2)");sg.addColorStop(1,"rgba(99,102,241,0)");
    ctx.save();ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.arc(W/2,H/2,mR,sweep-.42,sweep);ctx.closePath();ctx.fillStyle=sg;ctx.fill();ctx.restore();
    ctx.strokeStyle="rgba(129,140,248,.9)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(sweep)*mR,H/2+Math.sin(sweep)*mR);ctx.stroke();

      else{rg.addColorStop(0,"rgba(52,211,153,.6)");rg.addColorStop(1,"rgba(52,211,153,0)");}
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,cell.r,0,Math.PI*2);ctx.fill();
      if(storm&&Math.random()<.04){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.shadowColor="#FBBF24";ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(cx+Math.random()*20-10,cy-20);ctx.lineTo(cx+Math.random()*10-5,cy);ctx.lineTo(cx+Math.random()*20-10,cy+20);ctx.stroke();ctx.shadowBlur=0;}
    });
    TOWNS.forEach(t=>{
      const tx=t.x/100*W,ty=t.y/100*H;
      ctx.font=t.c?"bold 9px sans-serif":"bold 8px sans-serif";ctx.textAlign="center";
      const tw2=ctx.measureText(t.name).width;
      ctx.fillStyle="rgba(11,18,33,.92)";ctx.strokeStyle=t.c?"rgba(99,102,241,.7)":"rgba(255,255,255,.12)";ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(tx-tw2/2-5,ty-14,tw2+10,18,4);ctx.fill();ctx.stroke();
      ctx.fillStyle=t.c?"#818CF8":"#94A3B8";ctx.beginPath();ctx.arc(tx,ty+2,t.c?3.5:2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=t.c?"#fff":"#CBD5E1";ctx.fillText(t.name,tx,ty-3);
    });
    ctx.restore();RAF=requestAnimationFrame(draw);
  }
  setTimeout(draw,120);return sec;
}

// Punkt rosy (wzór Magnusa)
function dewPoint(t,rh){
  if(t==null||rh==null||rh<=0)return null;
  const a=17.62,b=243.12,g=Math.log(rh/100)+a*t/(b+t);
  return b*g/(a-g);
}

// Kolor temperatury (dla pasków zakresu)
function tempColor(t){
  const st=[[-10,[90,160,255]],[0,[125,211,252]],[8,[150,231,196]],[15,[200,232,110]],[22,[255,210,77]],[28,[255,154,61]],[35,[255,94,77]]];
  if(t<=st[0][0])return`rgb(${st[0][1]})`;
  for(let i=1;i<st.length;i++){
    if(t<=st[i][0]){
      const [t0,c0]=st[i-1],[t1,c1]=st[i],k=(t-t0)/(t1-t0);
      return`rgb(${c0.map((v,j)=>Math.round(v+(c1[j]-v)*k))})`;
    }
  }
  return`rgb(${st[st.length-1][1]})`;
}

// Opad co 15 min na najbliższe 2h (styl MinuteCast z AccuWeather)
async function apiMinutely(lat,lng){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&minutely_15=precipitation&forecast_days=2&timezone=auto`,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)return null;
    const d=await r.json();
    const t=d.minutely_15?.time,p=d.minutely_15?.precipitation;
    if(!t||!p)return null;
    const now=Date.now();
    let idx=-1;
    for(let i=0;i<t.length;i++){if(new Date(t[i]).getTime()<=now)idx=i;else break;}
    if(idx<0)return null;
    // wartość przy znaczniku t = suma z poprzednich 15 min, więc przyszłość zaczyna się od idx+1
    const out=[];
    for(let i=idx+1;i<=idx+8&&i<t.length;i++)out.push({t:t[i],mm:+(p[i]||0)});
    return out.length>=4?out:null;
  }catch{return null;}
}

// Statystyki z aplikacji „Zza okna” (okno.html zapisuje je w tym samym localStorage)
function oknoStats(){
  try{
    const log=JSON.parse(localStorage.getItem("okno_log")||"[]");
    const recent=log.filter(x=>Date.now()-x.ts<90*864e5);
    if(!recent.length)return null;
    const pts=v=>v===0?1:v===1?.5:0;
    let sum=0,n=0;
    recent.forEach(x=>["sky","precip","wind","temp"].forEach(k=>{if(x.score&&x.score[k]!=null){sum+=pts(x.score[k]);n++;}}));
    const errs=recent.filter(x=>x.tempErr!=null).map(x=>x.tempErr);
    const bias=errs.length>=5?errs.reduce((a,b)=>a+b,0)/errs.length:null;
    return{count:recent.length,acc:n?Math.round(sum/n*100):null,bias,biasN:errs.length};
  }catch{return null;}
}

function sunInfo(daily,now=new Date()){
  const sr=daily?.sunrise?.[0]?new Date(daily.sunrise[0]):null;
  const ss=daily?.sunset?.[0]?new Date(daily.sunset[0]):null;
  if(!sr||!ss||isNaN(sr)||isNaN(ss)){
    const h=now.getHours()+now.getMinutes()/60;
    return{sr:null,ss:null,f:null,day:h>=6&&h<19,e:h>=6&&h<19?Math.sin(Math.PI*(h-6)/13):-1};
  }
  const t=+now,a=+sr,b=+ss;
  if(t>=a&&t<=b){const f=(t-a)/(b-a);return{sr,ss,f,day:true,e:Math.sin(Math.PI*f)};}
  const mins=(t<a?a-t:t-b)/60000;
  return{sr,ss,f:t<a?0:1,day:false,e:-clamp(mins/100,0,1)};
}
const SKY_STOPS=[
  [-1,   [6,12,36],   [26,40,82]],
  [-.25, [24,34,84],  [92,86,140]],
  [0,    [50,66,128], [236,140,98]],
  [.18,  [58,104,178],[244,178,110]],
  [.5,   [24,94,190], [122,190,240]],
];
function mixRGB(a,b,k){return a.map((v,i)=>v+(b[i]-v)*k);}
function skyColors(e,cloud,precip,storm){
  let top,bot;
  e=clamp(e,-1,1);
  if(e>=SKY_STOPS[SKY_STOPS.length-1][0]){top=SKY_STOPS[SKY_STOPS.length-1][1];bot=SKY_STOPS[SKY_STOPS.length-1][2];}
  else{
    for(let i=1;i<SKY_STOPS.length;i++){
      if(e<=SKY_STOPS[i][0]){
        const k=(e-SKY_STOPS[i-1][0])/(SKY_STOPS[i][0]-SKY_STOPS[i-1][0]);
        top=mixRGB(SKY_STOPS[i-1][1],SKY_STOPS[i][1],k);bot=mixRGB(SKY_STOPS[i-1][2],SKY_STOPS[i][2],k);break;
      }
    }
  }
  const m=clamp((cloud/100)*.78+(precip>0?.14:0)+(storm?.15:0),0,.92);
  const gray=c=>{const l=.3*c[0]+.59*c[1]+.11*c[2];return[l*.9+8,l*.96+14,l+24];};
  const dark=storm?.72:precip>0?.86:1;
  top=mixRGB(top,gray(top),m).map(v=>v*dark);
  bot=mixRGB(bot,gray(bot),m).map(v=>v*dark);
  const css=c=>`rgb(${c.map(v=>Math.round(clamp(v,0,255))).join(",")})`;
  return{top:css(top),bot:css(bot)};
}
function applySky(X){
  const now=new Date();
  const h=now.getHours()+now.getMinutes()/60;
  let e,cloud=25,precip=0,storm=false;
  if(X){e=X.sun.e;cloud=X.cloud;precip=X.precip>0.05||X.code>=51&&X.code<=82?1:0;storm=X.code>=95;}
  else e=h>=6&&h<19?Math.sin(Math.PI*(h-6)/13):-.9;
  const c=skyColors(e,cloud,precip,storm);
  const r=document.documentElement.style;
  r.setProperty("--st",c.top);r.setProperty("--sb",c.bot);
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",c.top);
}

// Jedno miejsce, w którym liczymy wszystkie wartości pochodne
function computeCtx(){
  const {data}=S;const {current,hourly,daily}=data;
  const now=new Date();
  const pfx=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}`;
  let ci=hourly.time.findIndex(t=>t.startsWith(pfx));if(ci<0)ci=0;
  const g=a=>a?.[ci];
  const sun=sunInfo(daily,now);
  const isDay=current.is_day!=null?current.is_day===1:sun.day;
  // Pomiar ze stacji (jeśli zastosowano) siedzi w current — bierzemy go w pierwszej kolejności
  const T=current.temperature_2m??g(hourly.temperature_2m)??15;
  const feels=current.apparent_temperature??g(hourly.apparent_temperature)??T;
  const hum=Math.round(current.relative_humidity_2m??g(hourly.relative_humidity_2m)??0);
  const wind=Math.round(current.wind_speed_10m??g(hourly.wind_speed_10m)??0);
  const gusts=Math.round(current.wind_gusts_10m??wind);
  const wdeg=current.wind_direction_10m??g(hourly.wind_direction_10m)??0;
  const press=Math.round(current.pressure_msl??g(hourly.pressure_msl)??0);
  const cloud=clamp(Math.round(current.cloud_cover??g(hourly.cloud_cover)??0),0,100);
  const code=current.weather_code??0;
  const precip=+(current.precipitation??current.rain??0);
  const pop=g(hourly.precipitation_probability)??0;
  const uv=+(g(hourly.uv_index)??current.uv_index??0)||0;
  const uvMax=+(daily.uv_index_max?.[0]??uv)||0;
  const rad=g(hourly.shortwave_radiation)??uv*80;
  const dew=dewPoint(T,hum);
  const p0=ci>=3?hourly.pressure_msl?.[ci-3]:null,p1=g(hourly.pressure_msl);
  const pDelta=p0!=null&&p1!=null?p1-p0:null;
  const visKm=g(hourly.visibility)!=null?g(hourly.visibility)/1000:null;
  const cloudBase=dew!=null&&cloud>=15?Math.round(clamp((T-dew)*125,50,6000)):null;
  return{
    ci,now,sun,isDay,T,feels,hum,wind,gusts,wdeg,press,cloud,code,precip,pop,uv,uvMax,rad,dew,pDelta,visKm,cloudBase,
    low:g(hourly.cloud_cover_low),mid:g(hourly.cloud_cover_mid),high:g(hourly.cloud_cover_high),
    maxT:Math.round(daily.temperature_2m_max?.[0]??T),minT:Math.round(daily.temperature_2m_min?.[0]??T),
    rainToday:+(daily.precipitation_sum?.[0]??0),popMax:daily.precipitation_probability_max?.[0]??0,
    meta:wMeta(code,isDay),
  };
}

function getAlerts(X){
  const A=[],{hourly}=S.data;
  if(X.code>=95)A.push({c:"bad",t:"Burza w okolicy. Zostań w budynku i odłącz wrażliwe urządzenia."});
  if(X.wind>=45)A.push({c:"bad",t:`Silny wiatr ${X.wind} km/h, porywy do ${X.gusts} km/h.`});
  else if(X.gusts>=65)A.push({c:"bad",t:`Porywy wiatru do ${X.gusts} km/h.`});
  if(!S.minutely&&X.precip<0.1&&X.code<51){
    for(let i=1;i<=2;i++){
      const idx=X.ci+i;
      if(idx<hourly.time.length&&(hourly.precipitation_probability?.[idx]??0)>=60){A.push({c:"info",t:`Prognoza opadów około ${hhmm(hourly.time[idx])}. Weź parasol.`});break;}
    }
  }
  if(X.T<=0)A.push({c:"info",t:"Temperatura poniżej zera, możliwe oblodzenie."});
  if(X.T>=32)A.push({c:"warn",t:`Upał ${Math.round(X.T)}°. Unikaj słońca między 11 a 15 i pij dużo wody.`});
  if(X.uv>=8)A.push({c:"warn",t:`Bardzo wysokie UV (${Math.round(X.uv)}). Krem z filtrem i nakrycie głowy.`});
  if(S.air&&S.air.european_aqi>80)A.push({c:"warn",t:`Zła jakość powietrza (indeks ${Math.round(S.air.european_aqi)}). Ogranicz wysiłek na zewnątrz.`});
  return A.slice(0,3);
}

function smoothPath(pts){
  if(pts.length<2)return"";
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
// Meteogram 48h: temperatura, wiatr, opady w jednym wykresie
function meteogramHTML(X){
  const {hourly}=S.data;
  const N=Math.min(48,hourly.time.length-X.ci);if(N<8)return"";
  const step=30,pl=16,W=pl*2+step*(N-1),H=194;
  const temps=[];for(let i=0;i<N;i++)temps.push(hourly.temperature_2m[X.ci+i]);
  const tmin=Math.min(...temps),tmax=Math.max(...temps),y0=46,y1=104;
  const ty=t=>y1-(t-tmin)/Math.max(1,tmax-tmin)*(y1-y0);
  const pts=temps.map((t,i)=>[pl+i*step,+ty(t).toFixed(1)]);
  const line=smoothPath(pts);
  let svg=`<defs><linearGradient id="mgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC857" stop-opacity=".42"/><stop offset="1" stop-color="#FFC857" stop-opacity="0"/></linearGradient></defs>`;
  svg+=`<path d="${line}L${pts[N-1][0]},${y1+16}L${pts[0][0]},${y1+16}Z" fill="url(#mgA)"/><path d="${line}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>`;
  let lastDay="";
  for(let i=0;i<N;i++){
    const idx=X.ci+i,t=new Date(hourly.time[idx]),x=pl+i*step,h=t.getHours();
    const dayKey=hourly.time[idx].slice(0,10);
    if(dayKey!==lastDay){
      lastDay=dayKey;
      if(i>0)svg+=`<line x1="${x}" y1="22" x2="${x}" y2="176" stroke="rgba(255,255,255,.2)" stroke-dasharray="2 4"/>`;
      svg+=`<text x="${x+(i>0?6:-2)}" y="16" font-weight="600" style="fill:#fff">${i===0?"Dziś":DAY_SHORT(hourly.time[idx])}</text>`;
    }
    if(i%3===0){
      svg+=`<circle cx="${x}" cy="${pts[i][1]}" r="2.6" fill="#fff"/><text x="${x}" y="${pts[i][1]-9}" text-anchor="middle" class="tn" style="fill:#fff;font-weight:600">${Math.round(temps[i])}°</text>`;
      const w=hourly.wind_speed_10m?.[idx],wd=hourly.wind_direction_10m?.[idx];
      if(w!=null){
        svg+=`<g transform="translate(${x} 128) rotate(${((wd??0)+180)%360})"><path d="M0 -6L4 4L0 2L-4 4Z" fill="rgba(255,255,255,.75)"/></g><text x="${x}" y="146" text-anchor="middle" class="tn">${Math.round(w)}</text>`;
      }
      svg+=`<text x="${x}" y="190" text-anchor="middle" class="tn">${pad(h)}</text>`;
    }
    const pr=+(hourly.precipitation?.[idx]||0);
    if(pr>=.05)svg+=`<rect x="${x-6}" y="${(172-Math.min(20,pr*9)).toFixed(1)}" width="12" height="${Math.min(20,pr*9).toFixed(1)}" rx="3" fill="#8ADBFF" opacity=".9"/>`;
  }
  svg+=`<line x1="${pl}" y1="22" x2="${pl}" y2="176" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`;
  return`<section class="card"><div class="ch">${mini("chart")}<span class="grow">Przebieg na 48 godzin</span></div><div class="mg"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Wykres temperatury, wiatru i opadów na 48 godzin">${svg}</svg></div><div class="note">Krzywa to temperatura, liczby pod nią to wiatr w km/h ze strzałką kierunku, niebieskie słupki to opady.</div></section>`;
}

function dailyRows(){
  const {daily,hourly}=S.data,X=S.X;
  const idxs=[];
  daily.time.forEach((d,i)=>{if(i<10&&daily.temperature_2m_max?.[i]!=null&&daily.temperature_2m_min?.[i]!=null)idxs.push(i);});
  const gmin=Math.min(...idxs.map(i=>daily.temperature_2m_min[i])),gmax=Math.max(...idxs.map(i=>daily.temperature_2m_max[i])),span=Math.max(1,gmax-gmin);

    const dot=i===0?`<u style="left:${clamp((X.T-gmin)/span*100,0,100).toFixed(1)}%"></u>`:"";
    let exp="";
    if(open){
      const dateStr=daily.time[i];let hs="";

      });
      const kv=[];
      kv.push(`Opady ${fnum(daily.precipitation_sum?.[i]||0,1)} mm`);
      if(daily.uv_index_max?.[i]!=null)kv.push(`UV maks. ${fnum(daily.uv_index_max[i],1)}`);
      if(daily.wind_speed_10m_max?.[i]!=null)kv.push(`Wiatr do ${Math.round(daily.wind_speed_10m_max[i])} km/h`);
      if(daily.sunrise?.[i])kv.push(`Wschód ${hhmm(daily.sunrise[i])}`);
      if(daily.sunset?.[i])kv.push(`Zachód ${hhmm(daily.sunset[i])}`);
      exp=`<div class="dexp"><div class="kv">${kv.map(k=>`<span class="chip">${k}</span>`).join("")}</div><div class="hstrip">${hs}</div></div>`;
    }
    return`<button class="drow" data-act="day" data-i="${i}" aria-expanded="${open}">
      <span class="dname">${label}</span>
      <span class="dic">${ico(daily.weather_code?.[i]??0,true,30)}<i class="tn">${pop>=20?pop+"%":""}</i></span>
      <span class="dmin tn">${Math.round(mn)}°</span>
      <span class="dbar"><b style="left:${left}%;width:${width}%;background:linear-gradient(90deg,${tempColor(mn)},${tempColor(mx)})"></b>${dot}</span>
      <span class="dmax tn">${Math.round(mx)}°</span></button>${exp}`;
  }).join("");
}

function compass(deg,spd){
  let ticks="";
  for(let i=0;i<36;i++){const a=i*10*Math.PI/180,big=i%9===0,r1=big?37:39.5;ticks+=`<line x1="${(50+Math.sin(a)*r1).toFixed(1)}" y1="${(50-Math.cos(a)*r1).toFixed(1)}" x2="${(50+Math.sin(a)*43).toFixed(1)}" y2="${(50-Math.cos(a)*43).toFixed(1)}" stroke="rgba(255,255,255,${big?.55:.24})" stroke-width="${big?1.6:1}"/>`;}
  return`<svg class="cmp" viewBox="0 0 100 100" role="img" aria-label="Wiatr z kierunku ${wdir(deg)}">${ticks}
    <text x="50" y="30" text-anchor="middle" font-size="8.500" font-weight="600">N</text><text x="72" y="53" text-anchor="middle" font-size="8.500">E</text><text x="50" y="76" text-anchor="middle" font-size="8.500">S</text><text x="28" y="53" text-anchor="middle" font-size="8.500">W</text>
    <g transform="rotate(${(deg+180)%360} 50 50)"><path d="M50 3.500L56.500 16H43.500Z" fill="#FFC857"/></g></svg>`;
}
function wWind(X){
  return`<div class="w"><div class="wh">${mini("wind")}Wiatr</div><div style="position:relative">${compass(X.wdeg,X.wind)}<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none"><div><div class="tn" style="font-size:24px;font-weight:600;line-height:1;margin-top:10px">${X.wind}</div><div style="font-size:11px;color:var(--ink2)">km/h</div></div></div></div><div class="ws" style="text-align:center">${BFT_PL[bft(X.wind)]}, porywy ${X.gusts} km/h z ${wdir(X.wdeg)}</div></div>`;
}
function wFeels(X){
  const d=discomfortIndex(X.T,X.hum),diff=Math.round(X.feels-X.T);
  const txt=diff<=-2?"Chłodniej niż wskazuje termometr, głównie przez wiatr.":diff>=2?"Cieplej niż wskazuje termometr, dokłada się wilgotność lub słońce.":"Zbliżona do temperatury rzeczywistej.";
  return`<div class="w"><div class="wh">${mini("thermo")}Odczuwalna</div><div class="wv tn">${Math.round(X.feels)}°<small>${d.label}</small></div><div class="ws">${txt}</div></div>`;
}
function wHum(X){
  const dp=X.dew,w=dp==null?"":dp<5?"Bardzo sucho":dp<10?"Sucho":dp<16?"Komfortowo":dp<20?"Parno":"Duszno";
  return`<div class="w"><div class="wh">${mini("drop")}Wilgotność</div><div class="wv tn">${X.hum}<small>%</small></div><div class="ws">Punkt rosy ${dp==null?"–":Math.round(dp)+"°"}${w?`, ${w.toLowerCase()}`:""}.</div></div>`;
}
function wPress(X){
  const p=X.press;if(!p)return"";
  const k=clamp((p-970)/80,0,1),th=Math.PI*(1-k),cx=60,cy=58,r=46;
  const px=(cx+Math.cos(th)*r).toFixed(1),py=(cy-Math.sin(th)*r).toFixed(1);
  const tr=X.pDelta==null?"":X.pDelta>1?"Rośnie":X.pDelta<-1?"Spada":"Stabilne";
  return`<div class="w"><div class="wh">${mini("gauge")}Ciśnienie</div><svg class="gauge" viewBox="0 0 120 66" role="img" aria-label="${p} hPa"><path d="M14 58A46 46 0 0 1 106 58" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6" stroke-linecap="round"/><circle cx="${px}" cy="${py}" r="6.500" fill="#fff" stroke="rgba(8,15,32,.55)" stroke-width="3"/><text x="60" y="54" text-anchor="middle" font-size="21" font-weight="600" fill="#fff" class="tn">${p}</text></svg><div class="ws" style="text-align:center">hPa${tr?`, ${tr.toLowerCase()} (3 h)`:""}</div></div>`;
}
function wVis(X){
  const v=X.visKm;
  const vt=v==null?"–":v>=20?"> 20":fnum(v,v<10?1:0);
  const w=v==null?"":v>=20?"Bardzo dobra":v>=10?"Dobra":v>=4?"Ograniczona":v>=1?"Słaba":"Mgła";
  return`<div class="w"><div class="wh">${mini("eye")}Widoczność</div><div class="wv tn">${vt}<small>km</small></div><div class="ws">${w}${X.cloudBase?`. Podstawa chmur ok. ${X.cloudBase} m (szac.).`:X.cloud<15?". Niebo prawie bez chmur.":"."}</div></div>`;
}
function wLayers(X){
  const L=(n,v)=>v==null?"":`<div class="layer"><span>${n}</span><div><b style="width:${clamp(v,0,100)}%"></b></div><span class="tn">${Math.round(v)}%</span></div>`;
  return`<div class="w"><div class="wh">${mini("cloud")}Zachmurzenie</div><div class="wv tn">${X.cloud}<small>%</small></div>${L("Niskie",X.low)}${L("Średnie",X.mid)}${L("Wysokie",X.high)}</div>`;
}
function wRain(X){
  const {hourly}=S.data;let next="";
  for(let i=1;i<24&&X.ci+i<hourly.time.length;i++){
    if((hourly.precipitation_probability?.[X.ci+i]??0)>=50){next=`Najbliższy deszcz ok. ${pad(new Date(hourly.time[X.ci+i]).getHours())}:00.`;break;}
  }
  return`<div class="w"><div class="wh">${mini("umbrella")}Opady dziś</div><div class="wv tn">${fnum(X.rainToday,1)}<small>mm</small></div><div class="ws">Szansa maks. ${X.popMax}%. ${next||"Bez opadów o wysokim prawdopodobieństwie w 24 h."}</div></div>`;
}
function wSun(X){
  if(!(X.rad>50&&X.isDay))return"";
  const sh=calcSunShadeTemp(X.T,X.rad,X.wind,X.hum);
  return`<div class="w full"><div class="wh">${mini("sun")}Słońce i cień</div><div class="wv tn">${sh.sun}°<small>na słońcu</small></div><div class="ws">W cieniu ${sh.shade}°. Promieniowanie ${Math.round(X.rad)} W/m².</div></div>`;
}
function widgetsHTML(X){
  const list=[wUV(X),wWind(X),wFeels(X),wHum(X),wPress(X),wVis(X),wLayers(X),wRain(X),wSun(X)].filter(Boolean);
  return`<div class="grid">${list.join("")}</div>`;
}

function airHTML(){

  const bi=B.findIndex(b=>v<=b[0]);
  const poll=[["Brzoza",a.birch_pollen],["Trawy",a.grass_pollen],["Bylica",a.mugwort_pollen],["Ambrozja",a.ragweed_pollen],["Olcha",a.alder_pollen]]
    .filter(p=>p[1]!=null&&p[1]>=1).sort((x,y)=>y[1]-x[1]).slice(0,4);
  const lvl=g=>g<10?"niskie":g<50?"średnie":"wysokie";

    <div style="display:flex;align-items:baseline;gap:10px"><span class="wv tn" style="font-size:34px">${v}</span><span style="font-weight:600">${B[bi][1]}</span></div>
    <div class="aq-bar">${B.map((b,k)=>`<i class="${k<=bi?"on":""}" style="background:${b[2]}"></i>`).join("")}</div>
    <div class="note" style="margin-top:6px">Europejski indeks jakości powietrza. PM2,5: ${fnum(a.pm2_5,1)} µg/m³, PM10: ${fnum(a.pm10,1)} µg/m³.</div>
    ${poll.length?`<div class="kvs" style="margin-top:10px">${poll.map(p=>`<span class="chip">${p[0]}: ${lvl(p[1])} (${Math.round(p[1])})</span>`).join("")}</div>`:""}</section>`;
}

function oknoHTML(){

  let body;
  if(o){
    body=`<div class="stg"><div><small>Trafność prognozy</small><b class="tn">${o.acc==null?"–":o.acc+"%"}</b></div><div><small>Twoje obserwacje</small><b class="tn">${o.count}</b></div></div>`;
    if(o.bias!=null)body+=`<div class="note">Model średnio ${o.bias>0?"zawyża":"zaniża"} temperaturę o ${fnum(Math.abs(o.bias),1)}° względem Twojego termometru (${o.biasN} pomiarów).</div>`;
  }else body=`<div class="say" style="font-size:15px;font-weight:400;margin:0">Powiedz, co widzisz za oknem. Aplikacja porówna to z prognozą i z pomiarem ze stacji, a z czasem pokaże, komu ufać.</div>`;
  return`<section class="card"><div class="ch">${mini("window")}<span class="grow">Prognoza kontra okno</span></div>${body}<a class="btn pri wide" style="margin-top:14px" href="okno.html">Sprawdź zza okna</a></section>`;
}

function modelsHTML(){
  const c=S.confidence,mc=S.modelCompare,acc=getAccuracyStats();
  const names={icon_seamless:"ICON (DWD)",ecmwf_ifs025:"ECMWF IFS",gfs_seamless:"GFS (NOAA)"};
  let body="";
  if(c){
    const col=c.pct>=85?"var(--ok)":c.pct>=65?"var(--warn)":"var(--bad)";
    const lb=c.pct>=85?"Modele są zgodne":c.pct>=65?"Zgodność umiarkowana":"Modele się rozjeżdżają";
    body+=`<div style="display:flex;align-items:baseline;gap:10px"><span class="wv tn" style="font-size:34px;color:${col}">${c.pct}%</span><span style="font-weight:600">${lb}</span></div><div class="meter"><i style="width:${c.pct}%;background:${col}"></i></div>${c.spread>0?`<div class="note" style="margin:0 0 6px">Rozrzut temperatury między modelami: ${fnum(c.spread,1)}°</div>`:""}`;
  }
  if(mc&&mc.length){
    const ts=mc.map(m=>m.temp),lo=Math.min(...ts),hi=Math.max(...ts),sp=Math.max(.5,hi-lo);
    body+=mc.map(m=>`<div class="mrow"><span>${names[m.name]||m.name}</span><div class="mtrack"><u style="left:${((m.temp-lo)/sp*80+10).toFixed(1)}%"></u></div><b class="tn">${fnum(m.temp,1)}°</b></div>`).join("");
  }else if(!c)body+=`<div class="note" style="margin-top:0">Porównanie modeli pojawi się po chwili.</div>`;
  if(acc)body+=`<div class="note">Trafność temperatury z historii tej aplikacji: ${acc.accuracy}% (${acc.count} zweryfikowanych prognoz).</div>`;
  return`<section class="card"><div class="ch">${mini("layers")}<span class="grow">Modele i wiarygodność</span></div>${body}
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn" data-act="model">Zmień model</button><button class="btn" data-act="raw">Surowe dane</button></div></section>`;
}

// ── radar: prawdziwa mapa RainViewer (Leaflet ładowany na żądanie)
const RV={state:"idle",map:null,layers:[],frames:[],pos:0,timer:null,node:null,host:""};
function radarHTML(){
  return`<section class="card" id="radar-card"><div class="ch">${mini("radar")}<span class="grow">Radar opadów</span><span class="chip" id="radar-time" hidden></span></div>
    <div id="radar-slot"><div class="radar-ph"><div>Mapa opadów z ostatnich dwóch godzin</div><button class="btn pri" data-act="radar">Pokaż radar</button></div></div></section>`;
}
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  return new Promise((res,rej)=>{
    const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(l);
    const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload=res;s.onerror=()=>rej(new Error("leaflet"));document.head.appendChild(s);
  });
}
async function startRadar(){
  if(RV.state==="loading"||RV.state==="ready")return;
  RV.state="loading";
  const slot=$("#radar-slot");if(slot)slot.innerHTML=`<div class="radar-ph"><div>Ładowanie radaru…</div></div>`;
  try{
    await loadLeaflet();
    const r=await fetch("https://api.rainviewer.com/public/weather-maps.json",{signal:AbortSignal.timeout(9000)});
    if(!r.ok)throw new Error("rainviewer "+r.status);
    const j=await r.json();
    RV.host=j.host||"https://tilecache.rainviewer.com";
    RV.frames=(j.radar?.past||[]).slice(-10);
    if(!RV.frames.length)throw new Error("brak klatek");
    const node=document.createElement("div");node.id="radar-slot";
    node.innerHTML=`<div class="rmap" id="rmap"></div><div class="rctl"><button class="ib" data-act="rplay" aria-label="Odtwórz animację">${mini("play")}</button><input type="range" id="rslider" min="0" max="${RV.frames.length-1}" value="${RV.frames.length-1}" aria-label="Klatka radaru"/></div><div class="note">Radar: RainViewer. Mapa: OpenStreetMap, CARTO. Klatki co 10 minut.</div>`;
    const cur=$("#radar-slot");cur.replaceWith(node);RV.node=node;
    const map=L.map($("#rmap"),{zoomControl:false,minZoom:5,maxZoom:9,attributionControl:false}).setView([S.lat,S.lng],7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:9}).addTo(map);
    RV.layers=RV.frames.map(f=>L.tileLayer(`${RV.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:9,zIndex:5}).addTo(map));
    L.circleMarker([S.lat,S.lng],{radius:6,color:"#fff",weight:2,fillColor:"#FFC857",fillOpacity:1}).addTo(map);
    RV.map=map;RV.pos=RV.frames.length-1;RV.state="ready";radarShow(RV.pos);
  }catch(e){
    console.warn("Radar:",e.message);
    RV.state="fail";
    const cur=$("#radar-slot");
    const node=document.createElement("div");node.id="radar-slot";
    const p=document.createElement("div");p.className="note";p.style.cssText="margin:0 0 10px";p.textContent="Nie udało się pobrać prawdziwego radaru. Poniżej symulacja na podstawie opadu z modelu, nie pomiar.";
    node.appendChild(p);node.appendChild(buildSimRadar(S.X.code,S.X.precip));
    if(cur)cur.replaceWith(node);RV.node=node;
  }
}
function radarShow(i){
  if(!RV.layers.length)return;
  RV.pos=i;RV.layers.forEach((l,k)=>l.setOpacity(k===i?.75:0));
  const f=RV.frames[i],t=$("#radar-time");
  if(t&&f){const d=new Date(f.time*1000);t.hidden=false;t.textContent=hhmm(d);}
  const sl=$("#rslider");if(sl&&+sl.value!==i)sl.value=i;
}
function toggleRadarPlay(){
  const b=document.querySelector('[data-act="rplay"]');
  if(RV.timer){clearInterval(RV.timer);RV.timer=null;if(b)b.innerHTML=mini("play");return;}
  if(b)b.innerHTML=mini("pause");
  RV.timer=setInterval(()=>radarShow((RV.pos+1)%RV.frames.length),650);
}

  const txt=JSON.stringify(raw,null,2);
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${S.lat}&longitude=${S.lng}&current=temperature_2m,weather_code,wind_speed_10m&models=${activeModel.id}`;
  openSheet(`<h3>Surowe dane źródłowe</h3><div class="sd">Dokładnie to, co aplikacja dostała z modelu i ze stacji.</div><pre class="raw" id="rawtxt">${esc(txt)}</pre>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" data-act="copy">${mini("copy")}Kopiuj</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open-Meteo</a><a class="btn" href="https://danepubliczne.imgw.pl/api/data/synop/" target="_blank" rel="noopener">IMGW</a></div>`);
}


// ═══════════════════════════════════════════════
// v6 — pobieranie danych (logika z v5 zachowana, doszły: dystans stacji, więcej zmiennych, tło)
// ═══════════════════════════════════════════════
function resetRadar(){
  if(RV.timer){clearInterval(RV.timer);RV.timer=null;}
  try{if(RV.map)RV.map.remove();}catch{}
  if(RV.node&&RV.node.parentNode)RV.node.remove();
  Object.assign(RV,{state:"idle",map:null,layers:[],frames:[],pos:0,node:null});
}

function demoData(){
  const now=new Date();
  const start=new Date(now);start.setHours(0,0,0,0);
  const times=Array.from({length:240},(_,i)=>{const d=new Date(+start+i*36e5);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;});
  const dts=Array.from({length:10},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()+i);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;});
  const hr=t=>new Date(t).getHours();
  const arc=(t,a,b)=>Math.sin((hr(t)-6)*Math.PI/12)*a+b;
  return{
    current:{temperature_2m:18,apparent_temperature:16,relative_humidity_2m:65,weather_code:2,cloud_cover:40,wind_speed_10m:12,wind_gusts_10m:18,wind_direction_10m:220,pressure_msl:1016,uv_index:2.5,precipitation:0,rain:0,snowfall:0,showers:0,is_day:now.getHours()>=6&&now.getHours()<20?1:0},
    hourly:{time:times,
      temperature_2m:times.map(t=>Math.round(arc(t,6,13))),apparent_temperature:times.map(t=>Math.round(arc(t,5,11))),
      weather_code:times.map(()=>2),precipitation_probability:times.map(()=>10),precipitation:times.map(()=>0),
      cloud_cover:times.map(()=>40),cloud_cover_low:times.map(()=>20),cloud_cover_mid:times.map(()=>25),cloud_cover_high:times.map(()=>30),
      uv_index:times.map(t=>Math.max(0,Math.round(arc(t,3,0)*10)/10)),wind_speed_10m:times.map(()=>12),wind_direction_10m:times.map(()=>220),
      wind_gusts_10m:times.map(()=>18),relative_humidity_2m:times.map(()=>65),pressure_msl:times.map(()=>1016),visibility:times.map(()=>24000),
      shortwave_radiation:times.map(t=>Math.max(0,Math.round(arc(t,500,0))))},
    daily:{time:dts,weather_code:[2,1,3,2,1,2,3,2,1,2],temperature_2m_max:[22,24,19,21,23,25,20,22,23,21],temperature_2m_min:[12,13,11,12,13,14,11,12,13,11],
      precipitation_probability_max:[15,10,30,20,10,5,25,15,10,20],precipitation_sum:[0,0,.5,0,0,0,.3,0,0,.1],uv_index_max:[3,4,2,3,4,5,2,3,4,3],
      sunrise:dts.map(d=>d+"T05:55"),sunset:dts.map(d=>d+"T19:40"),wind_speed_10m_max:[18,15,22,16,14,12,20,15,14,16]}
  };
}

async function handleGPS(){
  gpsErr="";
  netErr=false;

  if(!window.isSecureContext){
    gpsErr="Lokalizacja GPS wymaga bezpiecznego połączenia HTTPS.";
    render();
    return;
  }

  if(!navigator.geolocation){
    gpsErr="Ta przeglądarka nie udostępnia lokalizacji GPS.";
    render();
    return;
  }

  S.loading=true;
  render();

  const getPosition=(options)=>new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve,reject,options);
  });

  try{
    let position;
    try{
      position=await getPosition({
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      });
    }catch(firstErr){
      if(firstErr?.code===1)throw firstErr;
      position=await getPosition({
        enableHighAccuracy:false,
        timeout:10000,
        maximumAge:30000
      });
    }

    const lat=Number(position.coords.latitude);
    const lng=Number(position.coords.longitude);
    const accuracy=Number(position.coords.accuracy);

    if(!Number.isFinite(lat)||!Number.isFinite(lng)){
      throw new Error("Nieprawidłowe współrzędne lokalizacji.");
    }

    console.log("GPS:",{lat,lng,accuracy});
    await loadW(lat,lng,null,false);
  }catch(err){
    S.loading=false;

    if(err?.code===1){
      gpsErr="Dostęp do lokalizacji został zablokowany. Zezwól przeglądarce na dostęp do lokalizacji dla tej strony i spróbuj ponownie.";
    }else if(err?.code===2){
      gpsErr="Nie udało się ustalić lokalizacji urządzenia. Sprawdź, czy lokalizacja jest włączona.";
    }else if(err?.code===3){
      gpsErr="Ustalanie lokalizacji trwało zbyt długo. Spróbuj ponownie.";
    }else{
      gpsErr=err?.message||"Nie udało się pobrać lokalizacji.";
    }

    render();
  }
}

async function loadW(lat,lng,name,isRef){
  if(isRef){S.refreshing=true;render();}
  else{resetRadar();Object.assign(S,{phase:"loading",loading:true});render();}

  let city=name;
  if(!city)city=await apiCity(lat,lng)||`${(+lat).toFixed(3)}, ${(+lng).toFixed(3)}`;

  let data=null,isDemo=false,stationInfo=null,imgwData=null;
  try{
    const [weatherResult,imgwResult]=await Promise.allSettled([apiWeather(lat,lng),findNearestIMGW(lat,lng)]);
    if(weatherResult.status==="fulfilled")data=weatherResult.value;else throw weatherResult.reason;
    if(imgwResult.status==="fulfilled"&&imgwResult.value){
      imgwData=imgwResult.value.best||imgwResult.value;
      stationInfo=`${imgwData.stacja||imgwData.name}, ${imgwData.dist} km`;
      // Pomiar ze stacji nadpisuje model TYLKO gdy jest świeży (<3 h), wiarygodny (±12°C od modelu) i stacja jest bliżej niż 80 km
      if(data&&data.current&&imgwData.temperatura&&imgwData.isFresh!==false&&imgwData.dist<=80){
        const imgwTemp=parseFloat(imgwData.temperatura);
        const imgwHum=parseFloat(imgwData.wilgotnosc_wzgledna);
        const imgwWind=parseFloat(imgwData.predkosc_wiatru)*3.6;
        const imgwPress=parseFloat(imgwData.cisnienie);
        const modelTemp=data.current.temperature_2m;
        const plausible=isNaN(modelTemp)||Math.abs(imgwTemp-modelTemp)<=12;
        if(!isNaN(imgwTemp)&&plausible){
          data.current.temperature_2m=imgwTemp;
          const windMs=(Math.round(parseFloat(imgwData.predkosc_wiatru||0)*3.6))/3.6;
          if(!isNaN(imgwHum)&&!isNaN(windMs)){
            let newFeels=imgwTemp;
            if(imgwTemp<=10&&windMs>1.3)newFeels=13.12+0.6215*imgwTemp-11.37*Math.pow(windMs*3.6,0.16)+0.3965*imgwTemp*Math.pow(windMs*3.6,0.16);
            else if(imgwTemp>=27)newFeels=-8.784+1.611*imgwTemp+2.338*imgwHum-0.146*imgwTemp*imgwHum;
            data.current.apparent_temperature=Math.round(newFeels*10)/10;
          }else data.current.apparent_temperature=imgwTemp;
          if(!isNaN(imgwHum))data.current.relative_humidity_2m=imgwHum;
          if(!isNaN(imgwWind))data.current.wind_speed_10m=imgwWind;
          if(!isNaN(imgwPress)&&imgwPress>0)data.current.pressure_msl=imgwPress;
        }else if(!plausible)console.warn("IMGW temp odrzucona:",imgwTemp,"vs model",modelTemp);
      }
    }else stationInfo=`Open-Meteo, ${(+lat).toFixed(3)}°N, ${(+lng).toFixed(3)}°E`;
  }catch(e){
    console.warn("API fail:",e.message);
    isDemo=true;imgwData=null;stationInfo="Dane demonstracyjne";data=demoData();
  }

  try{localStorage.setItem("aura_v6",JSON.stringify({data,city,lat,lng,ts:Date.now()}));}catch{}
  saveHistory(city,lat,lng);
  if(data&&data.current)checkForecastAccuracy(data.current.temperature_2m,data.current.weather_code);
  if(data&&data.hourly&&!isDemo){
    const fi=Math.min(3,data.hourly.time.length-1);
    if(data.hourly.temperature_2m?.[fi]!=null)saveForecastHistory(lat,lng,city,data.hourly.temperature_2m[fi],data.hourly.weather_code?.[fi]??0);
  }

  S.lastUpdate=Date.now();
  Object.assign(S,{phase:"weather",lat,lng,city,data,isDemo,loading:false,refreshing:false,stationInfo,imgwData,modelCompare:null,confidence:null,minutely:null,air:null,expDay:null,enter:!isRef});
  render();

  if(isDemo)return;
  // Dane dochodzące w tle — aktualizują tylko swoje sekcje
  const same=()=>S.lat===lat&&S.lng===lng;
  apiMinutely(lat,lng).then(m=>{if(same()){S.minutely=m;softUpdate();}});
  apiAir(lat,lng).then(a=>{if(same()){S.air=a;softUpdate();}});
  fetchAllModelsCompare(lat,lng).then(results=>{
    if(!same()||results.length<2)return;
    const now=new Date();
    const pfx2=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}`;
    const temps=results.map(r=>{
      const idx=r.data.hourly.time.findIndex(t=>t.startsWith(pfx2));
      return idx>=0?r.data.hourly.temperature_2m[idx]:r.data.current.temperature_2m;
    });
    const ok=temps.map((t,i)=>({t,r:results[i]})).filter(x=>x.t!=null);
    if(ok.length<2)return;
    S.confidence=calcConfidence(ok.map(x=>x.t));
    S.modelCompare=ok.map(x=>({name:x.r.model,temp:Math.round(x.t*10)/10}));
    softUpdate();
  }).catch(()=>{});
}

// ═══════════════════════════════════════════════
// v6 — wyszukiwanie (aktualizuje tylko listę, pole nie traci tekstu)
// ═══════════════════════════════════════════════
function updateResults(){
  const d=$("#results");
  if(d)d.innerHTML=searchRes.map((r,i)=>`<button class="ddi" data-act="pick" data-i="${i}">${mini("pin")}<span>${esc(r.n)}</span></button>`).join("");
  const n=$("#neterr");if(n)n.hidden=!netErr;
}
function handleSearch(val){
  clearTimeout(searchTimer);
  if(val.trim().length<2){searchRes=[];updateResults();return;}
  searchTimer=setTimeout(async()=>{
    const r=await apiSearch(val);
    netErr=!r;searchRes=r||[];updateResults();
  },380);
}

// ═══════════════════════════════════════════════
// v6 — render i zdarzenia
// ═══════════════════════════════════════════════
function render(){
  if(RV.node&&RV.node.parentNode)RV.node.remove();
  const app=$("#app"),y=window.scrollY;
  if(S.phase!=="weather"&&RAF){cancelAnimationFrame(RAF);RAF=null;}
  if(S.phase==="intro"){
    app.innerHTML=introHTML();applySky(null);$("#amb").innerHTML="";S.ambKey="";
    if(searchRes.length)updateResults();
  }else if(S.phase==="loading"){
    app.innerHTML=skeletonHTML();
  }else if(S.phase==="weather"&&S.data){
    try{app.innerHTML=weatherHTML();}
    catch(err){
      console.error("weatherHTML:",err);
      app.innerHTML=`<div class="intro"><div class="err">Nie udało się wyświetlić danych. Wybierz miejsce jeszcze raz.</div><button class="btn pri wide" data-act="back">Wybierz miejsce</button></div>`;
      try{localStorage.removeItem("aura_v6");}catch{}
    }
    S.enter=false;
    const slot=$("#radar-slot");
    if(RV.node&&slot){slot.replaceWith(RV.node);if(RV.map)setTimeout(()=>RV.map.invalidateSize(),60);}
    const t=$("#top");if(t)t.classList.toggle("solid",window.scrollY>150);
  }
  window.scrollTo(0,S.phase==="weather"?y:0);
}

function toggleDay(i){
  S.expDay=S.expDay===i?null:i;
  const d=$("#daily");if(d)d.innerHTML=dailyRows();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(a==="close"){if(e.target===t||t.classList.contains("x")||e.target.closest(".x"))closeSheet();return;}
  switch(a){
    case"gps":handleGPS();break;
    case"pick":{const r=searchRes[+t.dataset.i];if(r){searchRes=[];loadW(r.lat,r.lng,r.n);}break;}
    case"quick":{const p=POPULAR[+t.dataset.i];if(p)loadW(p.lat,p.lng,p.n);break;}
    case"hist":{const h=getHistory()[+t.dataset.i];if(h)loadW(h.lat,h.lng,h.n);break;}
    case"back":searchRes=[];Object.assign(S,{phase:"intro",loading:false});render();break;
    case"refresh":if(S.lat!=null)loadW(S.lat,S.lng,S.city,true);break;
    case"day":toggleDay(+t.dataset.i);break;
    case"model":openModelSheet();break;
    case"pickmodel":{
      const m=WEATHER_MODELS.find(x=>x.id===t.dataset.id);
      closeSheet();
      if(m&&m.id!==activeModel.id){activeModel=m;if(S.lat!=null)loadW(S.lat,S.lng,S.city,true);}
      break;
    }
    case"raw":openRawSheet();break;
    case"copy":{const el=$("#rawtxt");if(el&&navigator.clipboard)navigator.clipboard.writeText(el.textContent).then(()=>{t.lastChild.textContent="Skopiowano";}).catch(()=>{});break;}
    case"radar":startRadar();break;
    case"rplay":toggleRadarPlay();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q")handleSearch(e.target.value);
  else if(e.target.id==="rslider"){if(RV.timer)toggleRadarPlay();radarShow(+e.target.value);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
window.addEventListener("scroll",()=>{const t=$("#top");if(t)t.classList.toggle("solid",window.scrollY>150);},{passive:true});
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&S.phase==="weather"&&S.lastUpdate&&Date.now()-S.lastUpdate>20*60000&&S.lat!=null)loadW(S.lat,S.lng,S.city,true);
});

(function init(){
  try{
    ["aura","aura_v2","aura_v3","aura_v4","aura_v5"].forEach(k=>{try{localStorage.removeItem(k);}catch{}});
    const c=localStorage.getItem("aura_v6");
    if(c){
      const d=JSON.parse(c);
      if(d&&d.data&&d.city&&d.data.current&&d.data.hourly&&d.data.daily&&(Date.now()-d.ts)<7200000){
        Object.assign(S,{phase:"weather",lat:d.lat,lng:d.lng,city:d.city,data:d.data,isDemo:false,lastUpdate:d.ts,stationInfo:null});
      }
    }
  }catch(e){console.warn("Cache err:",e);}
  render();
  // po odtworzeniu z cache od razu odświeżamy w tle
  if(S.phase==="weather"&&S.lat!=null)loadW(S.lat,S.lng,S.city,true);
  if("serviceWorker"in navigator&&location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW:",e.message));
  }
})();
