name: Deploy Aura to GitHub Pages
# IMGW deploy trigger: 2026-09-22
# Pages redeploy trigger: 2026-09-23

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Użyj zatwierdzonego snapshotu IMGW METEO
        shell: bash
        run: |
          set -euo pipefail
          test -s imgw-meteo.json
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('imgw-meteo.json').read_text(encoding='utf-8'))
          if not isinstance(d,dict) or not isinstance(d.get('data'),list):
              raise SystemExit('IMGW METEO: brak zatwierdzonego snapshotu')
          station=next((x for x in d['data'] if str(x.get('kod_stacji','')).strip()=='252190030'),None)
          if station is None:
              raise SystemExit('IMGW METEO: snapshot nie zawiera Głodowa 252190030')
          print('IMGW METEO snapshot z repo:',d.get('fetchedAt'),'Głodowo:',station.get('temperatura_powietrza'),station.get('temperatura_powietrza_data'),'opad10:',station.get('opad_10min'),station.get('opad_10min_data'))
          PY

      - name: Stamp buildu i wymuszenie świeżego artefaktu
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          printf '%s' "{\"buildId\":\"${BUILD_ID}\",\"commit\":\"${GITHUB_SHA}\",\"runId\":${GITHUB_RUN_ID},\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > build-version.json
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag=f'<meta name="aura-build" content="{os.environ["GITHUB_SHA"]}-{os.environ["GITHUB_RUN_ID"]}">'
          if 'name="aura-build"' in s:
              s=re.sub(r'<meta name="aura-build" content="[^"]*">', tag, s, count=1)
          else:
              s=s.replace("<head>", "<head>\n    "+tag, 1)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Generuj tylko diagnostyczny snapshot WeatherAPI
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        shell: bash
        run: |
          set -u
          LAT="52.802542"
          LNG="19.205053"
          if [ -z "${WEATHERAPI_KEY:-}" ]; then
            printf '%s' '{"source":"WeatherAPI","status":"unavailable"}' > weatherapi-visibility.json
            exit 0
          fi
          if curl --fail-with-body --retry 2 --retry-all-errors --retry-delay 2 --max-time 30 -sS -G "https://api.weatherapi.com/v1/current.json" --data-urlencode "key=$WEATHERAPI_KEY" --data-urlencode "q=$LAT,$LNG" --data-urlencode "aqi=no" -o /tmp/weatherapi.json; then
            python - <<'PY'
          import json,pathlib,time
          d=json.loads(pathlib.Path('/tmp/weatherapi.json').read_text(encoding='utf-8')); c=d.get('current') or {}; loc=d.get('location') or {}
          v=c.get('vis_km')
          if not isinstance(v,(int,float)): raise SystemExit('WeatherAPI: brak current.vis_km')
          out={'fetchedAt':int(time.time()*1000),'source':'WeatherAPI','lat':float(loc.get('lat',52.802542)),'lon':float(loc.get('lon',19.205053)),'vis_km':float(v),'last_updated_epoch':c.get('last_updated_epoch'),'last_updated':c.get('last_updated')}
          pathlib.Path('weatherapi-visibility.json').write_text(json.dumps(out,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          PY
          else
            printf '%s' '{"source":"WeatherAPI","status":"unavailable"}' > weatherapi-visibility.json
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
