name: Buduj Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Budowanie gotowego pliku APK
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Apply hourly optical cloud display patch
        run: python3 tools/patch_hourly_optical_cloud.py

      - name: Commit hourly optical cloud patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No patch commit needed'; exit 0; fi
          git commit -m 'fix: align next 3h cloud display with current optical cloud logic'
          git push

      - name: Konfiguracja Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Kompilacja i budowanie pliku APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Aura-Pogoda.apk
          cd ..
          ls -lh Aura-Pogoda.apk

      - name: Zapisz gotowy plik APK jako artefakt do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Pogoda-Android-APK
          path: Aura-Pogoda.apk
          if-no-files-found: error
          retention-days: 30
