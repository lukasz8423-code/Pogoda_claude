name: Update satellite cloud mask

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  satellite-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install satellite tools
        run: pip install --disable-pip-version-check requests

      - name: Fetch latest MSG/SEVIRI Cloud Mask
        run: python scripts/update_satellite_cloud.py

      - name: Publish satellite observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite-cloud.json
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizuj obserwację zachmurzenia satelitarnego"
          git pull --rebase origin main || true
          git push
