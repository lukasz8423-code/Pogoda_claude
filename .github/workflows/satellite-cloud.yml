name: Update satellite cloud mask

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_satellite_cloud.py"
      - ".github/workflows/satellite-cloud.yml"
  # GitHub can delay/drop scheduled jobs during high-load periods.
  # Stagger the run away from the quarter-hour marks.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  satellite-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install satellite tools
        run: pip install --disable-pip-version-check requests

      - name: Synchronize with main before generating data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Fetch latest MSG/SEVIRI Cloud Mask
        run: python scripts/update_satellite_cloud.py

      - name: Publish satellite observation safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add satellite-cloud.json public/satellite-cloud.json

            if git diff --cached --quiet; then
              echo "Brak zmian danych satelitarnych."
              exit 0
            fi

            git commit -m "Aktualizuj obserwację zachmurzenia satelitarnego" || true

            if git push origin HEAD:main; then
              echo "Publikacja zakończona."
              exit 0
            fi

            echo "Push nieudany — synchronizacja z najnowszym main i ponowne wygenerowanie danych."
            git fetch origin main
            git rebase origin/main
            python scripts/update_satellite_cloud.py
          done

          echo "Nie udało się opublikować danych po 3 próbach."
          exit 1

      # Force a fresh run when this workflow is touched; keeps the satellite
      # snapshot alive even after GitHub temporarily drops scheduled runs.
      # 2026-09-29 emergency refresh trigger.
