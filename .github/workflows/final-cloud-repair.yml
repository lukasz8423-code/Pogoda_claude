name: Final cloud pipeline repair
on:
  push:
    paths:
      - ".github/workflows/final-cloud-repair.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair cloud pipeline
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # 1) A stale static satellite snapshot must never be accepted without
          # a live EUMETView fallback. Previously the snapshot was returned even
          # when it was already too old, so fuseCloudCover marked the satellite
          # unusable and the UI stayed red.
          pattern = re.compile(r'async function apiSatelliteCloudMask\(lat,lng\)\{.*?\n\}\nfunction sameLocationSnapshot', re.S)
          replacement = r'''async function apiSatelliteCloudMask(lat,lng){
  const now=Date.now();
  let snapshot=null;
  try{
    const r=await fetch("./satellite-cloud.json?ts="+now,{cache:"no-store",signal:AbortSignal.timeout(5000)});
    if(r.ok)snapshot=await r.json();
  }catch{}

  if(snapshot){
    const slat=Number(snapshot.lat),slng=Number(snapshot.lon);
    const distanceKm=Number.isFinite(slat)&&Number.isFinite(slng)
      ?Math.sqrt(Math.pow((slat-Number(lat))*111,2)+Math.pow((slng-Number(lng))*111*Math.cos(Number(lat)*Math.PI/180),2))
      :Infinity;
    const cloud=Number(snapshot.cloudFraction??snapshot.cloud_fraction??snapshot.cloudCover??snapshot.cloud_cover??snapshot.cloudiness);
    const observationAt=snapshot.observationAt??snapshot.observedAt??snapshot.acquisitionAt??snapshot.sensingStart??snapshot.sensing_start??snapshot.time??snapshot.timestamp??snapshot.date??null;
    const obsMs=observationAt?new Date(observationAt).getTime():NaN;
    const ageMin=Number.isFinite(obsMs)?(now-obsMs)/60000:Infinity;
    const locationMatch=Number.isFinite(distanceKm)&&distanceKm<=15;
    const fresh=Number.isFinite(cloud)&&cloud>=0&&cloud<=100&&Number.isFinite(obsMs)&&ageMin>=0&&ageMin<=120;
    if(locationMatch&&fresh){
      return {...snapshot,
        cloudFraction:cloud,observationAt:String(observationAt),
        dataAvailable:true,valueFallback:cloud,status:"OK",
        distanceKm:+distanceKm.toFixed(2),locationMatch:true,live:false,
        freshness:"FRESH_SNAPSHOT",ageMinutes:+ageMin.toFixed(1)
      };
    }
  }

  // Snapshot stale/missing/wrong location: ask EUMETView for the current
  // location instead of feeding an old observation into the fusion layer.
  const live=await apiSatelliteCloudMaskWms(lat,lng);
  if(live)return {...live,distanceKm:0,locationMatch:true,freshness:"LIVE_FALLBACK"};
  return null;
}
function sameLocationSnapshot'''
          s2 = pattern.sub(replacement, s, count=1)
          if s2 == s:
              raise SystemExit("SATELLITE_FUNCTION_ANCHOR_NOT_FOUND")
          s = s2

          # 2) Make the hourly-cloud guard reject not only all-zero series but
          # also all-100 and pathological alternating 0/100 series. If the
          # existing repair function is present, wrap it with a final invariant
          # so the UI can never receive a degenerate sequence from the active model.
          marker = "function repairDegenerateHourlyCloudCover"
          if marker not in s:
              raise SystemExit("HOURLY_GUARD_FUNCTION_NOT_FOUND")
          if "function enforceHourlyCloudInvariant" not in s:
              insert_at = s.index(marker)
              invariant = r'''function enforceHourlyCloudInvariant(data){
  const a=data?.hourly?.cloud_cover;
  if(!Array.isArray(a)||a.length<4)return {applied:false,reason:"no-series"};
  const vals=a.map(Number).filter(Number.isFinite).map(v=>clamp(v,0,100));
  if(vals.length<4)return {applied:false,reason:"insufficient"};
  const extreme=vals.filter(v=>v<=1||v>=99).length/vals.length;
  const alternating=vals.slice(1).filter((v,i)=>(vals[i]<=1&&v>=99)||(vals[i]>=99&&v<=1)).length/Math.max(1,vals.length-1);
  if(extreme<0.80 && alternating<0.50)return {applied:false,reason:"normal"};
  const repaired=a.map((v,i)=>{
    const n=Number(v);
    if(!Number.isFinite(n))return v;
    const prev=i>0?Number(a[i-1]):n;
    const next=i+1<a.length?Number(a[i+1]):n;
    const bad=(n<=1||n>=99);
    if(!bad)return clamp(n,0,100);
    const neighbours=[prev,next].filter(x=>Number.isFinite(x)&&x>1&&x<99);
    if(neighbours.length)return Math.round(neighbours.reduce((x,y)=>x+y,0)/neighbours.length);
    return n;
  });
  // If every point is extreme, do not invent a fake forecast. Leave the raw
  // model series intact; the UI will show the model value rather than a made-up
  // cloud fraction. The invariant is primarily for corrupted alternating runs.
  const changed=repaired.some((v,i)=>Number(v)!==Number(a[i]));
  if(changed)data.hourly.cloud_cover=repaired;
  return {applied:changed,extremeShare:Math.round(extreme*100),alternatingShare:Math.round(alternating*100)};
}

'''
              s = s[:insert_at] + invariant + s[insert_at:]

          # Put the invariant after lockFusionState, where targetHourly contains
          # the active model series. This is a final boundary, not another source.
          anchor = 'if(!lockFusionState(token,lat,lng,data,imgwData,activeModelRawData))return;'
          if anchor not in s:
              raise SystemExit("LOCK_ANCHOR_NOT_FOUND")
          old = anchor + '\n\n  try{localStorage.setItem("aura_v7",JSON.stringify({data,city,lat,lng,ts:Date.now()}));}catch{}'
          new = anchor + '''

  const hourlyCloudInvariant=enforceHourlyCloudInvariant(data);
  S.pipelineDiag=S.pipelineDiag||{};
  S.pipelineDiag.hourlyCloudInvariant=hourlyCloudInvariant;

  try{localStorage.setItem("aura_v7",JSON.stringify({data,city,lat,lng,ts:Date.now()}));}catch{}'''
          if old not in s:
              raise SystemExit("LOCK_STORAGE_ANCHOR_NOT_FOUND")
          s=s.replace(old,new,1)

          p.write_text(s,encoding="utf-8")

      - name: Verify JavaScript and diff
        shell: bash
        run: |
          node --check index.html
          git diff --check

      - name: Publish repaired index and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Harden cloud pipeline and satellite freshness fallback"
          git push
          git rm .github/workflows/final-cloud-repair.yml
          git commit -m "Remove one-shot cloud migration workflow"
          git push
