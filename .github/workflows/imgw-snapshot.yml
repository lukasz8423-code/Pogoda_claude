name: Aktualizuj snapshot IMGW METEO

on:
  schedule:
    # Celowo poza pełną godziną — GitHub ostrzega, że wtedy obciążenie jest największe.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imgw-meteo-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pobierz IMGW METEO
        shell: bash
        run: |
          set -euo pipefail
          url="https://danepubliczne.imgw.pl/api/data/meteo/?_aura_ts=$(date +%s%3N)"
          curl --fail --silent --show-error --location             --retry 5 --retry-all-errors --retry-delay 2             --connect-timeout 10 --max-time 45             -H 'Accept: application/json'             -H 'Cache-Control: no-cache'             -o /tmp/imgw.json "$url"

          python - <<'PY'
          import json, pathlib, time
          from datetime import datetime, timezone

          raw = json.loads(pathlib.Path("/tmp/imgw.json").read_text(encoding="utf-8"))
          if not isinstance(raw, list) or not raw:
              raise SystemExit("IMGW METEO: pusty lub nieprawidłowy feed")

          station = next(
              (x for x in raw
               if str(x.get("kod_stacji", "")).strip() == "252190030"),
              None
          )
          if station is None:
              raise SystemExit("IMGW METEO: brak Głodowa 252190030")

          timestamps = [
              station.get("temperatura_powietrza_data"),
              station.get("wilgotnosc_wzgledna_data"),
              station.get("wiatr_srednia_predkosc_data"),
              station.get("wiatr_kierunek_data"),
              station.get("opad_10min_data"),
          ]
          if not any(timestamps):
              raise SystemExit("IMGW METEO: Głodowo bez timestampów")

          fetched = int(datetime.now(timezone.utc).timestamp() * 1000)
          payload = {
              "fetchedAt": fetched,
              "source": "IMGW METEO",
              "stationCount": len(raw),
              "data": raw,
          }

          pathlib.Path("imgw-meteo.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )

          print(
              "IMGW GŁODOWO:",
              json.dumps(
                  {
                      "temperature": station.get("temperatura_powietrza"),
                      "temperatureAt": station.get("temperatura_powietrza_data"),
                      "humidity": station.get("wilgotnosc_wzgledna"),
                      "humidityAt": station.get("wilgotnosc_wzgledna_data"),
                      "wind": station.get("wiatr_srednia_predkosc"),
                      "windAt": station.get("wiatr_srednia_predkosc_data"),
                      "rain10": station.get("opad_10min"),
                      "rain10At": station.get("opad_10min_data"),
                      "fetchedAt": fetched,
                  },
                  ensure_ascii=False,
              ),
          )
          PY

      - name: Commit tylko gdy dane IMGW się zmieniły
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot ma być cache'em danych, nie generatorom pustych commitów.
          git add imgw-meteo.json
          if git diff --cached --quiet; then
            echo "IMGW: dane bez zmian — brak commita."
            exit 0
          fi

          # Jeżeli użytkownik zdążył wypchnąć commit między checkoutem a push,
          # pobierz najnowsze main i zastosuj snapshot ponownie na jego szczycie.
          git fetch origin main
          git rebase origin/main

          git add imgw-meteo.json
          git commit -m "Aktualizuj snapshot IMGW METEO"
          git push origin HEAD:main
