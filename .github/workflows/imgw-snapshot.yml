name: Aktualizuj snapshot IMGW METEO

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imgw-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pobierz i porównaj IMGW METEO
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 -sS \
            "https://danepubliczne.imgw.pl/api/data/meteo/?_=${RANDOM}" -o /tmp/imgw.json

          python - <<'PY'
          import json, pathlib, time

          raw=json.loads(pathlib.Path("/tmp/imgw.json").read_text(encoding="utf-8"))
          if not isinstance(raw,list):
              raise SystemExit("IMGW METEO: nieprawidłowy format")

          station=next((x for x in raw if str(x.get("kod_stacji","")).strip()=="252190030"),None)
          if station is None:
              raise SystemExit("IMGW METEO: brak Głodowa 252190030")

          target=pathlib.Path("imgw-meteo.json")
          new_data=raw

          old_data=None
          if target.exists():
              try:
                  old=json.loads(target.read_text(encoding="utf-8"))
                  old_data=old.get("data") if isinstance(old,dict) else old
              except Exception:
                  old_data=None

          old_station=None
          if isinstance(old_data,list):
              old_station=next((x for x in old_data if str(x.get("kod_stacji","")).strip()=="252190030"),None)

          if old_data == new_data and old_station == station:
              print("IMGW METEO: snapshot bez zmian — brak commita.")
          else:
              out={
                  "fetchedAt":int(time.time()*1000),
                  "source":"IMGW METEO",
                  "stationCount":len(raw),
                  "data":new_data
              }
              target.write_text(
                  json.dumps(out,separators=(",",":"),ensure_ascii=False),
                  encoding="utf-8"
              )
              print(
                  "IMGW METEO: snapshot zmieniony; Głodowo:",
                  station.get("temperatura_powietrza"),
                  station.get("temperatura_powietrza_data"),
                  "opad10:",
                  station.get("opad_10min"),
                  station.get("opad_10min_data")
              )
          PY

      - name: Commit tylko gdy snapshot się zmienił
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imgw-meteo.json
          if git diff --cached --quiet; then
            echo "Brak zmian IMGW — nic do commitowania."
            exit 0
          fi
          git commit -m "Aktualizuj snapshot IMGW METEO"
          git push
