name: IMGW snapshot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch IMGW METEO
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://danepubliczne.imgw.pl/api/data/meteo/ -o /tmp/imgw.json
          python - <<'PY'
          import json, time
          with open('/tmp/imgw.json','r',encoding='utf-8') as f:
              data=json.load(f)
          if not isinstance(data,list):
              raise SystemExit("IMGW response is not an array")
          out={"fetchedAt":int(time.time()*1000),"data":data}
          with open('imgw-meteo.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print("stations:",len(data))
          PY

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          git add imgw-meteo.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Aktualizuj snapshot IMGW METEO"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
